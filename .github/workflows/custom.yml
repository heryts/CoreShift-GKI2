name: Custom Kernel Build

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        type: choice
        required: true
        options: ["5.10", "6.1", "6.6"]
      manager:
        type: choice
        required: true
        options: ["Vanilla", "KernelSU", "KernelSU-Backslashxx", "KernelSU-Next", "KSUN-Susfs-Hookless", "KowSU", "ResukiSU", "Rissu", "Wild_KSU"]
        default: "Vanilla"
      manager_ref:
        description: "Optional manager git ref/commit/tag"
        required: false
        default: ""
      source_mode:
        type: choice
        required: true
        options: ["google-lts", "maintained", "pixel", "custom"]
        default: "google-lts"
      pixel_branch:
        type: choice
        required: false
        options:
          - "android14-gs-pixel-6.1"
          - "android-gs-raviole-6.1-android16"
          - "android-gs-bluejay-6.1-android16"
          - "android-gs-akita-6.1-android16"
        default: "android14-gs-pixel-6.1"
      source_repo:
        description: "Custom kernel/common repo URL, used only when source_mode=custom"
        required: false
        default: ""
      source_ref:
        description: "Optional source git ref/branch/tag/commit"
        required: false
        default: ""
      kmi_bypass:
        type: choice
        required: true
        options: ["off", "on"]
        default: "off"
        description: "Experimental: bypass strict KMI symbol-list checks for incompatible custom/maintained sources"
      lto:
        type: choice
        required: true
        options: ["thin", "full", "none"]
        default: "thin"
      ikconfig:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      susfs:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      nomount_maxsteeel:
        description: "NoMount_support (On:maxsteeel-nomount, Off:KSUN-Hookless-Only)"
        type: choice
        required: true
        options: ["off", "on"]
        default: "on"
      baseband_guard:
        description: "Apply Baseband Guard / BBG patches"
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      droidspaces:
        description: "Droidspaces support (5.10~6.6: slot patch, 6.12: on/off)"
        type: choice
        required: true
        options: ["off", "678", "123", "345"]
        default: "off"
      droidspaces_ntsync:
        description: "NTSync support for Droidspaces containers"
        type: choice
        required: true
        options: ["off", "on"]
        default: "off"
      container_features:
        description: "Enable container-related kernel options"
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      re_kernel:
        description: "Enable Re-Kernel Driver"
        type: choice
        required: true
        options: ["off", "on"]
        default: "off"
      strict_config:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      legacy_kmi_check:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      debug_features:
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      heavy_debug_features:
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      publish_mode:
        type: choice
        required: true
        options: ["release", "artifact", "both"]
        default: "artifact"

jobs:
  build:
    name: ${{ inputs.kernel_version }} / ${{ inputs.manager }} / SUSFS ${{ inputs.susfs }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.manager }}" = "Vanilla" ] && [ "${{ inputs.susfs }}" = "on" ]; then
            echo "::error::SUSFS requires a KernelSU-compatible manager; manager=Vanilla cannot use susfs=on"
            exit 1
          fi

          if [ "${{ inputs.source_mode }}" = "custom" ] && [ -z "${{ inputs.source_repo }}" ]; then
            echo "::error::source_repo is required when source_mode=custom"
            exit 1
          fi

          if [ "${{ inputs.source_mode }}" = "pixel" ] && [ "${{ inputs.kernel_version }}" != "6.1" ]; then
            echo "::error::source_mode=pixel currently supports Pixel 6+ 6.1 branches only; choose kernel_version=6.1"
            exit 1
          fi

          if [ "${{ inputs.droidspaces_ntsync }}" = "on" ] && [ "${{ inputs.droidspaces }}" = "off" ]; then
            echo "::error::droidspaces_ntsync=on requires droidspaces to be enabled (not 'off')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set variables
        uses: ./.github/actions/setup-vars
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Select Pixel manifest branch
        if: inputs.source_mode == 'pixel'
        shell: bash
        run: |
          set -euo pipefail

          echo "BRANCH=${{ inputs.pixel_branch }}" >> "$GITHUB_ENV"
          echo "BUILD_ENGINE=kleaf" >> "$GITHUB_ENV"
          echo "Pixel source mode selected: official Google Pixel manifest branch ${{ inputs.pixel_branch }}"

      - name: Set custom output name
        id: custom-name
        shell: bash
        run: |
          set -euo pipefail

          susfs_label=""
          if [ "${{ inputs.susfs }}" = "on" ]; then
            susfs_label="-susfs"
          fi

          bbg_label=""
          if [ "${{ inputs.baseband_guard }}" = "on" ]; then
            bbg_label="-bbg"
          fi

          variant_suffix="${susfs_label}${bbg_label}"
          final_name="custom-${{ inputs.kernel_version }}-${{ inputs.manager }}${variant_suffix}-${DATE}-${{ github.run_number }}"
          config_base="config-${{ inputs.kernel_version }}-${{ inputs.manager }}${variant_suffix}"

          {
            echo "date=${DATE}"
            echo "variant_suffix=${variant_suffix}"
            echo "final_name=${final_name}"
            echo "config_base=${config_base}"
          } >> "$GITHUB_OUTPUT"

      - name: Install host tools
        uses: ./.github/actions/install-host-tools
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Install repo
        uses: ./.github/actions/install-repo

      - name: Sync source
        uses: ./.github/actions/sync-kernel
        with:
          source_mode: ${{ inputs.source_mode }}

      - name: Resolve source repo
        id: source-repo
        shell: bash
        run: |
          set -euo pipefail

          effective_source_repo=""
          effective_source_ref="${{ inputs.source_ref }}"

          case "${{ inputs.source_mode }}" in
            google-lts)
              effective_source_ref=""
              ;;
            pixel)
              effective_source_ref=""
              ;;
            maintained)
              case "${{ inputs.kernel_version }}" in
                5.10)
                  effective_source_repo="https://github.com/ramabondanp/android_kernel_common-5.10"
                  ;;
                6.1)
                  effective_source_repo="https://github.com/ramabondanp/android_kernel_common-6.1"
                  ;;
                6.6)
                  effective_source_repo="https://github.com/ramabondanp/android_kernel_common-6.6"
                  ;;
                *)
                  echo "::error::No maintained source repo for kernel_version=${{ inputs.kernel_version }}"
                  exit 1
                  ;;
              esac
              ;;
            custom)
              effective_source_repo="${{ inputs.source_repo }}"
              ;;
            *)
              echo "::error::unsupported source_mode=${{ inputs.source_mode }}"
              exit 1
              ;;
          esac

          {
            echo "source_repo=$effective_source_repo"
            echo "source_ref=$effective_source_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Replace kernel/common source
        if: inputs.source_mode == 'maintained' || inputs.source_mode == 'custom'
        uses: ./.github/actions/replace-common-source
        with:
          source_repo: ${{ steps.source-repo.outputs.source_repo }}
          source_ref: ${{ steps.source-repo.outputs.source_ref }}

      - name: Clean bundled KernelSU staging leftovers
        if: inputs.source_mode == 'maintained' || inputs.source_mode == 'custom'
        uses: ./.github/actions/fix-stale-kernelsu-kconfig
        with:
          remove_bundled_staging: "true"

      - name: Apply source fixes
        if: inputs.source_mode == 'maintained' || inputs.source_mode == 'custom'
        uses: ./.github/actions/apply-source-fixes
        with:
          kernel_version: ${{ inputs.kernel_version }}
          source_mode: ${{ inputs.source_mode }}

      - name: Ensure expected Clang
        if: inputs.source_mode == 'maintained' || inputs.source_mode == 'custom'
        uses: ./.github/actions/ensure-expected-clang
        with:
          enabled: "true"
          kernel_version: ${{ inputs.kernel_version }}

      - name: Init manager
        if: inputs.manager != 'Vanilla'
        uses: ./.github/actions/init-manager
        with:
          manager: ${{ inputs.manager }}
          manager_ref: ${{ inputs.manager_ref }}
          susfs: ${{ inputs.susfs }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: DEBUG - test xxKSU patch against midori01/KernelSU
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/midori01/KernelSU.git /tmp/midori-ksu
          cd /tmp/midori-ksu
          git apply --check --verbose \
            "$GITHUB_WORKSPACE/.github/patches/susfs4ksu/backslashxx/0001-xxKSU-kernel-implement-susfs-v2_2_0.patch" \
            2>&1 | tee /tmp/midori_check.log

      - name: Apply SUSFS4KSU patches
        if: inputs.susfs == 'on' && inputs.manager != 'KSUN-Susfs-Hookless'
        uses: ./.github/actions/apply-susfs
        with:
          kernel_version: ${{ inputs.kernel_version }}
          manager: ${{ inputs.manager }}

      - name: Apply ReSukiSU manual hooks
        if: inputs.manager == 'ResukiSU' && inputs.susfs == 'off'
        uses: ./.github/actions/apply-resukisu-hooks
        with:
          kernel_version: ${{ inputs.kernel_version }}
          
      - name: Apply NoMount support (maxsteeel)
        if: inputs.nomount_maxsteeel == 'on'
        uses: ./.github/actions/apply-nomount
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Baseband Guard
        if: inputs.baseband_guard == 'on'
        uses: ./.github/actions/apply-baseband-guard
        with:
          baseband_guard: ${{ inputs.baseband_guard }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Droidspaces support
        if: inputs.droidspaces != 'off'
        uses: ./.github/actions/apply-droidspaces
        with:
          kernel_version: ${{ inputs.kernel_version }}
          droidspaces: ${{ inputs.droidspaces }}

      - name: Apply NTSync support
        if: inputs.droidspaces != 'off' && inputs.droidspaces_ntsync == 'on'
        uses: ./.github/actions/apply-ntsync
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Re-Kernel driver
        if: inputs.re_kernel == 'on'
        uses: ./.github/actions/apply-re-kernel
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Fix Patch
        uses: ./.github/actions/apply-unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply network patches
        uses: ./.github/actions/apply-network-patches
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Create private config fragment
        uses: ./.github/actions/create-config-fragment
        with:
          manager: ${{ inputs.manager }}
          ikconfig: ${{ inputs.ikconfig }}
          susfs: ${{ inputs.susfs }}
          nomount_maxsteeel: ${{ inputs.nomount_maxsteeel }}
          baseband_guard: ${{ inputs.baseband_guard }}
          droidspaces: ${{ inputs.droidspaces }}
          droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
          container_core: ${{ inputs.container_features }}
          container_ipc: ${{ inputs.container_features }}
          container_networking: ${{ inputs.container_features }}
          re_kernel: ${{ inputs.re_kernel }}
          debug_features: ${{ inputs.debug_features }}
          heavy_debug_features: ${{ inputs.heavy_debug_features }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply IPC KABI patches
        if: inputs.container_features == 'on'
        uses: ./.github/actions/apply-ipc-kabi-patches
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Install legacy CoreShift build config
        if: inputs.kernel_version == '5.10'
        uses: ./.github/actions/install-legacy-private-fragment
        with:
          strict_config: ${{ inputs.strict_config }}

      - name: Disable legacy 5.10 defconfig normalization check
        if: inputs.kernel_version == '5.10'
        uses: ./.github/actions/disable-legacy-defconfig-check

      - name: Disable legacy 5.10 strict KMI check for private build
        if: inputs.kernel_version == '5.10' && inputs.legacy_kmi_check == 'off'
        uses: ./.github/actions/disable-legacy-kmi-check

      - name: Add swap for full LTO
        if: inputs.lto == 'full'
        uses: ./.github/actions/add-swap
        with:
          size_gb: "16"

      - name: Add swap for thin LTO
        if: inputs.lto == 'thin'
        uses: ./.github/actions/add-swap
        with:
          size_gb: "8"

      - name: Commit kernel changes
        uses: ./.github/actions/commit-kernel-changes

      - name: Build kernel
        uses: ./.github/actions/build-kernel
        with:
          lto: ${{ inputs.lto }}
          kernel_version: ${{ inputs.kernel_version }}
          source_mode: ${{ inputs.source_mode }}
          kmi_bypass: ${{ inputs.kmi_bypass }}

      - name: Write compiler metadata
        uses: ./.github/actions/write-compiler-metadata
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Verify final config
        uses: ./.github/actions/verify-final-config
        with:
          strict_config: ${{ inputs.strict_config }}

      - name: Export final config
        uses: ./.github/actions/export-final-config
        env:
          CONFIG_NAME_SUFFIX: ${{ steps.custom-name.outputs.variant_suffix }}
        with:
          kernel_version: ${{ inputs.kernel_version }}
          manager: ${{ inputs.manager }}
          susfs: ${{ inputs.susfs }}

      - name: Package
        uses: ./.github/actions/package-kernel
        with:
          kernel_version: ${{ inputs.kernel_version }}
          manager: ${{ inputs.manager }}
          susfs: ${{ inputs.susfs }}
          final_name: ${{ steps.custom-name.outputs.final_name }}

      - name: Stage artifact outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p image-artifact
          cp "out/Image-${FINAL_NAME}" image-artifact/
          cp compiler-version.txt image-artifact/

          if [ "${{ inputs.publish_mode }}" = "artifact" ] || [ "${{ inputs.publish_mode }}" = "both" ]; then
            mkdir -p artifact-root
            cp -a ak3_work/. artifact-root/
            cp compiler-version.txt artifact-root/
          fi

      - name: Upload flashable artifact tree
        if: inputs.publish_mode == 'artifact' || inputs.publish_mode == 'both'
        uses: actions/upload-artifact@v6
        with:
          name: flashable-${{ inputs.kernel_version }}-${{ inputs.manager }}${{ steps.custom-name.outputs.variant_suffix }}-${{ steps.custom-name.outputs.date }}
          path: artifact-root/**
          if-no-files-found: error

      - name: Upload raw Image artifact
        uses: actions/upload-artifact@v6
        with:
          name: image-${{ inputs.kernel_version }}-${{ inputs.manager }}${{ steps.custom-name.outputs.variant_suffix }}-${{ steps.custom-name.outputs.date }}
          path: |
            image-artifact/Image-*
            image-artifact/compiler-version.txt
          if-no-files-found: error

      - name: Upload config artifact
        uses: actions/upload-artifact@v6
        with:
          name: config-${{ inputs.kernel_version }}-${{ inputs.manager }}${{ steps.custom-name.outputs.variant_suffix }}-${{ steps.custom-name.outputs.date }}
          path: |
            compiler-version.txt
            out/${{ steps.custom-name.outputs.config_base }}.txt
            out/${{ steps.custom-name.outputs.config_base }}.gz
          if-no-files-found: error

      - name: Stage release zip
        if: inputs.publish_mode == 'release' || inputs.publish_mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$PWD/release-staging"
          zip_path="${{ steps.custom-name.outputs.final_name }}.zip"

          mkdir -p "$release_dir"

          if [ ! -f "$zip_path" ]; then
            echo "::error::Release requested but no flashable zip was found at $zip_path"
            exit 1
          fi

          cp "$zip_path" "$release_dir/"

      - name: Write release body
        if: inputs.publish_mode == 'release' || inputs.publish_mode == 'both'
        shell: bash
        run: |
          set -euo pipefail

          susfs_label="Disabled"
          if [ "${{ inputs.susfs }}" = "on" ]; then
            susfs_label="Enabled"
          fi

          bbg_label="Disabled"
          if [ "${{ inputs.baseband_guard }}" = "on" ]; then
            bbg_label="Enabled"
          fi

          cat > release-body.md <<EOF
          CoreShift GKI

          - Kernel: ${{ inputs.kernel_version }}
          - Manager: ${{ inputs.manager }}
          - LTO: ${{ inputs.lto }}
          - SUSFS: ${susfs_label}
          - BBG: ${bbg_label}
          - Date: ${DATE}

          Configs, raw images, and compiler metadata are available in workflow artifacts, not release assets.
          EOF

      - name: Create release
        if: inputs.publish_mode == 'release' || inputs.publish_mode == 'both'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.custom-name.outputs.final_name }}
          name: ${{ steps.custom-name.outputs.final_name }}
          files: release-staging/*.zip
          body_path: release-body.md
