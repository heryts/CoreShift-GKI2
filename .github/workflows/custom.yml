name: Custom Kernel Build

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        type: choice
        required: true
        options: ["5.10", "6.1", "6.6", "6.12"]
      manager:
        type: choice
        required: true
        options: ["Vanilla", "KernelSU", "KernelSU-Backslashxx", "KernelSU-Backslashxx-Tinyfs", "KernelSU-Midori-Manual", "KernelSU-Midori-BranchLink", "KernelSU-Midori-Tamper", "KowSU", "KernelSU-Next", "KSUN-Susfs-Hookless", "ResukiSU", "Rissu", "Wild_KSU"]
        default: "Vanilla"
      manager_ref:
        description: "Optional manager git ref/commit/tag"
        required: false
        default: ""
      source_mode:
        type: choice
        required: true
        options: ["google-lts", "maintained", "pixel", "cloudfox", "custom"]
        default: "google-lts"
      pixel_branch:
        type: choice
        required: false
        options:
          - "android14-gs-pixel-6.1"
          - "android-gs-raviole-6.1-android16"
          - "android-gs-bluejay-6.1-android16"
          - "android-gs-akita-6.1-android16"
        default: "android14-gs-pixel-6.1"
      source_repo:
        description: "Custom kernel/common repo URL, used only when source_mode=custom"
        required: false
        default: ""
      source_ref:
        description: "Optional source git ref/branch/tag/commit"
        required: false
        default: ""
      kmi_bypass:
        type: choice
        required: true
        options: ["off", "on"]
        default: "off"
        description: "Experimental: bypass strict KMI symbol-list checks for incompatible custom/maintained sources"
      lto:
        type: choice
        required: true
        options: ["thin", "full", "none"]
        default: "thin"
      ikconfig:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      susfs:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      nomount_maxsteeel:
        description: "NoMount_support (On:maxsteeel-nomount, Off:KSUN-Hookless-Only)"
        type: choice
        required: true
        options: ["off", "on"]
        default: "on"
      kpm_support:
        description: "Patch the built Image for KPM support"
        type: choice
        required: true
        options: ["off", "on"]
        default: "off"
      kpm_superkey:
        description: "Optional superkey to embed (leave empty for no superkey)"
        required: false
        default: ""
      baseband_guard:
        description: "Apply Baseband Guard / BBG patches"
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      droidspaces:
        description: "Droidspaces support (5.10~6.6: slot patch, 6.12: on/off)"
        type: choice
        required: true
        options: ["off", "678", "123", "345", "on"]
        default: "off"
      droidspaces_ntsync:
        description: "NTSync support for Droidspaces containers"
        type: choice
        required: true
        options: ["off", "on"]
        default: "off"
      container_features:
        description: "Enable container-related kernel options"
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      re_kernel:
        description: "Enable Re-Kernel Driver"
        type: choice
        required: true
        options: ["off", "on"]
        default: "off"
      strict_config:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      legacy_kmi_check:
        type: choice
        required: true
        options: ["on", "off"]
        default: "on"
      debug_features:
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      heavy_debug_features:
        type: choice
        required: true
        options: ["on", "off"]
        default: "off"
      publish_mode:
        type: choice
        required: true
        options: ["release", "artifact", "both"]
        default: "artifact"
      build_stamp:
        description: "Custom kernel version. Format: 'NAME|DATE'. Leave empty to keep default."
        required: false
        default: ""

jobs:
  build:
    name: ${{ inputs.kernel_version }} / ${{ inputs.manager }} / SUSFS ${{ inputs.susfs }} / KPM ${{ inputs.kpm_support }} / BBG ${{ inputs.baseband_guard }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.manager }}" = "Vanilla" ] && [ "${{ inputs.susfs }}" = "on" ]; then
            echo "::error::SUSFS requires a KernelSU-compatible manager; manager=Vanilla cannot use susfs=on"
            exit 1
          fi


          if [ "${{ inputs.manager }}" = "KernelSU-Backslashxx-Tinyfs" ] && [ "${{ inputs.susfs }}" = "on" ]; then
            echo "::error::SUSFS is not supported on the tinyfs branch; set susfs=off, or choose manager=KernelSU-Backslashxx for SUSFS support"
            exit 1
          fi

          if [ "${{ inputs.source_mode }}" = "custom" ] && [ -z "${{ inputs.source_repo }}" ]; then
            echo "::error::source_repo is required when source_mode=custom"
            exit 1
          fi

          if [ "${{ inputs.source_mode }}" = "pixel" ] && [ "${{ inputs.kernel_version }}" != "6.1" ]; then
            echo "::error::source_mode=pixel currently supports Pixel 6+ 6.1 branches only; choose kernel_version=6.1"
            exit 1
          fi

          if [ "${{ inputs.droidspaces_ntsync }}" = "on" ] && [ "${{ inputs.droidspaces }}" = "off" ]; then
            echo "::error::droidspaces_ntsync=on requires droidspaces to be enabled (not 'off')"
            exit 1
          fi

          if [ "${{ inputs.kernel_version }}" = "6.12" ] && [ "${{ inputs.droidspaces }}" != "off" ] && [ "${{ inputs.droidspaces }}" != "on" ]; then
            echo "::error::kernel_version=6.12 uses droidspaces=on/off only; slot values (678/123/345) are for 5.10~6.6"
            exit 1
          fi

          if [ "${{ inputs.kernel_version }}" != "6.12" ] && [ "${{ inputs.droidspaces }}" = "on" ]; then
            echo "::error::droidspaces=on is only valid for kernel_version=6.12; choose a slot value (678/123/345) or 'off' for 5.10~6.6"
            exit 1
          fi

          if [ "${{ inputs.source_mode }}" = "cloudfox" ] && [ "${{ inputs.manager }}" != "Vanilla" ] && [ "${{ inputs.manager }}" != "KowSU" ]; then
            echo "::error::source_mode=cloudfox already vendors the KowSU driver; choose manager=Vanilla or manager=KowSU instead of ${{ inputs.manager }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set variables
        uses: ./.github/actions/setup-vars
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Select Pixel manifest branch
        if: inputs.source_mode == 'pixel'
        shell: bash
        run: |
          set -euo pipefail

          echo "BRANCH=${{ inputs.pixel_branch }}" >> "$GITHUB_ENV"
          echo "BUILD_ENGINE=kleaf" >> "$GITHUB_ENV"
          echo "Pixel source mode selected: official Google Pixel manifest branch ${{ inputs.pixel_branch }}"

      - name: Generate build output name
        id: build-name
        shell: bash
        run: |
          set -euo pipefail

          susfs_label=""
          susfs_status="Disabled"
          if [ "${{ inputs.susfs }}" = "on" ]; then
            susfs_label="-susfs"
            susfs_status="Enabled"
          fi

          kpm_label=""
          kpm_status="Disabled"
          if [ "${{ inputs.kpm_support }}" = "on" ]; then
            kpm_label="-kpm"
            kpm_status="Enabled"
          fi

          bbg_label=""
          bbg_status="Disabled"
          if [ "${{ inputs.baseband_guard }}" = "on" ]; then
            bbg_label="-bbg"
            bbg_status="Enabled"
          fi

          variant_suffix="${susfs_label}${kpm_label}${bbg_label}"
          final_name="custom-${{ inputs.kernel_version }}-${{ inputs.manager }}${variant_suffix}-${DATE}-${{ github.run_number }}"
          config_base="config-${{ inputs.kernel_version }}-${{ inputs.manager }}${variant_suffix}"

          publish_release="false"
          publish_artifact="false"
          case "${{ inputs.publish_mode }}" in
            release) publish_release="true" ;;
            artifact) publish_artifact="true" ;;
            both) publish_release="true"; publish_artifact="true" ;;
          esac

          {
            echo "date=${DATE}"
            echo "variant_suffix=${variant_suffix}"
            echo "final_name=${final_name}"
            echo "config_base=${config_base}"
            echo "susfs_status=${susfs_status}"
            echo "kpm_status=${kpm_status}"
            echo "bbg_status=${bbg_status}"
            echo "publish_release=${publish_release}"
            echo "publish_artifact=${publish_artifact}"
          } >> "$GITHUB_OUTPUT"

      - name: Parse custom build stamp
        id: build-stamp
        shell: bash
        run: |
          set -euo pipefail

          RAW="${{ inputs.build_stamp }}"
          BUILD_NAME=""
          BUILD_DATE=""

          if [ -n "$RAW" ]; then
            BUILD_NAME="${RAW%%|*}"
            if [ "$RAW" != "${RAW#*|}" ]; then
              BUILD_DATE="${RAW#*|}"
            fi
          fi

          echo "custom_build_name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "custom_build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

          if [ -n "$BUILD_NAME" ] || [ -n "$BUILD_DATE" ]; then
            echo "Custom build stamp requested -> name='${BUILD_NAME}' date='${BUILD_DATE}'"
          fi

      - name: Install host tools
        uses: ./.github/actions/install-host-tools
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Install repo
        uses: ./.github/actions/install-repo

      - name: Sync source
        uses: ./.github/actions/sync-kernel
        with:
          source_mode: ${{ inputs.source_mode }}

      - name: Resolve source repo
        id: source-repo
        shell: bash
        run: |
          set -euo pipefail

          effective_source_repo=""
          effective_source_ref="${{ inputs.source_ref }}"

          case "${{ inputs.source_mode }}" in
            google-lts)
              effective_source_ref=""
              ;;
            pixel)
              effective_source_ref=""
              ;;
            maintained)
              case "${{ inputs.kernel_version }}" in
                5.10)
                  effective_source_repo="https://github.com/ramabondanp/android_kernel_common-5.10"
                  ;;
                6.1)
                  effective_source_repo="https://github.com/ramabondanp/android_kernel_common-6.1"
                  ;;
                6.6)
                  effective_source_repo="https://github.com/ramabondanp/android_kernel_common-6.6"
                  ;;
                6.12)
                  effective_source_repo="https://android.googlesource.com/kernel/common"
                  if [ -z "$effective_source_ref" ]; then
                    effective_source_ref="android16-6.12"
                  fi
                  ;;
                *)
                  echo "::error::No maintained source repo for kernel_version=${{ inputs.kernel_version }}"
                  exit 1
                  ;;
              esac
              ;;
            cloudfox)
              effective_source_repo="https://github.com/CloudFox-INC/CloudFox-Kernel"
              if [ -z "$effective_source_ref" ]; then
                effective_source_ref="android12-5.10-cloudfox"
              fi
              ;;
            custom)
              effective_source_repo="${{ inputs.source_repo }}"
              ;;
            *)
              echo "::error::unsupported source_mode=${{ inputs.source_mode }}"
              exit 1
              ;;
          esac

          is_alt_source="false"
          case "${{ inputs.source_mode }}" in
            maintained|cloudfox|custom)
              is_alt_source="true"
              ;;
          esac

          {
            echo "source_repo=$effective_source_repo"
            echo "source_ref=$effective_source_ref"
            echo "is_alt_source=$is_alt_source"
          } >> "$GITHUB_OUTPUT"

      - name: Replace kernel/common source
        if: steps.source-repo.outputs.is_alt_source == 'true'
        uses: ./.github/actions/replace-common-source
        with:
          source_repo: ${{ steps.source-repo.outputs.source_repo }}
          source_ref: ${{ steps.source-repo.outputs.source_ref }}

      - name: Clean bundled KernelSU staging leftovers
        if: steps.source-repo.outputs.is_alt_source == 'true'
        uses: ./.github/actions/fix-stale-kernelsu-kconfig
        with:
          remove_bundled_staging: "true"

      - name: Apply source fixes
        if: steps.source-repo.outputs.is_alt_source == 'true'
        uses: ./.github/actions/apply-source-fixes
        with:
          kernel_version: ${{ inputs.kernel_version }}
          source_mode: ${{ inputs.source_mode }}

      - name: Ensure expected Clang
        if: steps.source-repo.outputs.is_alt_source == 'true'
        uses: ./.github/actions/ensure-expected-clang
        with:
          enabled: "true"
          kernel_version: ${{ inputs.kernel_version }}

      - name: Init manager
        if: inputs.manager != 'Vanilla'
        uses: ./.github/actions/init-manager
        with:
          manager: ${{ inputs.manager }}
          manager_ref: ${{ inputs.manager_ref }}
          susfs: ${{ inputs.susfs }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply ZRAM Patches
        if: inputs.source_mode != 'cloudfox'
        uses: ./.github/actions/apply-zram
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply FUSE-BPF backport
        if: inputs.kernel_version == '5.10'
        uses: ./.github/actions/apply-fuse-bpf
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Patches
        uses: ./.github/actions/apply-unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply network patches
        uses: ./.github/actions/apply-network-patches
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply SUSFS4KSU patches
        if: inputs.susfs == 'on' && inputs.manager != 'KSUN-Susfs-Hookless'
        uses: ./.github/actions/apply-susfs
        with:
          kernel_version: ${{ inputs.kernel_version }}
          manager: ${{ inputs.manager }}

      - name: Debug dump SUSFS-patched sources
        if: inputs.susfs == 'on' && inputs.manager != 'KSUN-Susfs-Hookless'
        working-directory: kernel/common
        shell: bash
        run: |
          set +e
          DUMP_DIR="${{ github.workspace }}/susfs-debug-dump"
          mkdir -p "$DUMP_DIR"

          echo "== copying post-patch source files =="
          for f in fs/proc/task_mmu.c fs/exec.c fs/proc/base.c security/selinux/hooks.c; do
            if [ -f "$f" ]; then
              mkdir -p "$DUMP_DIR/post-patch/$(dirname "$f")"
              cp "$f" "$DUMP_DIR/post-patch/$f"
            else
              echo "missing: $f" >> "$DUMP_DIR/post-patch-missing.txt"
            fi
          done

          echo "== copying original (un-patched) susfs4ksu source patch, if still on disk =="
          SUSFS_TMP_DIR="${RUNNER_TEMP:-/tmp}/susfs4ksu"
          if [ -d "$SUSFS_TMP_DIR" ]; then
            mkdir -p "$DUMP_DIR/susfs4ksu-source"
            cp -a "$SUSFS_TMP_DIR/kernel_patches"/*.patch "$DUMP_DIR/susfs4ksu-source/" 2>/dev/null
          fi

          echo "== git diff for the flagged files (context around fuzzy hunks) =="
          git diff -- fs/proc/task_mmu.c fs/exec.c fs/proc/base.c security/selinux/hooks.c \
            > "$DUMP_DIR/post-patch-diff.txt" 2>&1

          exit 0

      - name: Upload SUSFS debug dump
        if: inputs.susfs == 'on' && inputs.manager != 'KSUN-Susfs-Hookless'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-debug-dump-${{ inputs.kernel_version }}-${{ inputs.manager }}
          path: susfs-debug-dump/**
          if-no-files-found: warn
          retention-days: 7

      - name: Apply NoMount support (maxsteeel)
        if: inputs.nomount_maxsteeel == 'on'
        uses: ./.github/actions/apply-nomount
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Baseband Guard
        if: inputs.baseband_guard == 'on'
        uses: ./.github/actions/apply-baseband-guard
        with:
          baseband_guard: ${{ inputs.baseband_guard }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Droidspaces support
        if: inputs.droidspaces != 'off'
        uses: ./.github/actions/apply-droidspaces
        with:
          kernel_version: ${{ inputs.kernel_version }}
          droidspaces: ${{ inputs.droidspaces }}

      - name: Apply NTSync support
        if: inputs.droidspaces != 'off' && inputs.droidspaces_ntsync == 'on'
        uses: ./.github/actions/apply-ntsync
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply IPC KABI patches
        if: inputs.container_features == 'on' && inputs.droidspaces == 'off'
        uses: ./.github/actions/apply-ipc-kabi-patches
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Re-Kernel driver
        if: inputs.re_kernel == 'on'
        uses: ./.github/actions/apply-re-kernel
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Create private config fragment
        uses: ./.github/actions/create-config-fragment
        with:
          manager: ${{ inputs.manager }}
          ikconfig: ${{ inputs.ikconfig }}
          susfs: ${{ inputs.susfs }}
          nomount_maxsteeel: ${{ inputs.nomount_maxsteeel }}
          kpm_support: ${{ inputs.kpm_support }}
          baseband_guard: ${{ inputs.baseband_guard }}
          droidspaces: ${{ inputs.droidspaces }}
          droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
          container_core: ${{ inputs.container_features }}
          container_ipc: ${{ inputs.container_features }}
          container_networking: ${{ inputs.container_features }}
          re_kernel: ${{ inputs.re_kernel }}
          debug_features: ${{ inputs.debug_features }}
          heavy_debug_features: ${{ inputs.heavy_debug_features }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply source fixes for unbuilt drivers
        uses: ./.github/actions/apply-fixes-for-kernel-6.12
        with:
          kernel_version: ${{ inputs.kernel_version }}
          
      - name: Install legacy CoreShift build config
        if: inputs.kernel_version == '5.10'
        uses: ./.github/actions/install-legacy-private-fragment
        with:
          strict_config: ${{ inputs.strict_config }}

      - name: Disable legacy 5.10 defconfig normalization check
        if: inputs.kernel_version == '5.10'
        uses: ./.github/actions/disable-legacy-defconfig-check

      - name: Disable legacy 5.10 strict KMI check for private build
        if: inputs.kernel_version == '5.10' && inputs.legacy_kmi_check == 'off'
        uses: ./.github/actions/disable-legacy-kmi-check

      - name: Add swap for full LTO
        if: inputs.lto == 'full'
        uses: ./.github/actions/add-swap
        with:
          size_gb: "16"

      - name: Add swap for thin LTO
        if: inputs.lto == 'thin'
        uses: ./.github/actions/add-swap
        with:
          size_gb: "8"

      - name: Patch ReSukiSU Kbuild for Kleaf/Bazel sandbox compatibility
        if: inputs.manager == 'ResukiSU'
        working-directory: kernel/common
        run: |
          set -e
          # Root cause: Bazel's common_kernel_sources filegroup globs "**" with
          # exclude = [".git/**", ...]. Bazel's glob() also never matches any
          # hidden path (dot-prefixed) regardless of the exclude list, at any
          # depth. So KernelSU/.git (the submodule ReSukiSU/Kbuild reads via
          # `test -e $(KSU_SRC)/../.git`, and via live `git` shell-outs for the
          # version banner) never gets materialized into the sandboxed source
          # tree that the kernel_aarch64 kernel_build() action actually sees.
          # Outside the sandbox the submodule is 100% valid (git rev-parse HEAD
          # resolves fine) - it's purely a "Kbuild expects a live .git inside a
          # tree Bazel deliberately strips it from" mismatch.
          #
          # Fix: resolve everything Kbuild would normally ask `git` for RIGHT
          # NOW (while .git is still reachable), then bake those as literal
          # values into Kbuild itself, so no git/.git lookup is needed once
          # Bazel sandboxes the build.
          python3 - <<'PYEOF'
          import pathlib, subprocess, sys

          def sh(cmd):
              r = subprocess.run(cmd, shell=True, cwd="KernelSU",
                                  capture_output=True, text=True)
              return r.stdout.strip(), r.returncode

          commit_count, _ = sh("git rev-list --count HEAD")
          commit_count = commit_count or "0"

          tag_name, rc = sh("git describe --abbrev=0 --tags 2>/dev/null")
          tag_name = tag_name if rc == 0 and tag_name else "v4.1.0"

          commit_sha, rc = sh("git rev-parse --short=8 HEAD 2>/dev/null")
          commit_sha = commit_sha if rc == 0 and commit_sha else "unknown"

          branch_name, rc = sh("git branch --show-current 2>/dev/null")
          branch_name = branch_name if rc == 0 and branch_name else "unknown"

          _, dirty_rc = sh("git diff-index --quiet HEAD")

          kbuild_path = pathlib.Path("drivers/kernelsu/Kbuild")
          text = kbuild_path.read_text()

          replacements = [
              ("LOCAL_GIT_EXISTS := $(shell test -e $(KSU_SRC)/../.git && echo 1 || echo 0)",
               "LOCAL_GIT_EXISTS := 1"),
              ("KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)",
               "KSU_LOCAL_VERSION := %s" % commit_count),
              ('KSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")',
               'KSU_TAG_NAME    := %s' % tag_name),
              ('KSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")',
               'KSU_COMMIT_SHA  := %s' % commit_sha),
              ("ifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)",
               "ifneq (%s,0)" % dirty_rc),
              ('KSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo "unknown")',
               'KSU_BRANCH_NAME := %s' % branch_name),
          ]

          missing = []
          for old, new in replacements:
              if old not in text:
                  missing.append(old)
              else:
                  text = text.replace(old, new, 1)

          kbuild_path.write_text(text)

          print("commit_count=%s tag=%s sha=%s branch=%s dirty_rc=%s"
                % (commit_count, tag_name, commit_sha, branch_name, dirty_rc))

          if missing:
              print("::warning::Some expected Kbuild lines were not found - "
                    "ReSukiSU's Kbuild may have changed upstream. "
                    "Re-run the debug dump and update this patch step.")
              for m in missing:
                  print("  MISSING:", m)
              # Don't hard-fail the job over this - fall through so the real
              # Bazel error (if any) still surfaces with full context.
              sys.exit(0)
          print("Kbuild patched OK - no live .git lookup needed anymore.")
          PYEOF

      - name: Commit kernel changes
        uses: ./.github/actions/commit-kernel-changes

      - name: Debug dump ReSukiSU Kbuild + git submodule state
        if: inputs.manager == 'ResukiSU'
        working-directory: kernel/common
        run: |
          set +e
          DUMP_DIR="${{ github.workspace }}/ksu-debug-dump"
          mkdir -p "$DUMP_DIR"
          {
            echo "== pwd =="
            pwd
            echo
            echo "== ls -la drivers/kernelsu =="
            ls -la drivers/kernelsu
            echo
            echo "== drivers/kernelsu/.git (file or dir?) =="
            ls -la drivers/kernelsu/.git 2>&1
            file drivers/kernelsu/.git 2>&1
            echo
            echo "== is drivers/kernelsu a real git checkout from here? =="
            git -C drivers/kernelsu rev-parse --is-inside-work-tree 2>&1
            git -C drivers/kernelsu rev-parse HEAD 2>&1
            echo
            echo "== .gitmodules (top-level common repo) =="
            cat .gitmodules 2>&1
            echo
            echo "== git submodule status =="
            git submodule status 2>&1
            echo
            echo "== git status for drivers/kernelsu, from common repo root =="
            git status --ignore-submodules=none -- drivers/kernelsu 2>&1
            echo
            echo "== find any Kbuild/Makefile/Kconfig under drivers/kernelsu =="
            find drivers/kernelsu -maxdepth 2 -iname 'Kbuild' -o -maxdepth 2 -iname 'Makefile' -o -maxdepth 2 -iname 'Kconfig'
            echo
            for f in $(find drivers/kernelsu -maxdepth 2 -iname 'Kbuild' -o -maxdepth 2 -iname 'Makefile'); do
              echo "---- $f ----"
              cat -n "$f"
              echo
            done
            echo "== grep KSU_SRC / submodule check across drivers/kernelsu =="
            grep -RIn "KSU_SRC\|git submodule\|wildcard.*\.git\|test -d.*\.git" drivers/kernelsu 2>&1
            echo
            echo "== BUILD.bazel glob/srcs relevant to kernel_aarch64 =="
            grep -n "glob(\|kernel_build(\|name = \"kernel_aarch64\|srcs" BUILD.bazel 2>&1 | head -200
          } > "$DUMP_DIR/resukisu-debug-dump.txt" 2>&1
          # also grab the raw files themselves for exact byte-for-byte inspection
          mkdir -p "$DUMP_DIR/drivers-kernelsu-flat"
          find drivers/kernelsu -maxdepth 2 \( -iname 'Kbuild' -o -iname 'Makefile' -o -iname 'Kconfig' \) \
            -exec cp --parents {} "$DUMP_DIR/drivers-kernelsu-flat/" \; 2>/dev/null
          cp BUILD.bazel "$DUMP_DIR/" 2>/dev/null
          cat "$DUMP_DIR/resukisu-debug-dump.txt"
          exit 0

      - name: Upload ReSukiSU debug dump
        if: inputs.manager == 'ResukiSU'
        uses: actions/upload-artifact@v6
        with:
          name: resukisu-debug-dump
          path: ksu-debug-dump/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build kernel
        uses: ./.github/actions/build-kernel
        with:
          lto: ${{ inputs.lto }}
          kernel_version: ${{ inputs.kernel_version }}
          source_mode: ${{ inputs.source_mode }}
          kmi_bypass: ${{ inputs.kmi_bypass }}
          custom_build_name: ${{ steps.build-stamp.outputs.custom_build_name }}
          custom_build_date: ${{ steps.build-stamp.outputs.custom_build_date }}

      - name: Apply KPM support
        if: inputs.kpm_support == 'on'
        uses: ./.github/actions/apply-kpm-support
        with:
          kernel_version: ${{ inputs.kernel_version }}
          kpm_superkey: ${{ inputs.kpm_superkey }}

      - name: Write compiler metadata
        uses: ./.github/actions/write-compiler-metadata
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Verify final config
        uses: ./.github/actions/verify-final-config
        with:
          strict_config: ${{ inputs.strict_config }}

      - name: Export final config
        uses: ./.github/actions/export-final-config
        env:
          CONFIG_NAME_SUFFIX: ${{ steps.build-name.outputs.variant_suffix }}
        with:
          kernel_version: ${{ inputs.kernel_version }}
          manager: ${{ inputs.manager }}
          susfs: ${{ inputs.susfs }}

      - name: Package
        uses: ./.github/actions/package-kernel
        with:
          kernel_version: ${{ inputs.kernel_version }}
          manager: ${{ inputs.manager }}
          susfs: ${{ inputs.susfs }}
          final_name: ${{ steps.build-name.outputs.final_name }}

      - name: Stage artifact outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p image-artifact
          cp "out/Image-${FINAL_NAME}" image-artifact/
          cp compiler-version.txt image-artifact/

          if [ "${{ steps.build-name.outputs.publish_artifact }}" = "true" ]; then
            mkdir -p artifact-root
            cp -a ak3_work/. artifact-root/
            cp compiler-version.txt artifact-root/
          fi

      - name: Upload flashable artifact tree
        if: steps.build-name.outputs.publish_artifact == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: anykernel3-${{ inputs.kernel_version }}-${{ inputs.manager }}${{ steps.build-name.outputs.variant_suffix }}-${{ steps.build-name.outputs.date }}
          path: artifact-root/**
          if-no-files-found: error

      - name: Upload raw Image artifact
        uses: actions/upload-artifact@v6
        with:
          name: image-${{ inputs.kernel_version }}-${{ inputs.manager }}${{ steps.build-name.outputs.variant_suffix }}-${{ steps.build-name.outputs.date }}
          path: |
            image-artifact/Image-*
            image-artifact/compiler-version.txt
          if-no-files-found: error

      - name: Upload config artifact
        uses: actions/upload-artifact@v6
        with:
          name: config-${{ inputs.kernel_version }}-${{ inputs.manager }}${{ steps.build-name.outputs.variant_suffix }}-${{ steps.build-name.outputs.date }}
          path: |
            compiler-version.txt
            out/${{ steps.build-name.outputs.config_base }}.txt
            out/${{ steps.build-name.outputs.config_base }}.gz
          if-no-files-found: error

      - name: Stage release zip
        if: steps.build-name.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$PWD/release-staging"
          zip_path="${{ steps.build-name.outputs.final_name }}.zip"

          mkdir -p "$release_dir"

          if [ ! -f "$zip_path" ]; then
            echo "::error::Release requested but no flashable zip was found at $zip_path"
            exit 1
          fi

          cp "$zip_path" "$release_dir/"

      - name: Write release body
        if: steps.build-name.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > release-body.md <<EOF
          CoreShift GKI

          - Kernel: ${{ inputs.kernel_version }}
          - Manager: ${{ inputs.manager }}
          - LTO: ${{ inputs.lto }}
          - SUSFS: ${{ steps.build-name.outputs.susfs_status }}
          - KPM: ${{ steps.build-name.outputs.kpm_status }}
          - BBG: ${{ steps.build-name.outputs.bbg_status }}
          - Date: ${DATE}

          Configs, raw images, and compiler metadata are available in workflow artifacts, not release assets.
          EOF

      - name: Create release
        if: steps.build-name.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build-name.outputs.final_name }}
          name: ${{ steps.build-name.outputs.final_name }}
          files: release-staging/*.zip
          body_path: release-body.md
