name: Apply ReSukiSU manual hooks
description: Apply ReSukiSU's required manual kernel hooks (stat, execve, faccessat, sys_reboot; plus setuid and sys_read/init_rc for kernel_version>=6.8) as source patches. Kconfig flags are handled separately via private.fragment in create-config-fragment.
inputs:
  kernel_version:
    required: true
    description: Kernel version being built.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        PATCH_DIR="$GITHUB_WORKSPACE/.github/patches/resukisu"

        cd "$COMMON_DIR"

        echo "== applying ReSukiSU manual hooks (source patches only) =="
        echo "Kconfig flags (CONFIG_KSU_MANUAL_HOOK, AUTO_SETUID_HOOK, etc.)"
        echo "are applied later via private.fragment in create-config-fragment,"
        echo "not here, to avoid touching gki_defconfig directly."

        apply_patch() {
          local patch_file="$1"
          local label="$2"

          if [ ! -f "$patch_file" ]; then
            echo "::error::missing patch file: $patch_file"
            exit 1
          fi

          echo "-- $label --"
          if ! git apply --check "$patch_file" 2>/tmp/patch_check_err; then
            echo "::error::$label patch does not apply cleanly to $COMMON_DIR"
            cat /tmp/patch_check_err
            echo "::error::This usually means the target file's surrounding context differs from the official ReSukiSU diff. Manual adjustment of the patch is required for this source tree."
            exit 1
          fi

          git apply "$patch_file"

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::reject files found after applying $label"
            find . -name '*.rej' -print
            exit 1
          fi
        }

        apply_patch "$PATCH_DIR/01_stat_hook.patch"      "stat hook"
        apply_patch "$PATCH_DIR/02_execve_hook.patch"    "execve hook"
        apply_patch "$PATCH_DIR/03_faccessat_hook.patch" "faccessat hook"
        apply_patch "$PATCH_DIR/04_reboot_hook.patch"    "sys_reboot hook"

        CHECK_FILES="fs/stat.c fs/exec.c fs/open.c kernel/reboot.c"

        if [ "${{ inputs.kernel_version }}" = "6.12" ]; then
          echo "== kernel_version=6.12 (>=6.8): LSM-based auto setuid/initrc hooks are unavailable =="
          echo "(drivers/kernelsu/tools/manual_hook_check.mk enforces this); applying the manual"
          echo "replacements instead, matching CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=n and"
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=n set in create-config-fragment."
          apply_patch "$PATCH_DIR/05_setuid_hook.patch"   "setuid hook (6.8+)"
          apply_patch "$PATCH_DIR/06_sys_read_hook.patch" "sys_read/init_rc hook (6.8+)"
          CHECK_FILES="$CHECK_FILES kernel/sys.c fs/read_write.c"
        fi

        for f in $CHECK_FILES; do
          if grep -qE '^(<<<<<<< |=======$|>>>>>>> )' "$f"; then
            echo "::error::conflict markers found in $f after patching"
            exit 1
          fi
        done
        echo "== ReSukiSU manual hook integration diff stat =="
        git diff --stat
