name: Create private config fragment
description: Generate private.fragment and private.required from workflow inputs.
inputs:
  manager:
    required: true
    description: Selected manager, used to select SUSFS Kconfig symbol source.
  ikconfig:
    required: true
    description: Enable IKCONFIG.
  susfs:
    required: true
    description: Add SUSFS4KSU configs.
  nomount_maxsteeel:
    required: false
    default: "off"
    description: Enable maxsteeel/nomount (manager-agnostic VFS-level NoMount, independent from fork built-in NoMount).
  baseband_guard:
    required: true
    description: Add Baseband Guard config.
  droidspaces:
    required: false
    default: "off"
    description: Droidspaces slot selection (off/678/123/345), used to enable required container configs.
  droidspaces_ntsync:
    required: false
    default: "off"
    description: Enable NTSync-related Kconfig for Droidspaces containers.
  container_core:
    required: true
    description: Enable core container primitives.
  container_ipc:
    required: true
    description: Enable IPC container primitives.
  container_networking:
    required: true
    description: Enable container networking helpers.
  re_kernel:
    required: false
    default: "off"
    description: Enable Re-Kernel driver Kconfig.
  debug_features:
    required: true
    description: Enable debug features.
  heavy_debug_features:
    required: true
    description: Enable heavy debug features.
  kernel_version:
    required: true
    description: Kernel version used to select SUSFS patch metadata.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"

        cd "$COMMON_DIR"

        : > private.fragment
        : > private.required

        add_config() {
          key="$1"
          val="$2"

          if [ "$val" = "y" ]; then
            printf 'CONFIG_%s=y\n' "$key" >> private.fragment
            printf 'CONFIG_%s=y\n' "$key" >> private.required
          elif [ "$val" = "m" ]; then
            printf 'CONFIG_%s=m\n' "$key" >> private.fragment
            printf 'CONFIG_%s=m\n' "$key" >> private.required
          else
            printf 'CONFIG_%s=%s\n' "$key" "$val" >> private.fragment
            printf 'CONFIG_%s=%s\n' "$key" "$val" >> private.required
          fi
        }

        add_str_config() {
          key="$1"
          val="$2"

          printf 'CONFIG_%s="%s"\n' "$key" "$val" >> private.fragment
          printf 'CONFIG_%s="%s"\n' "$key" "$val" >> private.required
        }

        has_kconfig_symbol() {
          local kconfig_file="$1"
          local symbol="$2"

          [ -f "$kconfig_file" ] || return 1
          grep -qE "^[[:space:]]*config[[:space:]]+${symbol}\$" "$kconfig_file"
        }

        echo "== enabling BBRv3 TCP congestion control =="
        add_config TCP_CONG_ADVANCED y
        add_config TCP_CONG_BBR3 y
        add_config TCP_CONG_BBR y
        add_config DEFAULT_BBR3 y

        echo "== enabling base TCP congestion control algorithms =="
        add_config TCP_CONG_CUBIC y
        add_config TCP_CONG_BIC y
        add_config TCP_CONG_WESTWOOD y
        add_config TCP_CONG_HTCP y
        
        echo "== enabling traffic shaping (qdisc) =="
        add_config NET_SCH_FQ y
        add_config NET_SCH_FQ_CODEL y
        add_config NET_SCH_CAKE y

        echo "== enabling connection marking =="
        add_config NET_ACT_CONNMARK y

        echo "== enabling TTL/Hop Limit target =="
        add_config IP_NF_TARGET_TTL y
        add_config IP6_NF_TARGET_HL y
        add_config IP6_NF_MATCH_HL y

        echo "== enabling Wireguard VPN =="
        add_config WIREGUARD y

        echo "== enabling CIFS =="
        add_config CIFS y
        add_config NETWORK_FILESYSTEMS y
        if [ "${{ inputs.kernel_version }}" != "5.10" ]; then
          add_config NETFS_SUPPORT y
        fi
        add_config KEYS y
        add_config CIFS_XATTR y
        add_config CIFS_POSIX y

        echo "== enabling mount_filesystems =="
        add_config TMPFS y
        add_config TMPFS_XATTR y
        add_config TMPFS_POSIX_ACL y
        add_config OVERLAY_FS y
        add_config FUSE_FS y

        echo "== enabling performance feature =="
        add_config PSI y

        if [ "${{ inputs.ikconfig }}" = "on" ]; then
          add_config IKCONFIG y
          add_config IKCONFIG_PROC y
        fi

        if [ "${{ inputs.manager }}" = "KSUN-Susfs-Hookless" ]; then
          if [ "${{ inputs.susfs }}" = "on" ]; then
            echo "== SUSFS config: KernelSU-Next (hookless/kprobes fork) =="
            echo "Using fork-native symbols KSU_KPROBES_SUSFS + KSU_KPROBES_NOMOUNT."
            echo "Also enabling their Kconfig dependency chain: KPROBES, KRETPROBES,"
            echo "KALLSYMS (required by KSU_KPROBES_HOOK / KSU_KPROBES_NOMOUNT)."
            add_config KPROBES y
            add_config KRETPROBES y
            add_config KALLSYMS y
            add_config KSU_KPROBES_SUSFS y
            if [ "${{ inputs.nomount_maxsteeel }}" = "on" ]; then
              echo "nomount_maxsteeel=on: standalone NoMount (maxsteeel/nomount) takes"
              echo "precedence; skipping fork's built-in KSU_KPROBES_NOMOUNT to avoid"
              echo "two independent NoMount implementations hooking the VFS layer at once."
            else
              add_config KSU_KPROBES_NOMOUNT y
            fi
            echo "Enabling ARM64 branch-link hook mode (KSU_HACK_ARM64_BRANCH_LINK)."
            add_config KSU_HACK_ARM64_BRANCH_LINK y
          fi

        elif [ "${{ inputs.manager }}" = "KernelSU-Backslashxx" ]; then
          echo "== ${{ inputs.manager }} config: syscall table tamper hook mode =="
          echo "No CONFIG_KSU_MANUAL_HOOK in this fork family; uses built-in"
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE (covers execve/faccessat/newfstatat/"
          echo "newfstat/reboot) instead of source-patched call sites."
          add_config KSU y
          add_config KSU_TAMPER_SYSCALL_TABLE y
          add_config KALLSYMS_ALL y

          if [ "${{ inputs.susfs }}" = "on" ]; then
            echo "::error::SUSFS is not yet supported for manager=${{ inputs.manager }}; no SUSFS Kconfig will be added"
            exit 1
          fi

        elif [ "${{ inputs.manager }}" = "KowSU" ] && [ "${{ inputs.susfs }}" = "on" ]; then
          echo "::error::SUSFS is not yet supported for manager=${{ inputs.manager }}; no SUSFS Kconfig will be added"
          exit 1

        elif [ "${{ inputs.manager }}" = "ResukiSU" ]; then
          add_config KSU y
          if [ "${{ inputs.susfs }}" = "on" ]; then
            echo "== ResukiSU: SUSFS integration mode =="
            add_config KSU_SUSFS y
          else
            echo "== ResukiSU: manual hook integration mode =="
            add_config KSU_MANUAL_HOOK y
            add_config KSU_MANUAL_HOOK_AUTO_SETUID_HOOK y
            add_config KSU_MANUAL_HOOK_AUTO_INPUT_HOOK y
            add_config KSU_MANUAL_HOOK_AUTO_INITRC_HOOK y
            add_config KALLSYMS_ALL y
          fi

        elif [ "${{ inputs.susfs }}" = "on" ]; then
          echo "== ensuring base KSU config is enabled (SUSFS Kconfig depends on it) =="
          add_config KSU y
          case "${{ inputs.kernel_version }}" in
            5.10)
              SUSFS_PATCH_DIR="${GITHUB_WORKSPACE}/.github/patches/susfs4ksu/gki-android12-5.10"
              ;;
            6.1)
              SUSFS_PATCH_DIR="${GITHUB_WORKSPACE}/.github/patches/susfs4ksu/gki-android14-6.1"
              ;;
            6.6)
              SUSFS_PATCH_DIR="${GITHUB_WORKSPACE}/.github/patches/susfs4ksu/gki-android15-6.6"
              ;;
            6.12)
              SUSFS_PATCH_DIR="${GITHUB_WORKSPACE}/.github/patches/susfs4ksu/gki-android16-6.12"
              ;;
            *)
              echo "::error::unsupported kernel_version for SUSFS: ${{ inputs.kernel_version }}"
              exit 1
              ;;
          esac

          echo "== SUSFS config scan: $SUSFS_PATCH_DIR =="

          if [ ! -d "$SUSFS_PATCH_DIR" ]; then
            echo "::error::missing SUSFS patch directory: $SUSFS_PATCH_DIR"
            exit 1
          fi

          SUSFS_CONFIGS="$(
            { grep -RhoE '^\+[[:space:]]*config[[:space:]]+KSU_SUSFS[A-Z0-9_]*' "$SUSFS_PATCH_DIR" 2>/dev/null || true; } |
            sed -E 's/^\+[[:space:]]*config[[:space:]]+//' |
            sort -u
          )"

          if [ -z "$SUSFS_CONFIGS" ]; then
            echo "::warning::No required SUSFS CONFIG_* names found in selected patches/Kconfig."
          else
            echo "$SUSFS_CONFIGS" | while read -r key; do
              [ -z "$key" ] && continue
              if [ "${{ inputs.manager }}" = "KernelSU-Next" ] && [ "$key" = "KSU_SUSFS_OPEN_REDIRECT" ]; then
                echo "skipping KSU_SUSFS_OPEN_REDIRECT for manager=KernelSU-Next"
                echo "(this fork's fs/namei.c set_nameidata() lacks the 4th param OPEN_REDIRECT needs)"
                continue
              fi
              add_config "$key" y
            done
          fi

        else
          echo "== manager=${{ inputs.manager }}, susfs=off: no manager-specific KSU config block matched =="
        fi

        if [ "${{ inputs.nomount_maxsteeel }}" = "on" ]; then
          echo "== NoMount (maxsteeel) config =="
          add_config NOMOUNT y
        fi
        
        if [ "${{ inputs.baseband_guard }}" = "on" ]; then
          add_config BBG y
        fi

        if [ "${{ inputs.droidspaces }}" != "off" ]; then
          echo "== Droidspaces config: enabling container primitives =="
          for cfg in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS; do
            if grep -qxF "CONFIG_${cfg}=y" private.fragment 2>/dev/null; then
              echo "  already requested via container_features: CONFIG_${cfg}"
            else
              add_config "$cfg" y
            fi
          done
        fi
        
        if [ "${{ inputs.droidspaces_ntsync }}" = "on" ]; then
          echo "== NTSync config =="
          add_config NTSYNC y
        fi

        if [ "${{ inputs.container_core }}" = "on" ]; then
          add_config NAMESPACES y
          add_config USER_NS y
          add_config UTS_NS y
          add_config NET_NS y
          add_config PID_NS y

          add_config CGROUPS y
          add_config CGROUP_PIDS y
          add_config CGROUP_DEVICE y

          add_config DEVTMPFS y

          add_config SECCOMP y
          add_config SECCOMP_FILTER y
        fi

        if [ "${{ inputs.container_ipc }}" = "on" ]; then
          add_config SYSCTL y
          add_config SYSVIPC y
          add_config SYSVIPC_SYSCTL y
          add_config IPC_NS y
          add_config POSIX_MQUEUE y
          add_config POSIX_MQUEUE_SYSCTL y
        fi

        if [ "${{ inputs.container_networking }}" = "on" ]; then
          add_config TUN y
          add_config VETH y
          add_config BRIDGE y
          add_config BRIDGE_NETFILTER y

          add_config NETFILTER y
          add_config NETFILTER_ADVANCED y
          add_config NETFILTER_XTABLES y

          add_config NETFILTER_XT_TARGET_MASQUERADE y
          add_config NETFILTER_XT_TARGET_REDIRECT y
          add_config NETFILTER_XT_TARGET_MARK y

          add_config NETFILTER_XT_MATCH_CONNTRACK y
          add_config NETFILTER_XT_MATCH_STATE y
          add_config NETFILTER_XT_MATCH_MARK y
          add_config NETFILTER_XT_MATCH_MULTIPORT y
          add_config NETFILTER_XT_MATCH_OWNER y

          add_config NF_CONNTRACK y
          add_config NF_NAT y
          add_config IP_NF_IPTABLES y
          add_config IP_NF_FILTER y
          add_config IP_NF_NAT y
          add_config IP_NF_TARGET_MASQUERADE y

          echo "== enabling IP Set & Firewall =="
          add_config IP_SET y
          add_config IP_SET_BITMAP_IP y
          add_config IP_SET_BITMAP_IPMAC y
          add_config IP_SET_BITMAP_PORT y
          add_config IP_SET_HASH_IP y
          add_config IP_SET_HASH_IPMARK y
          add_config IP_SET_HASH_IPPORT y
          add_config IP_SET_HASH_IPPORTIP y
          add_config IP_SET_HASH_IPPORTNET y
          add_config IP_SET_HASH_IPMAC y
          add_config IP_SET_HASH_MAC y
          add_config IP_SET_HASH_NETPORTNET y
          add_config IP_SET_HASH_NET y
          add_config IP_SET_HASH_NETNET y
          add_config IP_SET_HASH_NETPORT y
          add_config IP_SET_HASH_NETIFACE y
          add_config IP_SET_LIST_SET y
          add_config NETFILTER_XT_MATCH_ADDRTYPE y
          add_config NETFILTER_XT_SET y
          add_config NETFILTER_XT_TARGET_LOG y
          add_config NETFILTER_XT_MATCH_RECENT y
          add_config IP6_NF_NAT y
          add_config IP6_NF_TARGET_MASQUERADE y
        fi

        if [ "${{ inputs.re_kernel }}" = "on" ]; then
          echo "== Re-Kernel config =="
          add_config REKERNEL y
          add_config REKERNEL_NETWORK y
        fi

        if [ "${{ inputs.debug_features }}" = "on" ]; then
          add_config KPROBES y
          add_config KPROBE_EVENTS y
          add_config UPROBES y
          add_config FTRACE y
          add_config FUNCTION_TRACER y
          add_config DYNAMIC_FTRACE y
        fi

        if [ "${{ inputs.heavy_debug_features }}" = "on" ]; then
          add_config KALLSYMS y
          add_config KALLSYMS_ALL y
          add_config KASAN y
          add_config KASAN_HW_TAGS y
          add_config BTRFS_FS y
        fi
        
        if [ "${{ inputs.kernel_version }}" = "6.12" ]; then
          android_kconfig="drivers/android/Kconfig"

          add_config ANDROID_BINDER_IPC y
          add_config ANDROID_BINDERFS y

          if has_kconfig_symbol "$android_kconfig" ANDROID_BINDER_IPC_RUST_DUMMY; then
            add_config ANDROID_BINDER_IPC_RUST_DUMMY m
          fi
        fi

        echo "== private.fragment =="
        cat private.fragment

        echo
        echo "== private.required =="
        cat private.required

        if [ "${BUILD_ENGINE:-}" = "kleaf" ]; then
          touch BUILD.bazel

          if ! grep -q 'private.fragment' BUILD.bazel; then
            {
              printf '\n'
              printf 'exports_files(["private.fragment"])\n'
            } >> BUILD.bazel
          fi

          echo
          echo "== BUILD.bazel private fragment export =="
          grep -n 'private.fragment' BUILD.bazel || true
        else
          echo
          echo "== legacy private fragment =="
          echo "Skipping Bazel BUILD.bazel export for BUILD_ENGINE=${BUILD_ENGINE:-unknown}"
        fi
