name: Apply ZRAM patches
description: >
  Upgrades LZ4 to 1.10.0 with ARM64 NEON acceleration, then applies the
  LZ4KD and LZ4K_OPLUS (Oplus) ZRAM compression patch stack. Patch sources
  are read from .github/patches/common/zram in this repo (already present
  after checkout - nothing is cloned).

inputs:
  kernel_version:
    description: "Target kernel version (selects lz4k/zram_patch/<kernel_version>/*.patch)"
    required: true

runs:
  using: composite
  steps:
    # 统一处理 ZRAM 相关的 LZ4 变更，减少重复 step
    - name: 配置 ZRAM LZ4 补丁栈
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      env:
        ZRAM_PATCHES: ${{ github.workspace }}/.github/patches/zram-lz4
      run: |
        set -euo pipefail

        if [ ! -d "$ZRAM_PATCHES" ]; then
          echo "::error::ZRAM patch source directory not found: $ZRAM_PATCHES"
          exit 1
        fi

        # 第一阶段：升级 LZ4 到 1.10.0 并添加 ARM64 NEON 加速
        echo "升级 LZ4..."
        rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c
        cp -r "$ZRAM_PATCHES/lz4/." ./lib/lz4/
        cp -r "$ZRAM_PATCHES/include/linux/." ./include/linux/
        bash "$ZRAM_PATCHES/apply_lz4_neon.sh"

        if [ -f "fs/f2fs/Makefile" ] && ! grep -qF 'f2fs-$(CONFIG_F2FS_IOSTAT) += iostat.o' "fs/f2fs/Makefile"; then
          echo 'f2fs-$(CONFIG_F2FS_IOSTAT) += iostat.o' >> "fs/f2fs/Makefile"
        fi

        # 第二阶段：应用 LZ4KD 和 LZ4K_OPLUS 补丁
        cp -r "$ZRAM_PATCHES/lz4k/include/linux/." ./include/linux/
        cp -r "$ZRAM_PATCHES/lz4k/lib/." ./lib/
        cp -r "$ZRAM_PATCHES/lz4k/crypto/." ./crypto/
        cp -r "$ZRAM_PATCHES/lz4k_oplus" ./lib/

        PATCH_DIR="$ZRAM_PATCHES/zram_patch/${{ inputs.kernel_version }}"
        if [ ! -d "$PATCH_DIR" ]; then
          echo "::error::No zram_patch directory for kernel_version=${{ inputs.kernel_version }} (expected $PATCH_DIR)"
          exit 1
        fi

        cp "$PATCH_DIR/lz4kd.patch" ./
        if ! patch -p1 -F 10 < lz4kd.patch; then
          echo "::warning::lz4kd.patch - Apply failed, possibly already applied or context mismatch"
        fi
        rm -f lz4kd.patch

        cp "$PATCH_DIR/lz4k_oplus.patch" ./
        if ! patch -p1 -F 3 < lz4k_oplus.patch; then
          echo "::warning::lz4k_oplus.patch 应用失败，可能已应用或上下文不匹配"
        fi
        rm -f lz4k_oplus.patch

        # 显示所有被拒绝的 hunk，方便定位具体哪个文件/哪段没打上
        reject_files="$(find . -name '*.rej' 2>/dev/null || true)"
        if [ -n "$reject_files" ]; then
          echo "::warning::Found .rej files from ZRAM patch application:"
          echo "$reject_files" | while read -r rej; do
            [ -z "$rej" ] && continue
            echo "---- $rej ----"
            cat "$rej"
          done
        fi

        # 硬性校验：backends[] 是否真的包含新算法名，否则 Kconfig 打开了也不会出现在 sysfs comp_algorithm 里
        ZCOMP_C="drivers/block/zram/zcomp.c"
        if [ ! -f "$ZCOMP_C" ]; then
          echo "::error::$ZCOMP_C not found, cannot verify backends[] registration"
          exit 1
        fi

        missing_backends=""
        for algo in lz4k lz4kd lz4k_oplus; do
          if ! grep -qF "\"$algo\"" "$ZCOMP_C"; then
            missing_backends="$missing_backends $algo"
          fi
        done

        if [ -n "$missing_backends" ]; then
          echo "::error::ZRAM backends[] in $ZCOMP_C is missing:$missing_backends"
          echo "::error::Kconfig symbols will still be =y, but these won't show up in /sys/block/zram0/comp_algorithm."
          echo "::error::Check the .rej output above and manually reconcile the zcomp.c hunk for this kernel source."
          exit 1
        fi

        echo "Verified backends[] in $ZCOMP_C contains: lz4k lz4kd lz4k_oplus"

        # 诊断：完整打印 zram Kconfig 结构，确认 ZRAM_DEF_COMP_LZ4KD 是否嵌套在
        # choice/if ZRAM 块内，是否有除 CRYPTO_LZ4KD 之外的隐藏依赖
        echo "== FULL drivers/block/zram/Kconfig =="
        cat -n drivers/block/zram/Kconfig

        echo
        echo "== CRYPTO_LZ4KD context in crypto/Kconfig (20 lines before/after) =="
        grep -n "config CRYPTO_LZ4KD" crypto/Kconfig | while IFS=: read -r lineno _; do
          start=$((lineno > 20 ? lineno - 20 : 1))
          sed -n "${start},$((lineno+10))p" crypto/Kconfig | cat -n
        done

        echo
        echo "== value of CONFIG_ZRAM / CONFIG_CRYPTO_ALGAPI in current .config (if present) =="
        find . -maxdepth 3 -name ".config" -exec grep -H -E "^CONFIG_(ZRAM|CRYPTO_ALGAPI|CRYPTO_LZ4KD)=" {} \; || echo "  no .config found yet at this stage (expected - config generated later in pipeline)"

        echo
        == zcomp_available_show / crypto_has_comp context in zcomp.c ==
        == .cra_name registered by lz4k/lz4kd/lz4k_oplus crypto modules ==
        grep -n "available_show\|crypto_has_comp\|crypto_has_acomp\|comp_algorithm_show" "$ZCOMP_C" | while IFS=: read -r lineno _; do
          echo "-- match at line $lineno --"
          sed -n "${lineno},$((lineno+15))p" "$ZCOMP_C" | cat -n
        done

        echo
        echo "== .cra_name registered by lz4k/lz4kd/lz4k_oplus crypto modules =="
        grep -rn "cra_name" crypto/lz4k.c crypto/lz4kd.c lib/lz4k_oplus/*.c 2>/dev/null || echo "  (no matches - check actual filenames under crypto/ and lib/lz4k_oplus/)"
        echo "== duplicate Kconfig symbol check =="
        for pair in "CRYPTO_LZ4KD:crypto/Kconfig" "CRYPTO_LZ4K:crypto/Kconfig" "CRYPTO_LZ4K_OPLUS:lib/lz4k_oplus/Kconfig" "ZRAM_DEF_COMP_LZ4KD:drivers/block/zram/Kconfig"; do
          symbol="${pair%%:*}"
          kfile="${pair##*:}"

          if [ ! -f "$kfile" ]; then
            echo "-- $symbol: $kfile not found --"
            continue
          fi

          count="$(grep -cE "^[[:space:]]*config[[:space:]]+${symbol}\$" "$kfile" || true)"
          echo "-- $symbol in $kfile: $count definition(s) --"
          if [ "$count" -gt 1 ]; then
            echo "::warning::Duplicate 'config $symbol' definitions found in $kfile - later one wins and may have different depends/select"
            grep -nE "^[[:space:]]*config[[:space:]]+${symbol}\$" "$kfile" | while IFS=: read -r lineno _; do
              echo "  block starting at line $lineno:"
              sed -n "${lineno},$((lineno+8))p" "$kfile" | sed 's/^/    /'
            done
          fi
        done

        # 也确认全仓库范围没有其它同名重复定义（比如另一份被 cp -r 带进来的 Kconfig）
        echo "== repo-wide duplicate check for CRYPTO_LZ4KD / ZRAM_DEF_COMP_LZ4KD =="
        grep -rnE "^[[:space:]]*config[[:space:]]+(CRYPTO_LZ4KD|ZRAM_DEF_COMP_LZ4KD)\$" . --include=Kconfig || echo "  none found via recursive grep"
