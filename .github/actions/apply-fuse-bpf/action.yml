name: Apply FUSE-BPF backport
description: >
  Backport "ANDROID: fuse-bpf v1.1" dari common-android13-5.10 ke
  kernel/common target (kernel_version=5.10, biasanya common-android12-5.10).
  Hanya memodifikasi working tree (tidak commit sendiri -- commit dilakukan
  belakangan oleh step "Commit kernel changes", sama seperti action apply-*
  lainnya di workflow ini). No-op untuk kernel_version selain "5.10".
inputs:
  kernel_version:
    required: true
    description: Kernel version target. Backport hanya dijalankan jika "5.10".
  source_repo:
    required: false
    default: "https://android.googlesource.com/kernel/common"
    description: Repo sumber tempat commit fuse-bpf diambil.
  source_branch:
    required: false
    default: "android13-5.10"
    description: Branch sumber tempat commit fuse-bpf diambil.
  squash_sha:
    required: false
    default: "f5f4199c102aa676998b42abff60d071385c1c0c"
    description: >
      SHA commit squash "ANDROID: fuse-bpf v1.1" di source_branch.
      Override kalau Google me-rebase branch dan SHA ini hilang.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        KERNEL_VERSION="${{ inputs.kernel_version }}"
        if [ "$KERNEL_VERSION" != "5.10" ]; then
          echo "kernel_version=${KERNEL_VERSION} != 5.10, fuse-bpf backport tidak relevan, skip."
          exit 0
        fi

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        SOURCE_REPO="${{ inputs.source_repo }}"
        SOURCE_BRANCH="${{ inputs.source_branch }}"
        SQUASH_SHA="${{ inputs.squash_sha }}"

        if [ ! -d "$COMMON_DIR/.git" ]; then
          echo "::error::KERNEL_COMMON_DIR ($COMMON_DIR) bukan git repo. Pastikan step sync-kernel/replace-common-source sudah jalan sebelum step ini."
          exit 1
        fi

        echo "== Cek prasyarat FUSE passthrough di $COMMON_DIR =="
        if [ -f "$COMMON_DIR/fs/fuse/passthrough.c" ]; then
          echo "  OK: fs/fuse/passthrough.c ada -> baseline passthrough terpenuhi."
        else
          echo "::warning::fs/fuse/passthrough.c tidak ditemukan di source tree ini."
          echo "::warning::fuse-bpf dibangun di atas FUSE passthrough; backport kemungkinan konflik berat."
        fi

        WORKDIR="$(mktemp -d)"
        PATCH_FILE="$WORKDIR/fuse-bpf.patch"

        echo "== Mengambil commit fuse-bpf ($SQUASH_SHA) dari $SOURCE_REPO@$SOURCE_BRANCH =="
        git clone --filter=blob:none --no-checkout --branch "$SOURCE_BRANCH" \
          "$SOURCE_REPO" "$WORKDIR/src"

        if ! git -C "$WORKDIR/src" cat-file -e "${SQUASH_SHA}^{commit}" 2>/dev/null; then
          echo "::error::Commit $SQUASH_SHA tidak ditemukan di $SOURCE_BRANCH."
          echo "::error::Kemungkinan branch sudah di-rebase Google. Cek ulang SHA dan set squash_sha di caller."
          exit 1
        fi

        # PENTING: gki_defconfig SENGAJA dikeluarkan dari patch.
        # CONFIG_FUSE_BPF / CONFIG_BPF / CONFIG_BPF_SYSCALL sudah disuntikkan
        # lewat private.fragment di step create-config-fragment (fuse_bpf=on),
        # jadi kita tidak perlu (dan sebaiknya tidak) menyentuh defconfig di
        # sini -- file itu isinya baris CONFIG_X=y yang mirip-mirip, sehingga
        # 3-way merge git gampang gagal "could not build fake ancestor" walau
        # sebenarnya tidak ada konflik substansi.
        git -C "$WORKDIR/src" diff "${SQUASH_SHA}^" "${SQUASH_SHA}" -- . \
          ':(exclude)arch/arm64/configs/gki_defconfig' \
          ':(exclude)arch/x86/configs/gki_defconfig' \
          > "$PATCH_FILE"

        echo "  patch tersimpan: $PATCH_FILE ($(wc -l < "$PATCH_FILE") baris, defconfig dikecualikan)"

        echo "== Cek enum bpf_prog_type: target vs source (info saja, bukan blocker) =="
        SRC_ENUM="$WORKDIR/src_enum.txt"
        TGT_ENUM="$WORKDIR/tgt_enum.txt"
        git -C "$WORKDIR/src" show "$SQUASH_SHA:include/uapi/linux/bpf.h" 2>/dev/null \
          | sed -n '/enum bpf_prog_type/,/};/p' > "$SRC_ENUM" || true
        sed -n '/enum bpf_prog_type/,/};/p' "$COMMON_DIR/include/uapi/linux/bpf.h" 2>/dev/null \
          > "$TGT_ENUM" || true

        if [ -s "$SRC_ENUM" ] && [ -s "$TGT_ENUM" ] && ! diff -q "$SRC_ENUM" "$TGT_ENUM" >/dev/null 2>&1; then
          echo "::warning::enum bpf_prog_type target berbeda dari source android13-5.10 (biasanya wajar, cuma info)."
          diff -u "$TGT_ENUM" "$SRC_ENUM" || true
        fi

        echo "== Dry-run: git apply --check (tidak mengubah apa pun kalau gagal) =="
        pushd "$COMMON_DIR" >/dev/null

        if ! git apply --check "$PATCH_FILE" 2>"$WORKDIR/apply-check.log"; then
          echo "::error::Patch fuse-bpf TIDAK bisa diterapkan bersih ke source tree ini (context mismatch)."
          echo "::error::Detail:"
          sed 's/^/::error::  /' "$WORKDIR/apply-check.log"
          echo "::error::Tidak ada file yang diubah (git apply --check bersifat dry-run/atomik)."
          echo "::error::Ini butuh resolusi manual: jalankan backport-fusebpf.sh lokal dengan source_mode"
          echo "::error::yang sama, selesaikan konflik per-file, lalu commit hasilnya sebagai patch statis"
          echo "::error::di .github/patches/fuse-bpf/, dan ganti step ini jadi 'git apply' patch statis itu."
          popd >/dev/null
          rm -rf "$WORKDIR"
          exit 1
        fi

        echo "  OK: patch cocok bersih dengan source tree, menerapkan..."
        git apply "$PATCH_FILE"
        echo "  fuse-bpf ter-apply (belum di-commit -- akan ikut ter-commit di step 'Commit kernel changes')."

        popd >/dev/null

        echo "== Info: CONFIG_FUSE_BPF/CONFIG_BPF/CONFIG_BPF_SYSCALL TIDAK diset di sini =="
        echo "   Pastikan input fuse_bpf=on diteruskan ke step create-config-fragment"
        echo "   supaya CONFIG_FUSE_BPF, CONFIG_BPF, CONFIG_BPF_SYSCALL masuk private.fragment."

        rm -rf "$WORKDIR"
