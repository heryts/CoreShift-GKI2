name: "Apply FUSE-BPF (backport to android12-5.10)"
description: >
  Applies pre-resolved, vendored FUSE-BPF v1.1 backport patches (0001-...,
  0002-..., etc, applied in filename order) onto the checked out
  android12-5.10 kernel/common tree. 0001 is the main fuse-bpf backport,
  generated once by manually resolving the real content conflicts between
  common-android13-5.10 (where fuse-bpf v1.1 first landed) and
  android12-5.10-lts. Later files (0002+) are small prerequisite/compat
  fixes for APIs android12-5.10 lacks that 0001 assumes exist (renamed
  functions, missing struct fields, etc). All of them apply
  deterministically as long as kernel/common is pinned (via common_ref in
  the sync-kernel action) to the exact commit they were resolved against.
  Only meaningful for kernel_version=5.10; android13+ based common trees
  (6.1/6.6) already contain FUSE_BPF natively.

inputs:
  kernel_version:
    description: "Kernel version being built (only 5.10 is backported)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply vendored FUSE-BPF patches
      if: inputs.kernel_version == '5.10'
      shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        PATCH_DIR="$GITHUB_WORKSPACE/.github/patches/common/fuse-bpf"

        if [ ! -d "$COMMON_DIR" ]; then
          echo "::error::$COMMON_DIR does not exist; is kernel/common checked out yet?"
          exit 1
        fi

        if [ ! -d "$PATCH_DIR" ]; then
          echo "::error::vendored patch directory not found at $PATCH_DIR"
          exit 1
        fi

        mapfile -t PATCHES < <(find "$PATCH_DIR" -maxdepth 1 -name '*.patch' | sort)

        if [ "${#PATCHES[@]}" -eq 0 ]; then
          echo "::error::no *.patch files found in $PATCH_DIR"
          exit 1
        fi

        cd "$COMMON_DIR"

        for PATCH_FILE in "${PATCHES[@]}"; do
          NAME="$(basename "$PATCH_FILE")"

          echo "== checking vendored patch applies cleanly: $NAME =="
          if ! git apply --check --whitespace=fix "$PATCH_FILE"; then
            echo "::error::Vendored patch $NAME no longer applies cleanly onto kernel/common."
            echo "::error::This almost always means kernel/common has drifted from the commit the"
            echo "::error::patch was resolved against. Check that common_ref in the sync-kernel step"
            echo "::error::is still pinned to the commit used when this patch was generated, or"
            echo "::error::re-resolve the conflicts against the new base and re-vendor the patch."
            exit 1
          fi

          echo "== applying vendored patch: $NAME =="
          git apply --whitespace=fix "$PATCH_FILE"

          if find . -name '*.rej' -o -name '*.orig' | grep -q .; then
            echo "::error::Unexpected .rej/.orig files left behind after applying $NAME; tree may be inconsistent."
            find . -name '*.rej' -o -name '*.orig' -print
            exit 1
          fi

          echo "$NAME applied cleanly."
        done

        echo "== FUSE-BPF applied cleanly. CONFIG_FUSE_BPF itself is enabled via"
        echo "   private.fragment by the create-config-fragment action (fuse_bpf input) - not here."

        echo "fuse_bpf_applied=true" >> "$GITHUB_ENV"
