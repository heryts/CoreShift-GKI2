name: Apply FUSE-BPF backport
description: >
  Backports "ANDROID: fuse-bpf v1.1" from common-android13-5.10 into the
  kernel/common target (kernel_version=5.10).
inputs:
  kernel_version:
    required: true
    description: Target kernel version. The backport only runs if this is "5.10".
  source_repo:
    required: false
    default: "https://android.googlesource.com/kernel/common"
  source_branch:
    required: false
    default: "android13-5.10"
  squash_sha:
    required: false
    default: "f5f4199c102aa676998b42abff60d071385c1c0c"
    description: 'Commit SHA of the "ANDROID: fuse-bpf v1.1" squash on source_branch.'
  static_patch_path:
    required: false
    default: ".github/patches/fuse-bpf/android12-5.10.patch"
    description: >
      Path to the statically resolved patch, relative to GITHUB_WORKSPACE.
runs:
  using: composite
  steps:
    - id: apply
      shell: bash
      run: |
        set -euo pipefail

        KERNEL_VERSION="${{ inputs.kernel_version }}"
        if [ "$KERNEL_VERSION" != "5.10" ]; then
          echo "kernel_version=${KERNEL_VERSION} != 5.10, fuse-bpf backport not applicable, skipping."
          echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        STATIC_PATCH="${{ inputs.static_patch_path }}"

        if [ ! -d "$COMMON_DIR/.git" ]; then
          echo "::error::KERNEL_COMMON_DIR ($COMMON_DIR) is not a git repo."
          echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        WORKDIR="$(mktemp -d)"
        PATCH_FILE="$WORKDIR/fuse-bpf.patch"

        if [ -n "$STATIC_PATCH" ] && [ -f "$GITHUB_WORKSPACE/$STATIC_PATCH" ]; then
          echo "== Using static patch: $STATIC_PATCH =="
          cp "$GITHUB_WORKSPACE/$STATIC_PATCH" "$PATCH_FILE"
        else
          echo "== Checking FUSE passthrough prerequisite in $COMMON_DIR =="
          if [ -f "$COMMON_DIR/fs/fuse/passthrough.c" ]; then
            echo "  OK: fs/fuse/passthrough.c is present."
          else
            echo "::warning::fs/fuse/passthrough.c not found -- the backport will likely hit heavy conflicts."
          fi

          SOURCE_REPO="${{ inputs.source_repo }}"
          SOURCE_BRANCH="${{ inputs.source_branch }}"
          SQUASH_SHA="${{ inputs.squash_sha }}"

          echo "== Fetching fuse-bpf commit ($SQUASH_SHA) from $SOURCE_REPO@$SOURCE_BRANCH =="
          git clone --filter=blob:none --no-checkout --branch "$SOURCE_BRANCH" \
            "$SOURCE_REPO" "$WORKDIR/src"

          if ! git -C "$WORKDIR/src" cat-file -e "${SQUASH_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Commit $SQUASH_SHA not found on $SOURCE_BRANCH."
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git -C "$WORKDIR/src" diff "${SQUASH_SHA}^" "${SQUASH_SHA}" -- . \
            ':(exclude)arch/arm64/configs/gki_defconfig' \
            ':(exclude)arch/x86/configs/gki_defconfig' \
            > "$PATCH_FILE"

          echo "  patch saved: $PATCH_FILE ($(wc -l < "$PATCH_FILE") lines)"
        fi

        pushd "$COMMON_DIR" >/dev/null

        if git apply --check "$PATCH_FILE" 2>"$WORKDIR/apply-check.log"; then
          echo "== Patch matches 100%, applying cleanly =="
          git apply "$PATCH_FILE"
          echo "  fuse-bpf fully applied (not committed yet)."
          popd >/dev/null
          echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          rm -rf "$WORKDIR"
          exit 0
        fi

        echo "::warning::Patch context doesn't match 100%. Details of the failing hunks:"
        sed 's/^/::warning::  /' "$WORKDIR/apply-check.log" || true

        echo "== Applying partially with git apply --reject =="
        set +e
        git apply --reject --whitespace=nowarn "$PATCH_FILE"
        set -e

        REJECT_FILES="$(find . -name '*.rej' -not -path './.git/*' | sed 's#^\./##')"

        if [ -z "$REJECT_FILES" ]; then
          echo "  No .rej files left -- turns out every hunk applied in the end."
          popd >/dev/null
          echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          rm -rf "$WORKDIR"
          exit 0
        fi

        echo "::error::The following hunks FAILED to apply automatically and need manual resolution:"
        echo "$REJECT_FILES" | sed 's/^/::error::  /'

        ARTIFACT_DIR="$GITHUB_WORKSPACE/fusebpf-conflict-artifact"
        rm -rf "$ARTIFACT_DIR"
        mkdir -p "$ARTIFACT_DIR"

        while IFS= read -r rej; do
          [ -z "$rej" ] && continue
          src="${rej%.rej}"
          mkdir -p "$ARTIFACT_DIR/$(dirname "$src")"
          cp "$src" "$ARTIFACT_DIR/$src" 2>/dev/null || true
          cp "$rej" "$ARTIFACT_DIR/$rej"
        done <<< "$REJECT_FILES"

        cp "$PATCH_FILE" "$ARTIFACT_DIR/fuse-bpf-original.patch"

        cat > "$ARTIFACT_DIR/README.md" <<EOF

        The files here are the result of running \`git apply --reject\` with the
        \`fuse-bpf-original.patch\` patch against your kernel/common (kernel_version=5.10).

        Hunks that matched have ALREADY been applied to the target files here. Hunks
        that did NOT match are in the \`*.rej\` file next to each target file.

        $(echo "$REJECT_FILES" | sed 's/^/- /')

        1. Download & extract this artifact on your local machine.
        2. For each \`<file>\` + \`<file>.rej\` pair:
           - Open \`<file>.rej\` and look at the failed hunk (unified diff format).
           - Open \`<file>\` (which already contains the hunks that succeeded), then
             manually paste in the changes from \`.rej\`, adapting them to the
             actual code context in that file.
           - Delete \`.rej\` once you're done.
        3. Once every file is clean, generate the final patch:
           \`\`\`bash
           git diff > android12-5.10.patch
           \`\`\`
           (run this from the root of the kernel/common tree you just resolved manually)
        4. Save it as \`.github/patches/fuse-bpf/android12-5.10.patch\` in your
           workflow repo.
        5. Call this action with:
           \`\`\`yaml
           - uses: ./.github/actions/apply-fuse-bpf
             with:
               kernel_version: \${{ inputs.kernel_version }}
               static_patch_path: .github/patches/fuse-bpf/android12-5.10.patch
           \`\`\`
           Once the static patch exists, future runs won't need to clone+diff
           on the fly again, and the result will be deterministic.
        EOF
        sed -i 's/^        //' "$ARTIFACT_DIR/README.md"

        popd >/dev/null

        {
          echo "has_conflicts=true"
          echo "artifact_dir=fusebpf-conflict-artifact"
        } >> "$GITHUB_OUTPUT"

        rm -rf "$WORKDIR"

    - name: Upload conflict artifact
      if: steps.apply.outputs.has_conflicts == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: fusebpf-conflict-${{ github.run_number }}
        path: fusebpf-conflict-artifact/**
        if-no-files-found: error
        retention-days: 14

    - name: Fail build (fuse-bpf conflict not yet resolved)
      if: steps.apply.outputs.has_conflicts == 'true'
      shell: bash
      run: |
        echo "::error::fuse-bpf backport partially failed. Artifact 'fusebpf-conflict-${{ github.run_number }}' contains the files+.rej+resolution instructions -- check the Artifacts tab on this run."
        exit 1
