name: Apply SUSFS4KSU
description: Apply SUSFS4KSU source files and patches for selected GKI version (pinned commit, cloned from GitLab).
inputs:
  kernel_version:
    required: true
    description: Kernel version to patch.
  manager:
    required: true
    description: Selected manager.
  susfs_ref:
    required: false
    default: "d4c3914"
    description: "susfs4ksu commit to pin (default: v2.2.0 release, before the OPEN_REDIRECT refactor that broke set_nameidata compat). Ignored for manager=KernelSU and manager=KernelSU-Next, which auto-resolve HEAD instead."
  susfs_repo:
    required: false
    default: "https://gitlab.com/simonpunk/susfs4ksu.git"
    description: "SUSFS4KSU source repo. Override if the default source hasn't adapted to an upstream KernelSU change yet (e.g. https://github.com/WildKernels/susfs4ksu.git)."
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        if [ "${{ inputs.manager }}" = "Vanilla" ]; then
          echo "::error::SUSFS4KSU requires a KernelSU-compatible manager."
          exit 1
        fi

        if [ "${{ inputs.manager }}" = "KowSU" ]; then
          echo "::error::SUSFS4KSU is not yet supported for manager=${{ inputs.manager }}."
          exit 1
        fi

        case "${{ inputs.kernel_version }}" in
          5.10) SUSFS_BRANCH="gki-android12-5.10" ;;
          6.1)  SUSFS_BRANCH="gki-android14-6.1" ;;
          6.6)  SUSFS_BRANCH="gki-android15-6.6" ;;
          6.12) SUSFS_BRANCH="gki-android16-6.12" ;;
          *)
            echo "::error::unsupported kernel_version for SUSFS: ${{ inputs.kernel_version }}"
            exit 1
            ;;
        esac

        SUSFS_REPO="${{ inputs.susfs_repo }}"
        SUSFS_CLONE_DIR="${RUNNER_TEMP:-/tmp}/susfs4ksu"
        rm -rf "$SUSFS_CLONE_DIR"

        echo "== cloning susfs4ksu (branch: $SUSFS_BRANCH) from $SUSFS_REPO =="
        git clone --branch "$SUSFS_BRANCH" "$SUSFS_REPO" "$SUSFS_CLONE_DIR"

        if [ "${{ inputs.manager }}" = "KernelSU-Next" ]; then
          echo "== skipping susfs_ref pin for KernelSU-Next; using branch HEAD =="
          echo "(pershoot coexistence patches below are designed against current HEAD, not an old pin)"
        elif [ "${{ inputs.manager }}" = "KernelSU" ]; then
          # KernelSU (original tiann/KernelSU) moves fast and has undergone
          # directory-structure refactors in the past, which can outdate a
          # pinned susfs4ksu ref. Auto-resolve instead: prefer "<branch>-dev"
          # if it exists on the remote (fixes often land there first), else
          # fall back to plain branch HEAD. Set susfs_ref explicitly to
          # override this and pin to a known-good commit again.
          echo "== resolving susfs_ref for manager=KernelSU (dynamic, not pinned) =="
          if [ -n "${{ inputs.susfs_ref }}" ] && [ "${{ inputs.susfs_ref }}" != "d4c3914" ]; then
            echo "== pinning to explicitly-provided ref: ${{ inputs.susfs_ref }} =="
            git -C "$SUSFS_CLONE_DIR" checkout "${{ inputs.susfs_ref }}"
          elif git ls-remote --heads "$SUSFS_REPO" "${SUSFS_BRANCH}-dev" | grep -q .; then
            echo "== ${SUSFS_BRANCH}-dev exists on remote, using it =="
            git -C "$SUSFS_CLONE_DIR" fetch --depth 1 origin "${SUSFS_BRANCH}-dev"
            git -C "$SUSFS_CLONE_DIR" checkout --detach FETCH_HEAD
          else
            echo "== no -dev branch found, using $SUSFS_BRANCH HEAD =="
          fi
        else
          echo "== pinning to ref: ${{ inputs.susfs_ref }} =="
          git -C "$SUSFS_CLONE_DIR" checkout "${{ inputs.susfs_ref }}"
        fi

        SUSFS_COMMIT="$(git -C "$SUSFS_CLONE_DIR" rev-parse --short HEAD)"
        SUSFS_COMMIT_MSG="$(git -C "$SUSFS_CLONE_DIR" log -1 --format='%s')"
        SUSFS_COMMIT_DATE="$(git -C "$SUSFS_CLONE_DIR" log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')"
        echo "susfs4ksu resolved commit: $SUSFS_COMMIT ($SUSFS_COMMIT_DATE) - $SUSFS_COMMIT_MSG"

        if [ "${{ inputs.manager }}" = "KernelSU-Next" ]; then
          echo "== applying pershoot coexistence patches (on top of unpinned HEAD) =="
          echo "pershoot/KernelSU-Next's core_hook.c uses a different SUSFS API shape;"
          echo "these patches (from WildKernels/kernel_patches) adapt official susfs4ksu"
          echo "to be source-compatible with it."

          PERSHOOT_PATCH_BASE="https://raw.githubusercontent.com/WildKernels/kernel_patches/main/pershoot/susfs4ksu"

          curl -fsSL "$PERSHOOT_PATCH_BASE/0001-pershoot-Allow-core-to-be-built-with-no-features.patch" -o /tmp/0001-pershoot.patch
          curl -fsSL "$PERSHOOT_PATCH_BASE/0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch" -o /tmp/0002-pershoot.patch

          cd "$SUSFS_CLONE_DIR"
          patch -p1 < /tmp/0001-pershoot.patch
          patch -p1 < /tmp/0002-pershoot.patch
          cd - > /dev/null

          echo "pershoot coexistence patches applied on top of unpinned susfs4ksu HEAD"
        fi

        PATCH_DIR="$SUSFS_CLONE_DIR/kernel_patches"

        echo "== SUSFS4KSU patch dir =="
        echo "$PATCH_DIR"

        SUSFS_C="$PATCH_DIR/fs/susfs.c"
        SUSFS_INCLUDE_DIR="$PATCH_DIR/include/linux"
        KSU_PATCH="$PATCH_DIR/KernelSU/10_enable_susfs_for_ksu.patch"
        SUSFS_PATCH="$PATCH_DIR/50_add_susfs_in_${SUSFS_BRANCH}.patch"

        for path in "$PATCH_DIR" "$SUSFS_C" "$SUSFS_INCLUDE_DIR" "$SUSFS_PATCH" "$KSU_PATCH"; do
          if [ ! -e "$path" ]; then
            echo "::error::missing SUSFS file/patch: $path"
            find "$PATCH_DIR" -maxdepth 3 2>/dev/null || true
            exit 1
          fi
        done

        if ! find "$SUSFS_INCLUDE_DIR" -maxdepth 1 -type f -name '*.h' | grep -q .; then
          echo "::error::missing SUSFS include/linux/*.h files in $SUSFS_INCLUDE_DIR"
          exit 1
        fi

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"

        cd "$COMMON_DIR"

        echo "== copy SUSFS files =="
        mkdir -p fs include/linux
        cp "$SUSFS_C" fs/susfs.c
        cp "$SUSFS_INCLUDE_DIR"/* include/linux/
        ls -l fs/susfs.c include/linux/susfs*.h

        echo
        echo "== check/apply core SUSFS patch =="
        if ! git apply --check "$SUSFS_PATCH"; then
          echo "::error::core SUSFS patch (commit $SUSFS_COMMIT) does not apply to this source tree"
          exit 1
        fi

        git apply "$SUSFS_PATCH"

        if [ "${{ inputs.manager }}" = "KernelSU-Next" ]; then
          echo "== fixing set_nameidata() call-site/declaration mismatch =="
          echo "50_add_susfs_in_*.patch adds a 4th arg at call sites but this source tree's"
          echo "set_nameidata() declaration wasn't updated to accept it; strip the extra arg."
          sed -i -E 's/set_nameidata\(([^,]+), ([^,]+), ([^,]+), NULL\);/set_nameidata(\1, \2, \3);/' fs/namei.c
          grep -n 'set_nameidata(' fs/namei.c
        fi

        if find . -name '*.rej' -print -quit | grep -q .; then
          echo "::error::reject files found after SUSFS patch"
          find . -name '*.rej' -print
          exit 1
        fi

        if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' \
          fs \
          include/linux/susfs.h \
          include/linux/susfs_def.h \
          drivers/input/input.c \
          kernel \
          security/selinux; then
          echo "::error::conflict markers found after core SUSFS patch"
          exit 1
        fi

        echo
        echo "== locate integrated KernelSU root =="
        KSU_MARKERS="$(
          find -L "$COMMON_DIR" \
            -type f \
            \( -path "*/kernel/include/ksu.h" -o -path "*/kernel/ksu.h" \) \
            -print
        )"

        if [ -z "$KSU_MARKERS" ]; then
          echo "::error::No integrated KernelSU root found for manager '${{ inputs.manager }}'. Expected a file matching */kernel/include/ksu.h under $COMMON_DIR."
          exit 1
        fi

        KSU_MARKER="$(printf '%s\n' "$KSU_MARKERS" | sort | head -n 1)"
        KSU_ROOT="${KSU_MARKER%/kernel/include/ksu.h}"
        KSU_ROOT="${KSU_ROOT%/kernel/ksu.h}"

        echo "KSU_ROOT=$KSU_ROOT"

        cd "$KSU_ROOT"

        echo
        if [ "${{ inputs.manager }}" = "ResukiSU" ] || [ "${{ inputs.manager }}" = "KernelSU-Next" ]; then
          echo "== skipping generic KernelSU SUSFS enablement patch =="
          echo "manager=${{ inputs.manager }} has its own SUSFS wiring built into its source."
        elif [ "${{ inputs.manager }}" = "KernelSU-Backslashxx" ]; then
          echo "== applying Backslashxx-specific SUSFS enablement patch =="
          echo "Backslashxx's kernel/ layout (supercall/, hook/setuid_hook.c, no core_hook.c)"
          echo "is not compatible with upstream's generic KernelSU/10_enable_susfs_for_ksu.patch,"
          echo "so a maintained local patch is applied instead."

          BACKSLASHXX_SUSFS_PATCH="${GITHUB_WORKSPACE}/.github/patches/susfs4ksu/KernelSU-Backslashxx/0001-xxKSU-kernel-implement-susfs-v2_2_0-De-inlined.patch"

          if [ ! -f "$BACKSLASHXX_SUSFS_PATCH" ]; then
            echo "::error::missing Backslashxx SUSFS enablement patch: $BACKSLASHXX_SUSFS_PATCH"
            exit 1
          fi

          git apply --check "$BACKSLASHXX_SUSFS_PATCH"
          git apply "$BACKSLASHXX_SUSFS_PATCH"

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after Backslashxx SUSFS patch"
            exit 1
          fi
        elif [ "${{ inputs.manager }}" = "KernelSU" ]; then
          # Safer apply for original KernelSU: dry-run with --fuzz=3 first
          # (tolerates minor line-offset drift), then fall back to checking
          # whether the patch is already applied, before failing. This never
          # leaves .rej files behind, and gives a clear diagnostic when the
          # failure is structural (target paths missing entirely) rather than
          # a simple offset that fuzz could absorb — e.g. if upstream
          # KernelSU's kernel/ directory layout has been refactored since
          # this susfs4ksu ref's generic patch was written.
          echo "== check/apply KernelSU SUSFS patch from KSU_ROOT (safe mode) =="
          if (patch --dry-run --fuzz=3 -p1 < "$KSU_PATCH") >/tmp/ksu-patch-dry-run.log 2>&1; then
            patch --fuzz=3 -p1 < "$KSU_PATCH"
          elif (patch --dry-run -R --fuzz=3 -p1 < "$KSU_PATCH") >/tmp/ksu-patch-reverse.log 2>&1; then
            echo "== KernelSU SUSFS patch already applied, skipping =="
          else
            echo "::error::KernelSU SUSFS patch does not apply to this source tree (susfs commit $SUSFS_COMMIT)"
            echo "---- dry-run output ----"
            sed -n '1,120p' /tmp/ksu-patch-dry-run.log
            echo "-------------------------"
            echo "If every target path is missing (not just an offset), tiann/KernelSU's"
            echo "directory layout has likely diverged from what this susfs4ksu ref expects."
            echo "Try susfs_repo=https://github.com/WildKernels/susfs4ksu.git (kept in sync"
            echo "with upstream KernelSU main), or pin manager_ref to an older KernelSU commit."
            exit 1
          fi

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after KernelSU SUSFS patch"
            exit 1
          fi
        else
          echo "== check/apply KernelSU SUSFS patch from KSU_ROOT =="
          git apply --check "$KSU_PATCH"
          git apply "$KSU_PATCH"

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after KernelSU SUSFS patch"
            exit 1
          fi
        fi

        cd "$COMMON_DIR"

        echo
        echo "== SUSFS source git diff stat =="
        git -C "$COMMON_DIR" diff --stat

        echo
        echo "== SUSFS KernelSU git diff stat =="
        git -C "$KSU_ROOT" diff --stat 2>/dev/null || echo "(no separate KSU_ROOT diff for manager=${{ inputs.manager }})"
