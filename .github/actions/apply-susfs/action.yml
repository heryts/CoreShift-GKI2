name: Apply SUSFS4KSU
description: Apply SUSFS4KSU source files and patches for selected GKI version (pinned commit, cloned from GitLab).
inputs:
  kernel_version:
    required: true
    description: Kernel version to patch.
  manager:
    required: true
    description: Selected manager.
  susfs_ref:
    required: false
    default: "d4c3914"
    description: "susfs4ksu commit to pin."
  susfs_repo:
    required: false
    default: "https://gitlab.com/simonpunk/susfs4ksu.git"
    description: "SUSFS4KSU source repo. Override if the default source hasn't adapted to an upstream KernelSU change yet (e.g. https://github.com/WildKernels/susfs4ksu.git)."
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        if [ "${{ inputs.manager }}" = "Vanilla" ]; then
          echo "::error::SUSFS4KSU requires a KernelSU-compatible manager."
          exit 1
        fi

        case "${{ inputs.kernel_version }}" in
          5.10) SUSFS_BRANCH="gki-android12-5.10"; SUSFS_DEFAULT_REF="fb16b41" ;;
          6.1)  SUSFS_BRANCH="gki-android14-6.1";  SUSFS_DEFAULT_REF="5727f79" ;;
          6.6)  SUSFS_BRANCH="gki-android15-6.6";  SUSFS_DEFAULT_REF="eba2a88" ;;
          6.12) SUSFS_BRANCH="gki-android16-6.12"; SUSFS_DEFAULT_REF="c7db8cb" ;;
          *)
            echo "::error::unsupported kernel_version for SUSFS: ${{ inputs.kernel_version }}"
            exit 1
            ;;
        esac

        SUSFS_REF="${{ inputs.susfs_ref }}"
        if [ "$SUSFS_REF" = "d4c3914" ]; then
          echo "== kernel_version=${{ inputs.kernel_version }}: using resolved default pin $SUSFS_DEFAULT_REF (v2.3.0) =="
          SUSFS_REF="$SUSFS_DEFAULT_REF"
        fi

        SUSFS_REPO="${{ inputs.susfs_repo }}"
        SUSFS_CLONE_DIR="${RUNNER_TEMP:-/tmp}/susfs4ksu"
        rm -rf "$SUSFS_CLONE_DIR"

        SUSFS_CLONE_BRANCH="$SUSFS_BRANCH"
        if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
          SUSFS_CLONE_BRANCH="${SUSFS_BRANCH}-dev"
          echo "== kernel_version=5.10: sourcing susfs4ksu from -dev branch =="
        fi

        echo "== cloning susfs4ksu (branch: $SUSFS_CLONE_BRANCH) from $SUSFS_REPO =="
        git clone --branch "$SUSFS_CLONE_BRANCH" "$SUSFS_REPO" "$SUSFS_CLONE_DIR"

        if [ "${{ inputs.manager }}" = "KernelSU-Next" ]; then
          echo "== skipping susfs_ref pin for KernelSU-Next; using branch HEAD =="
        elif [ "${{ inputs.manager }}" = "KernelSU" ]; then
          case "${{ inputs.kernel_version }}" in
            5.10) KERNELSU_SUSFS_PIN="e5b013b" ;;
            *)    KERNELSU_SUSFS_PIN="" ;;
          esac

          echo "== resolving susfs_ref for manager=KernelSU =="
          if [ -n "$SUSFS_REF" ] && [ "$SUSFS_REF" != "$SUSFS_DEFAULT_REF" ]; then
            echo "== pinning to explicitly-provided ref: $SUSFS_REF =="
            git -C "$SUSFS_CLONE_DIR" checkout "$SUSFS_REF"
          elif [ -n "$KERNELSU_SUSFS_PIN" ]; then
            echo "== pinning to known-good commit for manager=KernelSU: $KERNELSU_SUSFS_PIN =="
            git -C "$SUSFS_CLONE_DIR" fetch origin "${SUSFS_BRANCH}-dev"
            git -C "$SUSFS_CLONE_DIR" checkout "$KERNELSU_SUSFS_PIN"
          else
            echo "::warning::no verified susfs4ksu pin for manager=KernelSU, kernel_version=${{ inputs.kernel_version }} yet;"
            if git ls-remote --heads "$SUSFS_REPO" "${SUSFS_BRANCH}-dev" | grep -q .; then
              echo "== ${SUSFS_BRANCH}-dev exists on remote, using it =="
              git -C "$SUSFS_CLONE_DIR" fetch --depth 1 origin "${SUSFS_BRANCH}-dev"
              git -C "$SUSFS_CLONE_DIR" checkout --detach FETCH_HEAD
            else
              echo "== no -dev branch found, using $SUSFS_BRANCH HEAD =="
            fi
          fi
        elif [ "${{ inputs.manager }}" = "ResukiSU" ]; then
          if [ -n "$SUSFS_REF" ] && [ "$SUSFS_REF" != "$SUSFS_DEFAULT_REF" ]; then
            echo "== pinning to explicitly-provided ref: $SUSFS_REF =="
            git -C "$SUSFS_CLONE_DIR" checkout "$SUSFS_REF"
          else
            echo "== pinning to known-good default for manager=ResukiSU: $SUSFS_DEFAULT_REF =="
            git -C "$SUSFS_CLONE_DIR" checkout "$SUSFS_DEFAULT_REF"
          fi
        else
          echo "== pinning to ref: $SUSFS_REF =="
          git -C "$SUSFS_CLONE_DIR" checkout "$SUSFS_REF"
        fi

        SUSFS_COMMIT="$(git -C "$SUSFS_CLONE_DIR" rev-parse --short HEAD)"
        SUSFS_COMMIT_MSG="$(git -C "$SUSFS_CLONE_DIR" log -1 --format='%s')"
        SUSFS_COMMIT_DATE="$(git -C "$SUSFS_CLONE_DIR" log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')"
        echo "susfs4ksu resolved commit: $SUSFS_COMMIT ($SUSFS_COMMIT_DATE) - $SUSFS_COMMIT_MSG"

        if [ "${{ inputs.manager }}" = "KernelSU-Next" ]; then
          echo "== applying pershoot coexistence patches (on top of unpinned HEAD) =="

          PERSHOOT_PATCH_BASE="https://raw.githubusercontent.com/WildKernels/kernel_patches/main/pershoot/susfs4ksu"

          curl -fsSL "$PERSHOOT_PATCH_BASE/0001-pershoot-Allow-core-to-be-built-with-no-features.patch" -o /tmp/0001-pershoot.patch
          curl -fsSL "$PERSHOOT_PATCH_BASE/0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch" -o /tmp/0002-pershoot.patch

          cd "$SUSFS_CLONE_DIR"
          patch -p1 < /tmp/0001-pershoot.patch
          patch -p1 < /tmp/0002-pershoot.patch
          cd - > /dev/null

          echo "pershoot coexistence patches applied on top of unpinned susfs4ksu HEAD"
        fi

        PATCH_DIR="$SUSFS_CLONE_DIR/kernel_patches"

        echo "== SUSFS4KSU patch dir =="
        echo "$PATCH_DIR"

        SUSFS_C="$PATCH_DIR/fs/susfs.c"
        SUSFS_INCLUDE_DIR="$PATCH_DIR/include/linux"
        KSU_PATCH="$PATCH_DIR/KernelSU/10_enable_susfs_for_ksu.patch"
        SUSFS_PATCH="$PATCH_DIR/50_add_susfs_in_${SUSFS_BRANCH}.patch"

        for path in "$PATCH_DIR" "$SUSFS_C" "$SUSFS_INCLUDE_DIR" "$SUSFS_PATCH" "$KSU_PATCH"; do
          if [ ! -e "$path" ]; then
            echo "::error::missing SUSFS file/patch: $path"
            find "$PATCH_DIR" -maxdepth 3 2>/dev/null || true
            exit 1
          fi
        done

        if ! find "$SUSFS_INCLUDE_DIR" -maxdepth 1 -type f -name '*.h' | grep -q .; then
          echo "::error::missing SUSFS include/linux/*.h files in $SUSFS_INCLUDE_DIR"
          exit 1
        fi

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"

        cd "$COMMON_DIR"

        echo "== copy SUSFS files =="
        mkdir -p fs include/linux
        cp "$SUSFS_C" fs/susfs.c
        cp "$SUSFS_INCLUDE_DIR"/* include/linux/
        ls -l fs/susfs.c include/linux/susfs*.h

        case "${{ inputs.manager }}" in
          KernelSU-Backslashxx|MidoriSU-Manual|MidoriSU-BranchLink|MidoriSU-Syscall-Table-Tampering|KowSU|MidoriSU-Deinlined|MidoriSU-Next-Deinlined|MidoriSU-ReSUki-Deinlined)
            DEINLINED_FILENAME="50_add_susfs_in_${SUSFS_BRANCH}-deinlined.patch"
            STATIC_DEINLINED_PATCH="${GITHUB_WORKSPACE}/.github/patches/susfs4ksu/${DEINLINED_FILENAME}"
            DEINLINE_SCRIPT="${GITHUB_WORKSPACE}/.github/patches/susfs4ksu/susfs_deinlined.sh"
            RESOLVED_DEINLINED_PATCH=""

            if [ "$SUSFS_BRANCH" = "gki-android12-5.10" ]; then
              echo "== manager=${{ inputs.manager }}, branch=$SUSFS_BRANCH: de-inlined patch is hand-maintained locally =="
              if [ -f "$STATIC_DEINLINED_PATCH" ]; then
                echo "static_patch=$STATIC_DEINLINED_PATCH"
                RESOLVED_DEINLINED_PATCH="$STATIC_DEINLINED_PATCH"
              else
                echo "::error::missing local de-inlined patch: $STATIC_DEINLINED_PATCH"
                exit 1
              fi
            else
              case "$SUSFS_BRANCH" in
                gki-android14-6.1)  REMOTE_SRC_DIR="android14-6.1";  REMOTE_SRC_FILE="50_add_susfs_in_gki-android14-6.1.patch" ;;
                gki-android15-6.6)  REMOTE_SRC_DIR="android15-6.6";  REMOTE_SRC_FILE="50_add_susfs_in_gki-android15-6.6.patch" ;;
                gki-android16-6.12) REMOTE_SRC_DIR="android16-6.12"; REMOTE_SRC_FILE="50_add_susfs_in_gki-android16-6.12.92.patch" ;;
                *)
                  echo "::error::no midori01/gki_ksu_workflow source mapping for branch $SUSFS_BRANCH"
                  exit 1
                  ;;
              esac

              REMOTE_INLINE_URL="https://raw.githubusercontent.com/midori01/gki_ksu_workflow/main/.github/patches/${REMOTE_SRC_DIR}/${REMOTE_SRC_FILE}"
              REMOTE_INLINE_PATCH="${RUNNER_TEMP:-/tmp}/${REMOTE_SRC_FILE}"

              echo "== manager=${{ inputs.manager }}, branch=$SUSFS_BRANCH: fetching original SUSFS patch from midori01/gki_ksu_workflow =="
              echo "source_patch=$REMOTE_INLINE_URL"

              if curl -fsSL "$REMOTE_INLINE_URL" -o "$REMOTE_INLINE_PATCH" && [ -s "$REMOTE_INLINE_PATCH" ]; then
                if [ ! -f "$DEINLINE_SCRIPT" ]; then
                  echo "::error::missing de-inline script: $DEINLINE_SCRIPT"
                  exit 1
                fi

                GENERATED_DEINLINED_PATCH="${RUNNER_TEMP:-/tmp}/${DEINLINED_FILENAME}"
                echo "== de-inlining fetched patch (source: midori01/gki_ksu_workflow, $REMOTE_SRC_DIR/$REMOTE_SRC_FILE) =="
                bash "$DEINLINE_SCRIPT" "$REMOTE_INLINE_PATCH" "$GENERATED_DEINLINED_PATCH"

                if [ -s "$GENERATED_DEINLINED_PATCH" ]; then
                  RESOLVED_DEINLINED_PATCH="$GENERATED_DEINLINED_PATCH"
                else
                  echo "::warning::de-inlining fetched midori01 patch produced an empty result"
                fi
              else
                echo "::warning::failed to fetch $REMOTE_INLINE_URL"
              fi

              if [ -z "$RESOLVED_DEINLINED_PATCH" ] && [ -f "$STATIC_DEINLINED_PATCH" ]; then
                echo "::warning::falling back to local static de-inlined patch: $STATIC_DEINLINED_PATCH =="
                RESOLVED_DEINLINED_PATCH="$STATIC_DEINLINED_PATCH"
              fi
            fi

            if [ -n "$RESOLVED_DEINLINED_PATCH" ]; then
              echo "== manager=${{ inputs.manager }}: using de-inlined core SUSFS patch =="
              SUSFS_PATCH="$RESOLVED_DEINLINED_PATCH"
            else
              echo "== manager=${{ inputs.manager }}: no de-inlined patch available, de-inlining core SUSFS patch (from susfs4ksu clone) on the fly (commit $SUSFS_COMMIT) =="
              if [ ! -f "$DEINLINE_SCRIPT" ]; then
                echo "::error::missing de-inline script: $DEINLINE_SCRIPT"
                exit 1
              fi

              DEINLINED_PATCH="${RUNNER_TEMP:-/tmp}/${DEINLINED_FILENAME}"
              bash "$DEINLINE_SCRIPT" "$SUSFS_PATCH" "$DEINLINED_PATCH"

              if [ ! -s "$DEINLINED_PATCH" ]; then
                echo "::error::de-inlined SUSFS patch is empty, aborting"
                exit 1
              fi

              SUSFS_PATCH="$DEINLINED_PATCH"
            fi
            ;;
        esac

        echo
        echo "== check/apply core SUSFS patch =="
        if git apply --check "$SUSFS_PATCH"; then
          git apply "$SUSFS_PATCH"
        else
          echo "::warning::core SUSFS patch (commit $SUSFS_COMMIT) does not apply cleanly via 'git apply' (strict context match)"
          echo "== retrying with 'patch --fuzz=3' (tolerates minor upstream GKI header drift) =="
          if (patch --dry-run --fuzz=3 -p1 < "$SUSFS_PATCH") >/tmp/susfs_fuzz_dry_run.log 2>&1; then
            patch --fuzz=3 -p1 < "$SUSFS_PATCH"
            echo "== core SUSFS patch applied via fuzzy fallback =="
          else
            echo "::error::core SUSFS patch (commit $SUSFS_COMMIT) does not apply to this source tree, even with fuzz=3"
            echo "== dumping reject hunks for diagnosis (manager=${{ inputs.manager }}) =="
            find . -name '*.rej' -delete
            git apply --reject "$SUSFS_PATCH" 2>/tmp/susfs_reject.log || true
            cat /tmp/susfs_reject.log || true
            for rej in $(find . -name '*.rej'); do
              echo "---- $rej ----"
              cat "$rej"
            done
            git checkout -- . 2>/dev/null || true
            find . -name '*.orig' -delete 2>/dev/null || true
            find . -name '*.rej' -delete 2>/dev/null || true
            exit 1
          fi
        fi

        if [ "${{ inputs.kernel_version }}" = "6.12" ] && [ -f fs/proc/task_mmu.c ]; then
          echo
          echo "== fixup: relocate CONFIG_KSU_SUSFS_SUS_MAP hunk in fs/proc/task_mmu.c =="
          echo "This tree renames vma_pages() -> vma_data_pages(), so the core SUSFS patch's"
          echo "show_smap() context match fails and 'patch --fuzz=3' can misplace the hunk"
          echo "mid-argument inside __show_smap()'s SEQ_PUT_DEC(...) call, breaking compilation."
          echo "" | base64 -d | python3 -
        fi

        if [ "${{ inputs.manager }}" = "KernelSU-Next" ] || [ "${{ inputs.manager }}" = "MidoriSU-Next-Deinlined" ]; then
          echo "== fixing set_nameidata() call-site/declaration mismatch =="
          echo "50_add_susfs_in_*.patch adds a 4th arg at call sites but this source tree's"
          echo "set_nameidata() declaration wasn't updated to accept it; strip the extra arg."
          sed -i -E 's/set_nameidata\(([^,]+), ([^,]+), ([^,]+), NULL\);/set_nameidata(\1, \2, \3);/' fs/namei.c
          grep -n 'set_nameidata(' fs/namei.c
        fi

        if find . -name '*.rej' -print -quit | grep -q .; then
          echo "::error::reject files found after SUSFS patch"
          find . -name '*.rej' -print
          exit 1
        fi

        if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' \
          fs \
          include/linux/susfs.h \
          include/linux/susfs_def.h \
          drivers/input/input.c \
          kernel \
          security/selinux; then
          echo "::error::conflict markers found after core SUSFS patch"
          exit 1
        fi

        echo
        echo "== locate integrated KernelSU root =="
        KSU_MARKERS="$(
          find -L "$COMMON_DIR" \
            -type f \
            \( -path "*/kernel/include/ksu.h" -o -path "*/kernel/ksu.h" \) \
            -print
        )"

        if [ -z "$KSU_MARKERS" ]; then
          echo "::error::No integrated KernelSU root found for manager '${{ inputs.manager }}'. Expected a file matching */kernel/include/ksu.h under $COMMON_DIR."
          exit 1
        fi

        KSU_MARKER="$(printf '%s\n' "$KSU_MARKERS" | sort | head -n 1)"
        KSU_ROOT="${KSU_MARKER%/kernel/include/ksu.h}"
        KSU_ROOT="${KSU_ROOT%/kernel/ksu.h}"

        echo "KSU_ROOT=$KSU_ROOT"

        cd "$KSU_ROOT"

        echo
        if [ "${{ inputs.manager }}" = "ResukiSU" ] || [ "${{ inputs.manager }}" = "KernelSU-Next" ]; then
          echo "== skipping generic KernelSU SUSFS enablement patch =="
          echo "manager=${{ inputs.manager }} has its own SUSFS wiring built into its source."
        elif [ "${{ inputs.manager }}" = "KernelSU-Backslashxx" ] || [ "${{ inputs.manager }}" = "MidoriSU-Manual" ] || [ "${{ inputs.manager }}" = "MidoriSU-BranchLink" ] || [ "${{ inputs.manager }}" = "MidoriSU-Syscall-Table-Tampering" ]; then
          echo "== check/apply ${{ inputs.manager }} SUSFS enablement patch (midori01/KernelSU xx.patch) =="

          XX_PATCH_URL="https://github.com/midori01/KernelSU/commit/xx.patch"
          XX_PATCH="${RUNNER_TEMP:-/tmp}/backslashxx-susfs-xx.patch"

          echo "fetching $XX_PATCH_URL"
          if ! curl -fsSL "$XX_PATCH_URL" -o "$XX_PATCH"; then
            echo "::error::failed to fetch $XX_PATCH_URL"
            exit 1
          fi

          if ! git apply --check "$XX_PATCH"; then
            echo "::error::midori01/KernelSU xx.patch does not apply to this backslashxx/KernelSU tree"
            exit 1
          fi

          git apply "$XX_PATCH"

          if [ "${{ inputs.manager }}" = "MidoriSU-Manual" ] || [ "${{ inputs.manager }}" = "MidoriSU-BranchLink" ] || [ "${{ inputs.manager }}" = "MidoriSU-Syscall-Table-Tampering" ]; then
            for APK_SIGN_FILE in "kernel/manager/apk_sign.c" "$KSU_ROOT/kernel/manager/apk_sign.c"; do
              if [ -f "$APK_SIGN_FILE" ] && ! grep -q "MidoriSU Manager (com.midori.supermanager)" "$APK_SIGN_FILE"; then
                echo "== ${{ inputs.manager }}: re-applying MidoriSU Manager signature after xx.patch =="
                sed -i '/\/\/ KOWX712\/KernelSU/,/return true;/{
              /return true;/a\
              \
              \t// MidoriSU Manager (com.midori.supermanager)\
              \tif (check_v2_signature(path, 0x368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42"))\
              \t\treturn true;
              }' "$APK_SIGN_FILE"
                grep -A3 "MidoriSU Manager" "$APK_SIGN_FILE"
                break
              fi
            done
          fi

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after ${{ inputs.manager }} SUSFS enablement patch"
            exit 1
          fi
        elif [ "${{ inputs.manager }}" = "MidoriSU-Deinlined" ] || [ "${{ inputs.manager }}" = "MidoriSU-Next-Deinlined" ] || [ "${{ inputs.manager }}" = "MidoriSU-ReSUki-Deinlined" ]; then
          case "${{ inputs.manager }}" in
            MidoriSU-Deinlined)        MIDORISU_ENABLE_PATCH_NAME="official.patch" ;;
            MidoriSU-Next-Deinlined)   MIDORISU_ENABLE_PATCH_NAME="next.patch" ;;
            MidoriSU-ReSUki-Deinlined) MIDORISU_ENABLE_PATCH_NAME="resuki.patch" ;;
          esac

          echo "== check/apply ${{ inputs.manager }} SUSFS enablement patch (midori01/KernelSU ${MIDORISU_ENABLE_PATCH_NAME}) =="

          MIDORISU_ENABLE_PATCH_URL="https://github.com/midori01/KernelSU/commit/${MIDORISU_ENABLE_PATCH_NAME}"
          MIDORISU_ENABLE_PATCH="${RUNNER_TEMP:-/tmp}/midorisu-susfs-${MIDORISU_ENABLE_PATCH_NAME}"

          echo "fetching $MIDORISU_ENABLE_PATCH_URL"
          if ! curl -fsSL "$MIDORISU_ENABLE_PATCH_URL" -o "$MIDORISU_ENABLE_PATCH"; then
            echo "::error::failed to fetch $MIDORISU_ENABLE_PATCH_URL"
            exit 1
          fi

          if ! git apply --check "$MIDORISU_ENABLE_PATCH"; then
            echo "::error::midori01/KernelSU ${MIDORISU_ENABLE_PATCH_NAME} does not apply to this ${{ inputs.manager }} tree"
            exit 1
          fi

          git apply "$MIDORISU_ENABLE_PATCH"

          for APK_SIGN_FILE in "kernel/manager/apk_sign.c" "$KSU_ROOT/kernel/manager/apk_sign.c"; do
            if [ -f "$APK_SIGN_FILE" ] && ! grep -q "MidoriSU Manager (com.midori.supermanager)" "$APK_SIGN_FILE"; then
              echo "== ${{ inputs.manager }}: re-applying MidoriSU Manager signature after ${MIDORISU_ENABLE_PATCH_NAME} =="
              # NOTE: same anchor caveat as init-manager - verify '// KOWX712/KernelSU' exists
              # in this fork's apk_sign.c, otherwise this insertion silently no-ops.
              sed -i '/\/\/ KOWX712\/KernelSU/,/return true;/{
              /return true;/a\
              \
              \t// MidoriSU Manager (com.midori.supermanager)\
              \tif (check_v2_signature(path, 0x368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42"))\
              \t\treturn true;
              }' "$APK_SIGN_FILE"
              if ! grep -q "MidoriSU Manager (com.midori.supermanager)" "$APK_SIGN_FILE"; then
                echo "::warning::${{ inputs.manager }}: apk_sign.c anchor pattern did not match in $APK_SIGN_FILE after ${MIDORISU_ENABLE_PATCH_NAME}"
              else
                grep -A3 "MidoriSU Manager" "$APK_SIGN_FILE"
              fi
              break
            fi
          done

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after ${{ inputs.manager }} SUSFS enablement patch"
            exit 1
          fi
        elif [ "${{ inputs.manager }}" = "KowSU" ]; then
          echo "== check/apply KowSU SUSFS enablement patch (midori01/KernelSU kow.patch) =="

          KOW_PATCH_URL="https://github.com/midori01/KernelSU/commit/kow.patch"
          KOW_PATCH="${RUNNER_TEMP:-/tmp}/kowsu-susfs-kow.patch"

          echo "fetching $KOW_PATCH_URL"
          if ! curl -fsSL "$KOW_PATCH_URL" -o "$KOW_PATCH"; then
            echo "::error::failed to fetch $KOW_PATCH_URL"
            exit 1
          fi

          if ! git apply --check "$KOW_PATCH"; then
            echo "::error::midori01/KernelSU kow.patch does not apply to this KOWX712/KernelSU tree"
            exit 1
          fi

          git apply "$KOW_PATCH"

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after KowSU SUSFS enablement patch"
            exit 1
          fi
        elif [ "${{ inputs.manager }}" = "KernelSU" ]; then
          echo "== check/apply KernelSU SUSFS patch from KSU_ROOT (safe mode) =="
          if (patch --dry-run --fuzz=3 -p1 < "$KSU_PATCH") >/tmp/ksu-patch-dry-run.log 2>&1; then
            patch --fuzz=3 -p1 < "$KSU_PATCH"
          elif (patch --dry-run -R --fuzz=3 -p1 < "$KSU_PATCH") >/tmp/ksu-patch-reverse.log 2>&1; then
            echo "== KernelSU SUSFS patch already applied, skipping =="
          else
            echo "== primary susfs4ksu KernelSU patch failed structurally, trying WildKernels/susfs4ksu fallback =="

            FALLBACK_REPO="https://github.com/WildKernels/susfs4ksu.git"
            if [ "$SUSFS_REPO" = "$FALLBACK_REPO" ]; then
              echo "::error::already using fallback repo ($FALLBACK_REPO), no further fallback available"
              echo "---- dry-run output ----"
              sed -n '1,120p' /tmp/ksu-patch-dry-run.log
              echo "-------------------------"
              exit 1
            fi

            FALLBACK_DIR="${RUNNER_TEMP:-/tmp}/susfs4ksu-fallback"
            rm -rf "$FALLBACK_DIR"
            if ! git clone --depth 1 --branch "$SUSFS_BRANCH" "$FALLBACK_REPO" "$FALLBACK_DIR" >/tmp/fallback-clone.log 2>&1; then
              echo "::error::failed to clone fallback repo $FALLBACK_REPO (branch $SUSFS_BRANCH)"
              cat /tmp/fallback-clone.log
              exit 1
            fi

            FALLBACK_KSU_PATCH="$FALLBACK_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            if [ ! -f "$FALLBACK_KSU_PATCH" ]; then
              echo "::error::fallback repo has no $FALLBACK_KSU_PATCH"
              exit 1
            fi

            if (patch --dry-run --fuzz=3 -p1 < "$FALLBACK_KSU_PATCH") >/tmp/ksu-patch-fallback-dry-run.log 2>&1; then
              echo "== fallback KernelSU SUSFS patch applies cleanly, using it =="
              patch --fuzz=3 -p1 < "$FALLBACK_KSU_PATCH"
            elif (patch --dry-run -R --fuzz=3 -p1 < "$FALLBACK_KSU_PATCH") >/tmp/ksu-patch-fallback-reverse.log 2>&1; then
              echo "== fallback KernelSU SUSFS patch already applied, skipping =="
            else
              echo "::error::KernelSU SUSFS patch does not apply to this source tree, from either"
              echo "primary (susfs commit $SUSFS_COMMIT) or WildKernels fallback"
              echo "---- primary dry-run output ----"
              sed -n '1,120p' /tmp/ksu-patch-dry-run.log
              echo "---- fallback dry-run output ----"
              sed -n '1,120p' /tmp/ksu-patch-fallback-dry-run.log
              echo "-------------------------"
              exit 1
            fi
          fi

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after KernelSU SUSFS patch"
            exit 1
          fi
        else
          echo "== check/apply KernelSU SUSFS patch from KSU_ROOT =="
          git apply --check "$KSU_PATCH"
          git apply "$KSU_PATCH"

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' kernel; then
            echo "::error::conflict markers found after KernelSU SUSFS patch"
            exit 1
          fi
        fi

        cd "$COMMON_DIR"

        echo
        echo "== SUSFS source git diff stat =="
        git -C "$COMMON_DIR" diff --stat

        echo
        echo "== SUSFS KernelSU git diff stat =="
        git -C "$KSU_ROOT" diff --stat 2>/dev/null || echo "(no separate KSU_ROOT diff for manager=${{ inputs.manager }})"
