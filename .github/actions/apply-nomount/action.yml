name: Apply NoMount support
description: Apply maxsteeel/nomount VFS-level file injection framework via upstream setup.sh (manager-agnostic, independent from KernelSU-Next's built-in NoMount).
inputs:
  kernel_version:
    required: true
    description: Kernel version being patched.
runs:
  using: composite
  steps:
    - name: Integrate NoMount in kernel
      shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        
        echo "== NoMount (maxsteeel/nomount, dev branch) =="
        echo "kernel_version=${{ inputs.kernel_version }}"     
        echo "COMMON_DIR=$COMMON_DIR"
        cd "$COMMON_DIR"

        curl -LSsf https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

        echo "== NoMount diff stat =="
        git diff --stat -- fs || true
