name: Apply KPM support
description: >
  Build kptools + kpimg from KPatch-Next-EXP source (always the latest commit on the
  default branch) and patch the already-built kernel Image so it gains KPM (Kernel
  Patch Module) support. This is a post-build image patch (like a boot.img-level patch),
  NOT a kernel source patch - it must run AFTER the kernel Image is built and BEFORE
  packaging.
inputs:
  kernel_version:
    required: true
    description: Kernel version being built (used for logging only; kptools/kpimg are architecture-generic, not per-kernel_version).
  image_path:
    required: true
    description: Path (relative to GITHUB_WORKSPACE, or absolute) to the built kernel Image to patch, e.g. out/Image-<final_name>.
  kpm_superkey:
    required: false
    default: ""
    description: Optional superkey (-s) to embed into the patched image. Leave empty to build without a superkey.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        echo "== KPM support: build from source (741afb7/KPatch-Next-EXP, latest) =="
        echo "kernel_version=${{ inputs.kernel_version }} (informational only - kptools/kpimg are not per-kernel_version)"
        echo "Note: this always builds the current HEAD of the default branch - no pinned"
        echo "commit. Upstream breakage there will break this step too; that's expected"
        echo "in exchange for always tracking the latest KPatch-Next-EXP."

        IMAGE_PATH="${{ inputs.image_path }}"
        if [ ! -f "$IMAGE_PATH" ]; then
          echo "::error::built kernel Image not found at IMAGE_PATH=$IMAGE_PATH; apply-kpm-support must run AFTER the 'Build kernel' step (and after any rename/packaging step that produces this exact filename)"
          echo
          echo "== debug: does the parent directory of IMAGE_PATH exist? =="
          IMAGE_DIR="$(dirname -- "$IMAGE_PATH")"
          if [ -d "$IMAGE_DIR" ]; then
            echo "yes: $IMAGE_DIR"
            echo "== debug: contents of $IMAGE_DIR =="
            ls -la "$IMAGE_DIR" 2>/dev/null || true
          else
            echo "no: $IMAGE_DIR does not exist"
          fi
          echo
          echo "== debug: any file literally named 'Image*' under GITHUB_WORKSPACE (depth 6) =="
          find "${GITHUB_WORKSPACE:-.}" -maxdepth 6 -type f -iname 'Image*' -print 2>/dev/null | sort || true
          echo
          echo "== debug: any file whose basename matches IMAGE_PATH's basename, anywhere under GITHUB_WORKSPACE (depth 8) =="
          find "${GITHUB_WORKSPACE:-.}" -maxdepth 8 -type f -iname "$(basename -- "$IMAGE_PATH")" -print 2>/dev/null | sort || true
          echo
          echo "Hint: image_path is supplied by the caller workflow, not computed in this action."
          echo "If a rename/packaging step is meant to create this exact filename before this step runs,"
          echo "confirm that step (a) ran, (b) ran before 'Apply KPM support' in the job, and (c) used the"
          echo "same name template as image_path=$IMAGE_PATH."
          exit 1
        fi

        KPM_CLONE_DIR="${RUNNER_TEMP:-/tmp}/kpatch-next-exp"
        rm -rf "$KPM_CLONE_DIR"

        echo "== cloning 741afb7/KPatch-Next-EXP (latest) =="
        git clone --depth 1 https://github.com/741afb7/KPatch-Next-EXP.git "$KPM_CLONE_DIR"

        KPM_COMMIT="$(git -C "$KPM_CLONE_DIR" rev-parse --short HEAD)"
        KPM_COMMIT_MSG="$(git -C "$KPM_CLONE_DIR" log -1 --format='%s')"
        echo "KPatch-Next-EXP resolved commit: $KPM_COMMIT - $KPM_COMMIT_MSG"

        LOCAL_PATCH_DIR="$GITHUB_WORKSPACE/.github/patches/kpm-support"
        if [ -d "$LOCAL_PATCH_DIR" ] && find "$LOCAL_PATCH_DIR" -maxdepth 1 -type f -name '*.patch' -print -quit | grep -q .; then
          echo "== applying local CI-compatibility patches from $LOCAL_PATCH_DIR =="
          echo "(overlay patches to make KPatch-Next-EXP's own source/build.sh work in this CI"
          echo "environment - NOT kernel source patches. Applied on top of commit $KPM_COMMIT.)"

          cd "$KPM_CLONE_DIR"
          for p in "$LOCAL_PATCH_DIR"/*.patch; do
            echo "-- $p"
            if ! git apply --check "$p"; then
              echo "::error::local KPM patch does not apply to KPatch-Next-EXP @ $KPM_COMMIT: $p"
              exit 1
            fi
            git apply "$p"
          done

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::reject files found after applying local KPM patches"
            find . -name '*.rej' -print
            exit 1
          fi
          cd - > /dev/null
        else
          echo "== no local patches in $LOCAL_PATCH_DIR, building KPatch-Next-EXP unmodified =="
        fi

        echo
        echo "== ensuring aarch64-none-elf-gcc toolchain is available =="
        if ! command -v aarch64-none-elf-gcc >/dev/null 2>&1; then
          TOOLCHAIN_VER="14.2.rel1"
          TOOLCHAIN_ARCHIVE="arm-gnu-toolchain-${TOOLCHAIN_VER}-x86_64-aarch64-none-elf"
          TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${TOOLCHAIN_VER}/binrel/${TOOLCHAIN_ARCHIVE}.tar.xz"
          TOOLCHAIN_DIR="${RUNNER_TEMP:-/tmp}/${TOOLCHAIN_ARCHIVE}"

          echo "aarch64-none-elf-gcc not found in PATH; downloading Arm GNU Toolchain ${TOOLCHAIN_VER}"
          mkdir -p "$TOOLCHAIN_DIR"
          curl -fsSL "$TOOLCHAIN_URL" -o "${RUNNER_TEMP:-/tmp}/arm-gnu-toolchain.tar.xz"
          tar -xJf "${RUNNER_TEMP:-/tmp}/arm-gnu-toolchain.tar.xz" -C "$TOOLCHAIN_DIR" --strip-components=1

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
        else
          echo "aarch64-none-elf-gcc already available in PATH, skipping download"
        fi

        echo "== toolchain check =="
        command -v aarch64-none-elf-gcc
        aarch64-none-elf-gcc --version | head -n 1

        echo
        echo "== ensuring ANDROID_NDK is set (build.sh needs it for the cmake-based kpatch/kptools builds) =="
        if [ -z "${ANDROID_NDK:-}" ]; then
          if [ -n "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK="$ANDROID_NDK_HOME"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            export ANDROID_NDK="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          fi
        fi

        if [ -z "${ANDROID_NDK:-}" ] || [ ! -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake" ]; then
          echo "::error::ANDROID_NDK is not set to a valid NDK install (build.sh needs \$ANDROID_NDK/build/cmake/android.toolchain.cmake)"
          echo "ANDROID_NDK=${ANDROID_NDK:-<unset>}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          exit 1
        fi
        echo "ANDROID_NDK=$ANDROID_NDK"

        echo
        echo "== building kptools + kpimg (./build.sh) =="
        cd "$KPM_CLONE_DIR"
        chmod +x build.sh
        ./build.sh
        cd - > /dev/null

        echo
        echo "== locating built kptools binary =="
        KPTOOLS_BIN="$(
          find "$KPM_CLONE_DIR" -maxdepth 4 -type f -name 'kptools*' -perm -u+x -print |
            sort |
            head -n 1
        )"

        if [ -z "$KPTOOLS_BIN" ]; then
          echo "::error::could not locate a built kptools binary under $KPM_CLONE_DIR after ./build.sh"
          echo "== directory listing (depth 4) for troubleshooting =="
          find "$KPM_CLONE_DIR" -maxdepth 4 2>/dev/null || true
          exit 1
        fi
        echo "KPTOOLS_BIN=$KPTOOLS_BIN"

        echo
        echo "== locating built kpimg payload =="
        KPIMG_BIN="$(
          find "$KPM_CLONE_DIR" -maxdepth 4 -type f -iname 'kpimg*' ! -name '*.o' ! -name '*.d' -print |
            sort |
            head -n 1
        )"

        if [ -z "$KPIMG_BIN" ]; then
          echo "::error::could not locate a built kpimg payload under $KPM_CLONE_DIR after ./build.sh"
          echo "== directory listing (depth 4) for troubleshooting =="
          find "$KPM_CLONE_DIR" -maxdepth 4 2>/dev/null || true
          exit 1
        fi
        echo "KPIMG_BIN=$KPIMG_BIN"

        echo
        echo "== patching kernel Image =="
        echo "IMAGE_PATH=$IMAGE_PATH"

        IMAGE_ORI="${IMAGE_PATH}.ori"
        IMAGE_PATCHED="${IMAGE_PATH}.kpm-patched"

        cp "$IMAGE_PATH" "$IMAGE_ORI"
        chmod +x "$KPTOOLS_BIN"

        KPM_SUPERKEY="${{ inputs.kpm_superkey }}"

        if [ -n "$KPM_SUPERKEY" ]; then
          echo "== patching with superkey set =="
          "$KPTOOLS_BIN" -p -i "$IMAGE_ORI" -k "$KPIMG_BIN" -s "$KPM_SUPERKEY" -o "$IMAGE_PATCHED"
        else
          echo "== patching without superkey =="
          "$KPTOOLS_BIN" -p -i "$IMAGE_ORI" -k "$KPIMG_BIN" -o "$IMAGE_PATCHED"
        fi

        if [ ! -s "$IMAGE_PATCHED" ]; then
          echo "::error::kptools did not produce a non-empty patched image at $IMAGE_PATCHED"
          exit 1
        fi

        mv "$IMAGE_PATCHED" "$IMAGE_PATH"
        rm -f "$IMAGE_ORI"

        echo
        echo "== KPM patch applied =="
        ls -l "$IMAGE_PATH"
