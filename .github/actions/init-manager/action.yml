name: Init manager
description: Initialize selected kernel manager.

inputs:
  manager:
    required: true
    description: Manager submodule name.
  manager_ref:
    required: false
    default: ""
    description: Optional manager git ref, commit, or tag.
  susfs:
    required: true
    description: Whether SUSFS4KSU patches are enabled.
  kernel_version:
    required: true
    description: Kernel version used for SUSFS manager compatibility selection.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MANAGER: ${{ inputs.manager }}
        MANAGER_REF: ${{ inputs.manager_ref }}
        SUSFS: ${{ inputs.susfs }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        
        git config --global user.email "bot@github.com"
        git config --global user.name "Workflow Bot"

        MANAGER_DIR="${GITHUB_WORKSPACE}/manager/${MANAGER}"
        COMMON_DIR="${KERNEL_COMMON_DIR:-${GITHUB_WORKSPACE}/kernel/common}"

        SELECTED_MANAGER_REF=""
        MANAGER_REF_SOURCE="submodule-default"

        echo "== init manager =="
        echo "manager=$MANAGER"
        echo "kernel_version=$KERNEL_VERSION"
        echo "manager_dir=$MANAGER_DIR"
        echo "common_dir=$COMMON_DIR"

        git submodule update --init --remote --depth 1 --single-branch "manager/${MANAGER}"

        if [ "$MANAGER" = "KernelSU-Next" ] && [ "$SUSFS" = "on" ]; then
          echo "== KernelSU-Next + SUSFS: switching to pershoot/KernelSU-Next dev-susfs branch =="
          rm -rf "manager/${MANAGER}"
          git clone --branch "dev-susfs" --depth 1 "https://github.com/pershoot/KernelSU-Next.git" "manager/${MANAGER}"
          echo "cloned pershoot/KernelSU-Next @ dev-susfs"
        fi

        if [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== KSUN-Susfs-Hookless: using MirahSyakilla/KSUN fork (pinned via .gitmodules) =="
        fi

        if [ "$MANAGER" = "MidoriSU-Manual" ] || [ "$MANAGER" = "MidoriSU-BranchLink" ] || [ "$MANAGER" = "MidoriSU-Syscall-Table-Tampering" ]; then
          echo "== $MANAGER: plain backslashxx/KernelSU (submodule default), hook mode is a config-only choice =="
        fi

        if [ "$MANAGER" = "KernelSU-Backslashxx" ] && [ "$SUSFS" = "on" ]; then
          echo "== KernelSU-Backslashxx + SUSFS: staying on backslashxx/KernelSU (submodule default) =="
        fi

        if [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ]; then
          echo "== KernelSU-Backslashxx-Tinyfs: switching to backslashxx/KernelSU tinyfs branch =="
          rm -rf "manager/${MANAGER}"
          git clone --branch "tinyfs" --depth 1 "https://github.com/backslashxx/KernelSU.git" "manager/${MANAGER}"
          echo "cloned backslashxx/KernelSU @ tinyfs"
        fi

        if [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== unshallow KernelSU-Next-family submodule =="
          if [ "$(git -C "manager/${MANAGER}" rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git -C "manager/${MANAGER}" fetch --unshallow origin
            git -C "manager/${MANAGER}" fetch --tags origin || true
            echo "submodule unshallowed, commit count now: $(git -C "manager/${MANAGER}" rev-list --count HEAD)"
          else
            echo "submodule already not shallow, skipping"
          fi
        fi

        if [ -n "$MANAGER_REF" ]; then
          SELECTED_MANAGER_REF="$MANAGER_REF"
          MANAGER_REF_SOURCE="explicit"
        elif [ "$SUSFS" = "on" ]; then
          echo "== SUSFS manager compatibility table =="
          printf '%s\n' \
            'manager   kernel  ref' \
            'KernelSU  5.10    aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KernelSU  6.1     aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KernelSU  6.6     aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KernelSU  6.12    aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KowSU     *       (no static pin; live submodule HEAD, probed against kow.patch)' \
            'KernelSU-Backslashxx / Midori-Manual / Midori-BranchLink / Midori-Tamper' \
            '                  *  (no static pin; live submodule HEAD, probed against xx.patch)' \
            'KernelSU-Next 5.10 (pinned via .gitmodules branch)' \
            'KernelSU-Next 6.1  (pinned via .gitmodules branch)' \
            'KernelSU-Next 6.6  (pinned via .gitmodules branch)' \
            'KernelSU-Next 6.12 (pinned via .gitmodules branch)' \
            'MidoriSU-Deinlined / MidoriSU-Next-Deinlined / MidoriSU-ResukiSU-Deinlined' \
            '                  *  (no static pin; live submodule HEAD, probed against official.patch/next.patch/resuki.patch)'

          probe_midori01_patch() {
            local patch_name="$1"
            local live_head
            local probe_patch="${RUNNER_TEMP:-/tmp}/${patch_name%.patch}-probe.patch"
            local probe_log="${RUNNER_TEMP:-/tmp}/${patch_name%.patch}-probe.log"

            live_head="$(git -C "$MANAGER_DIR" rev-parse HEAD)"

            if ! curl -fsSL "https://github.com/midori01/KernelSU/commit/${patch_name}" -o "$probe_patch"; then
              echo "::error::failed to fetch midori01/KernelSU ${patch_name} for the compatibility probe."
              exit 1
            fi

            if git -C "$MANAGER_DIR" apply --check "$probe_patch" >"$probe_log" 2>&1; then
              echo "  ${patch_name} applies cleanly to live HEAD $live_head, pinning to it"
              SELECTED_MANAGER_REF="$live_head"
              MANAGER_REF_SOURCE="susfs-live-verified (${patch_name} applies cleanly to live submodule HEAD)"
            else
              echo "::error::${patch_name} does not apply to ${MANAGER}'s current submodule HEAD ($live_head)."
              sed -n '1,60p' "$probe_log"
              exit 1
            fi
          }

          case "${MANAGER}:${KERNEL_VERSION}" in
            KernelSU:5.10|KernelSU:6.1|KernelSU:6.6|KernelSU:6.12)
              SELECTED_MANAGER_REF="aab67974f1210cad94880ce1fdc14cf63f6e30e0"
              MANAGER_REF_SOURCE="susfs-default"
              ;;
            KowSU:5.10|KowSU:6.1|KowSU:6.6|KowSU:6.12)
              echo "== ${MANAGER}: probing kow.patch against live submodule HEAD before pinning =="
              LIVE_HEAD="$(git -C "$MANAGER_DIR" rev-parse HEAD)"
              KOW_PROBE_PATCH="${RUNNER_TEMP:-/tmp}/kow-probe.patch"
              KOW_PROBE_LOG="${RUNNER_TEMP:-/tmp}/kow-probe.log"

              if ! curl -fsSL "https://github.com/midori01/KernelSU/commit/kow.patch" -o "$KOW_PROBE_PATCH"; then
                echo "::error::failed to fetch midori01/KernelSU kow.patch for the compatibility probe."
                exit 1
              fi

              if git -C "$MANAGER_DIR" apply --check "$KOW_PROBE_PATCH" >"$KOW_PROBE_LOG" 2>&1; then
                echo "  kow.patch applies cleanly to live HEAD $LIVE_HEAD, pinning to it"
                SELECTED_MANAGER_REF="$LIVE_HEAD"
                MANAGER_REF_SOURCE="susfs-live-verified (kow.patch applies cleanly to live submodule HEAD)"
              else
                echo "::error::kow.patch does not apply to KOWX712/KernelSU's current HEAD ($LIVE_HEAD) for manager=${MANAGER}."
                sed -n '1,60p' "$KOW_PROBE_LOG"
                exit 1
              fi
              ;;
            KSUN-Susfs-Hookless:5.10|KSUN-Susfs-Hookless:6.1|KSUN-Susfs-Hookless:6.6|KSUN-Susfs-Hookless:6.12)
              SELECTED_MANAGER_REF=""
              MANAGER_REF_SOURCE="susfs-default (KSUN susfs+nomount-hookless branch)"
              ;;
            KernelSU-Backslashxx:5.10|KernelSU-Backslashxx:6.1|KernelSU-Backslashxx:6.6|KernelSU-Backslashxx:6.12|MidoriSU-Manual:5.10|MidoriSU-Manual:6.1|MidoriSU-Manual:6.6|MidoriSU-Manual:6.12|MidoriSU-BranchLink:5.10|MidoriSU-BranchLink:6.1|MidoriSU-BranchLink:6.6|MidoriSU-BranchLink:6.12|MidoriSU-Syscall-Table-Tampering:5.10|MidoriSU-Syscall-Table-Tampering:6.1|MidoriSU-Syscall-Table-Tampering:6.6|MidoriSU-Syscall-Table-Tampering:6.12)
              echo "== ${MANAGER}: probing xx.patch against live submodule HEAD before pinning =="
              LIVE_HEAD="$(git -C "$MANAGER_DIR" rev-parse HEAD)"
              XX_PROBE_PATCH="${RUNNER_TEMP:-/tmp}/xx-probe.patch"
              XX_PROBE_LOG="${RUNNER_TEMP:-/tmp}/xx-probe.log"

              if ! curl -fsSL "https://github.com/midori01/KernelSU/commit/xx.patch" -o "$XX_PROBE_PATCH"; then
                echo "::error::failed to fetch midori01/KernelSU xx.patch for the compatibility probe."
                exit 1
              fi

              if git -C "$MANAGER_DIR" apply --check "$XX_PROBE_PATCH" >"$XX_PROBE_LOG" 2>&1; then
                echo "  xx.patch applies cleanly to live HEAD $LIVE_HEAD, pinning to it"
                SELECTED_MANAGER_REF="$LIVE_HEAD"
                MANAGER_REF_SOURCE="susfs-live-verified (xx.patch applies cleanly to live submodule HEAD)"
              else
                echo "::error::xx.patch does not apply to backslashxx/KernelSU's current HEAD ($LIVE_HEAD) for manager=${MANAGER}."
                sed -n '1,60p' "$XX_PROBE_LOG"
                exit 1
              fi
              ;;
            ResukiSU:*|KernelSU-Next:*)
              SELECTED_MANAGER_REF=""
              MANAGER_REF_SOURCE="submodule-default (no known SUSFS-pinned commit)"
              ;;
            MidoriSU-Deinlined:5.10|MidoriSU-Deinlined:6.1|MidoriSU-Deinlined:6.6|MidoriSU-Deinlined:6.12)
              echo "== ${MANAGER}: probing official.patch against live submodule HEAD before pinning =="
              probe_midori01_patch "official.patch"
              ;;
            MidoriSU-Next-Deinlined:5.10|MidoriSU-Next-Deinlined:6.1|MidoriSU-Next-Deinlined:6.6|MidoriSU-Next-Deinlined:6.12)
              echo "== ${MANAGER}: probing next.patch against live submodule HEAD before pinning =="
              probe_midori01_patch "next.patch"
              ;;
            MidoriSU-ResukiSU-Deinlined:5.10|MidoriSU-ResukiSU-Deinlined:6.1|MidoriSU-ResukiSU-Deinlined:6.6|MidoriSU-ResukiSU-Deinlined:6.12)
              echo "== ${MANAGER}: probing resuki.patch against live submodule HEAD before pinning =="
              probe_midori01_patch "resuki.patch"
              ;;
            *)
              echo "::error::No SUSFS-compatible default manager ref for manager=${MANAGER}, kernel_version=${KERNEL_VERSION}. Set manager_ref explicitly."
              exit 1
              ;;
          esac
        fi

        cd "$MANAGER_DIR"

        if [ -n "$SELECTED_MANAGER_REF" ]; then
          echo "== pin manager ref =="
          echo "manager_ref=$SELECTED_MANAGER_REF"

          git fetch --depth=1 origin "$SELECTED_MANAGER_REF" ||
            git fetch origin "$SELECTED_MANAGER_REF"

          git checkout FETCH_HEAD
        fi

        MANAGER_HEAD="$(git rev-parse HEAD)"
        MANAGER_DESCRIBE="$(git describe --tags --always || git rev-parse --short HEAD)"

        echo "manager ref source: $MANAGER_REF_SOURCE"
        echo "selected manager ref: ${SELECTED_MANAGER_REF:-submodule-default}"
        echo "manager HEAD: $MANAGER_HEAD"
        echo "manager describe: $MANAGER_DESCRIBE"

        PRE_SETUP_MANAGER_HEAD="$MANAGER_HEAD"

        if [ -z "$SELECTED_MANAGER_REF" ] && { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ] || [ "$MANAGER" = "ResukiSU" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "MidoriSU-Manual" ] || [ "$MANAGER" = "MidoriSU-BranchLink" ] || [ "$MANAGER" = "MidoriSU-Syscall-Table-Tampering" ] || [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "MidoriSU-Deinlined" ] || [ "$MANAGER" = "MidoriSU-Next-Deinlined" ] || [ "$MANAGER" = "MidoriSU-ResukiSU-Deinlined" ]; }; then
          SELECTED_MANAGER_REF="$MANAGER_HEAD"
          MANAGER_REF_SOURCE="submodule-head"
          echo "using submodule HEAD as setup ref: $SELECTED_MANAGER_REF"
        fi

        if [ -f "$MANAGER_DIR/kernel/setup.sh" ]; then
          SETUP_SCRIPT="$MANAGER_DIR/kernel/setup.sh"
        elif [ -f "$MANAGER_DIR/setup.sh" ]; then
          SETUP_SCRIPT="$MANAGER_DIR/setup.sh"
        else
          echo "::error::No setup.sh found for manager=${MANAGER}"
          exit 1
        fi

        git config --global pull.rebase false
        echo "== run manager setup =="
        echo "setup_script=$SETUP_SCRIPT"
        echo "setup_ref=${SELECTED_MANAGER_REF:-none}"

        if [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== link expected KernelSU-Next repo folder to submodule =="
          ln -sfn "$MANAGER_DIR" "$COMMON_DIR/KernelSU-Next"
          echo "linked $COMMON_DIR/KernelSU-Next -> $MANAGER_DIR"
        fi

        cd "$COMMON_DIR"

        if [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== link expected KernelSU-Next repo folder to submodule =="
          ln -sfn "$MANAGER_DIR" "$COMMON_DIR/KernelSU-Next"
          echo "linked $COMMON_DIR/KernelSU-Next -> $MANAGER_DIR"
        fi

        if [ "$MANAGER" = "KernelSU-Next" ] && [ "$SUSFS" = "on" ]; then
          echo "== calling setup.sh with dev-susfs explicitly to prevent it from switching to latest tag =="
          bash "$SETUP_SCRIPT" "dev-susfs"
        elif [ -n "$SELECTED_MANAGER_REF" ] && { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "MidoriSU-Manual" ] || [ "$MANAGER" = "MidoriSU-BranchLink" ] || [ "$MANAGER" = "MidoriSU-Syscall-Table-Tampering" ]; }; then
          echo "== calling setup.sh with explicit ref to prevent it from switching to latest tag =="
          bash "$SETUP_SCRIPT" "$SELECTED_MANAGER_REF"
        else
          bash "$SETUP_SCRIPT"
        fi

        if [ "$MANAGER" = "KSUN-Susfs-Hookless" ] || [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "MidoriSU-Manual" ] || [ "$MANAGER" = "MidoriSU-BranchLink" ] || [ "$MANAGER" = "MidoriSU-Syscall-Table-Tampering" ]; then
          echo "== restore pinned submodule commit after setup.sh =="
          git -C "$MANAGER_DIR" checkout -f "$PRE_SETUP_MANAGER_HEAD"
          RESTORED_HEAD="$(git -C "$MANAGER_DIR" rev-parse HEAD)"
          if [ "$RESTORED_HEAD" != "$PRE_SETUP_MANAGER_HEAD" ]; then
            echo "::error::failed to restore submodule to pinned commit after setup.sh"
            echo "::error::expected=$PRE_SETUP_MANAGER_HEAD actual=$RESTORED_HEAD"
            exit 1
          fi
          echo "restored manager HEAD: $RESTORED_HEAD"
        fi

        if [ "$MANAGER" = "KowSU" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "MidoriSU-Manual" ] || [ "$MANAGER" = "MidoriSU-BranchLink" ] || [ "$MANAGER" = "MidoriSU-Syscall-Table-Tampering" ] || [ "$MANAGER" = "MidoriSU-Deinlined" ] || [ "$MANAGER" = "MidoriSU-Next-Deinlined" ] || [ "$MANAGER" = "MidoriSU-ResukiSU-Deinlined" ]; then
          for APK_SIGN_FILE in "$MANAGER_DIR/kernel/manager/apk_sign.c" "$COMMON_DIR/drivers/kernelsu/manager/apk_sign.c" "$COMMON_DIR/drivers/staging/kernelsu/kernel/manager/apk_sign.c"; do
            if [ -f "$APK_SIGN_FILE" ] && ! grep -q "MidoriSU Manager (com.midori.supermanager)" "$APK_SIGN_FILE"; then
              if grep -q 'apk_sign_key_t apk_sign_keys\[\]' "$APK_SIGN_FILE"; then
                echo "== $MANAGER: patching $APK_SIGN_FILE to accept MidoriSU Manager signature (dual-sign, apk_sign_keys[] table layout) =="
                sed -i '/apk_sign_key_t apk_sign_keys\[\] = {/a\
    { 0x368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42" }, // MidoriSU Manager (com.midori.supermanager)' "$APK_SIGN_FILE"
              else
                echo "== $MANAGER: patching $APK_SIGN_FILE to accept MidoriSU Manager signature (dual-sign, on top of $MANAGER's own manager signature) =="
                sed -i '/\/\/ KOWX712\/KernelSU/,/return true;/{
                /return true;/a\
                \
                \t// MidoriSU Manager (com.midori.supermanager)\
                \tif (check_v2_signature(path, 0x368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42"))\
                \t\treturn true;
                }' "$APK_SIGN_FILE"
              fi
              if ! grep -q "MidoriSU Manager (com.midori.supermanager)" "$APK_SIGN_FILE"; then
                echo "::warning::$MANAGER: apk_sign.c anchor pattern did not match in $APK_SIGN_FILE - MidoriSU Manager signature was NOT inserted; check the anchor comment for this fork"
              else
                grep -A1 "MidoriSU Manager" "$APK_SIGN_FILE"
              fi
            fi
          done
        fi
        
        if { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ]; } &&
          [ -f drivers/staging/Kconfig ] &&
          grep -q 'source "drivers/staging/kernelsu/kernel/Kconfig"' drivers/staging/Kconfig; then
          if [ -f drivers/kernelsu/Kconfig ]; then
            echo "== normalize KernelSU Kconfig layout =="
            echo "removing stale staging KernelSU include; manager setup installed drivers/kernelsu/Kconfig"
            sed -i '\|source "drivers/staging/kernelsu/kernel/Kconfig"|d' drivers/staging/Kconfig
          fi
        fi

        echo "== KernelSU Kconfig validation =="
        grep -R -n 'kernelsu.*/kernel/Kconfig\|KernelSU.*/kernel/Kconfig' drivers Kconfig 2>/dev/null || true
        find . -path '*/kernel/Kconfig' | grep -i 'kernelsu\|ksu' || true

        if grep -R -q 'drivers/staging/kernelsu/kernel/Kconfig' drivers/staging/Kconfig 2>/dev/null; then
          test -f drivers/staging/kernelsu/kernel/Kconfig || {
            echo "::error::drivers/staging/Kconfig references missing drivers/staging/kernelsu/kernel/Kconfig"
            exit 1
          }
        fi

        echo "== verify integrated KernelSU =="
        KSU_MARKERS="$(
          find -L "$COMMON_DIR" \
            -type f \
            \( -path "*/kernel/include/ksu.h" -o -path "*/kernel/ksu.h" \) \
            -print || true
        )"

        if [ -z "$KSU_MARKERS" ]; then
          echo "::error::KernelSU marker kernel/include/ksu.h was not found after setup"
          exit 1
        fi

        KSU_MARKER="$(printf '%s\n' "$KSU_MARKERS" | sort | head -n 1)"
        KSU_ROOT="${KSU_MARKER%/kernel/include/ksu.h}"

        echo "integrated KSU_ROOT=$KSU_ROOT"

        if git -C "$KSU_ROOT" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          INTEGRATED_KSU_HEAD="$(git -C "$KSU_ROOT" rev-parse HEAD)"
          INTEGRATED_KSU_DESCRIBE="$(git -C "$KSU_ROOT" describe --tags --always || git -C "$KSU_ROOT" rev-parse --short HEAD)"

          echo "integrated KSU HEAD: $INTEGRATED_KSU_HEAD"
          echo "integrated KSU describe: $INTEGRATED_KSU_DESCRIBE"
          git -C "$KSU_ROOT" remote -v || true

          if [ -n "$SELECTED_MANAGER_REF" ] && { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "MidoriSU-Manual" ] || [ "$MANAGER" = "MidoriSU-BranchLink" ] || [ "$MANAGER" = "MidoriSU-Syscall-Table-Tampering" ]; }; then
            if [ "$INTEGRATED_KSU_HEAD" != "$SELECTED_MANAGER_REF" ]; then
              echo "::error::Integrated KernelSU HEAD does not match selected manager ref"
              echo "::error::expected=$SELECTED_MANAGER_REF"
              echo "::error::actual=$INTEGRATED_KSU_HEAD"
              exit 1
            fi
          fi
        else
          echo "::warning::Integrated KSU root is not a git repository; cannot verify exact HEAD"
        fi

        if [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "MidoriSU-Manual" ] || [ "$MANAGER" = "MidoriSU-BranchLink" ] || [ "$MANAGER" = "MidoriSU-Syscall-Table-Tampering" ]; then
          echo "== sync KSU_VERSION with midori01/KernelSU commit count (matches manager app versioning) =="

          GH_API_TOKEN="$GH_TOKEN"

          echo "-- GitHub API rate-limit check (confirms whether the token is actually being used) --"
          RATE_HEADERS="$(
            curl -s -D - -o /dev/null \
              -H "Authorization: Bearer ${GH_API_TOKEN}" \
              "https://api.github.com/rate_limit"
          )"
          RATE_LIMIT="$(printf '%s\n' "$RATE_HEADERS" | grep -i '^x-ratelimit-limit:' | tr -d '\r' | awk '{print $2}')"
          RATE_REMAINING="$(printf '%s\n' "$RATE_HEADERS" | grep -i '^x-ratelimit-remaining:' | tr -d '\r' | awk '{print $2}')"
          echo "x-ratelimit-limit=${RATE_LIMIT:-unknown} x-ratelimit-remaining=${RATE_REMAINING:-unknown}"
          if [ "${RATE_LIMIT:-0}" = "60" ]; then
            echo "::warning::rate limit is 60/hour -> github.token is NOT being sent/accepted; commit-count fetch is likely to fail under load"
          elif [ -n "${RATE_LIMIT:-}" ]; then
            echo "rate limit is ${RATE_LIMIT}/hour -> authenticated request confirmed"
          fi

          COMMIT_COUNT="$(
            curl -s \
              -H "Authorization: Bearer ${GH_API_TOKEN}" \
              "https://api.github.com/repos/midori01/KernelSU/commits?per_page=1" \
              -I 2>/dev/null | grep -i '^link:' | grep -oP '&page=\K\d+(?=>; rel="last")' || true
          )"
          COMMIT_COUNT="${COMMIT_COUNT:-0}"

          if [ "$COMMIT_COUNT" = "0" ]; then
            echo "::warning::failed to fetch midori01/KernelSU commit count via GitHub API; KSU_VERSION left as source default (this is the gap you saw between kernel and manager version)"
          else
            SYNCED_KSU_VERSION=$((30999 + COMMIT_COUNT))
            echo "midori01/KernelSU commit_count=$COMMIT_COUNT"
            echo "computed KSU_VERSION=$SYNCED_KSU_VERSION"

            KSU_MAKEFILE="$KSU_ROOT/kernel/Makefile"
            KSU_KBUILD="$KSU_ROOT/kernel/Kbuild"

            if [ -f "$KSU_MAKEFILE" ]; then
              sed -i "s|^CFLAGS_ksu\.o += -DKSU_VERSION=.*|CFLAGS_ksu.o += -DKSU_VERSION=${SYNCED_KSU_VERSION}|" "$KSU_MAKEFILE"
              if grep -q -- "-DKSU_VERSION=${SYNCED_KSU_VERSION}" "$KSU_MAKEFILE"; then
                echo "patched $KSU_MAKEFILE -> KSU_VERSION=$SYNCED_KSU_VERSION"
              else
                echo "::warning::-DKSU_VERSION pattern not found/replaced in $KSU_MAKEFILE; source default kept"
              fi
            else
              echo "::warning::$KSU_MAKEFILE not found, skipping Makefile patch"
            fi

            if [ -f "$KSU_KBUILD" ]; then
              sed -i "s|^ccflags-y += -DKSU_VERSION=.*|ccflags-y += -DKSU_VERSION=${SYNCED_KSU_VERSION}|" "$KSU_KBUILD"
              echo "also patched $KSU_KBUILD (if pattern existed)"
            fi

            mkdir -p "${GITHUB_WORKSPACE}/commit_info"
            echo "$SYNCED_KSU_VERSION" > "${GITHUB_WORKSPACE}/commit_info/driver_version"
          fi
        fi

        if [ "$MANAGER" = "MidoriSU-Manual" ]; then
          echo "== MidoriSU-Manual: applying scope-min-manual-hooks-v2.3.patch to kernel tree =="

          MANUAL_HOOKS_PATCH="${GITHUB_WORKSPACE}/.github/patches/manual-hooks/kernelsu/scope-min-manual-hooks-v2.3.patch"

          if [ ! -f "$MANUAL_HOOKS_PATCH" ]; then
            echo "::error::missing $MANUAL_HOOKS_PATCH"
            exit 1
          fi

          cd "$COMMON_DIR"
          if ! git apply --check "$MANUAL_HOOKS_PATCH"; then
            echo "::error::scope-min-manual-hooks-v2.3.patch does not apply to this kernel tree"
            exit 1
          fi
          git apply "$MANUAL_HOOKS_PATCH"

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' fs kernel 2>/dev/null; then
            echo "::error::conflict markers found after scope-min-manual-hooks-v2.3.patch"
            exit 1
          fi
          echo "manual hooks patch applied"
        fi

        if { [ "$MANAGER" = "ResukiSU" ] || [ "$MANAGER" = "MidoriSU-ResukiSU-Deinlined" ]; } && [ "$SUSFS" = "off" ]; then
          echo "== $MANAGER: applying manual hooks (source patches only) =="
          echo "Kconfig flags (CONFIG_KSU_MANUAL_HOOK, AUTO_SETUID_HOOK, etc.)"
          echo "are applied later via private.fragment in create-config-fragment,"
          echo "not here, to avoid touching gki_defconfig directly."

          RESUKISU_PATCH_DIR="${GITHUB_WORKSPACE}/.github/patches/manual-hooks/resukisu"

          apply_resukisu_patch() {
            local patch_file="$1"
            local label="$2"

            if [ ! -f "$patch_file" ]; then
              echo "::error::missing patch file: $patch_file"
              exit 1
            fi

            echo "-- $label --"
            if ! git apply --check "$patch_file" 2>/tmp/resukisu_patch_check_err; then
              echo "::error::$label patch does not apply cleanly to $COMMON_DIR"
              cat /tmp/resukisu_patch_check_err
              echo "::error::This usually means the target file's surrounding context differs from the official ReSukiSU diff. Manual adjustment of the patch is required for this source tree."
              exit 1
            fi

            git apply "$patch_file"

            if find . -name '*.rej' -print -quit | grep -q .; then
              echo "::error::reject files found after applying $label"
              find . -name '*.rej' -print
              exit 1
            fi
          }

          cd "$COMMON_DIR"
          apply_resukisu_patch "$RESUKISU_PATCH_DIR/001_resukisu_manual_hook.patch" "manual hooks (stat, execve, faccessat, sys_reboot)"

          RESUKISU_CHECK_FILES="fs/stat.c fs/exec.c fs/open.c kernel/reboot.c"

          if [ "$KERNEL_VERSION" = "6.12" ]; then
            echo "== kernel_version=6.12 (>=6.8): LSM-based auto setuid/initrc hooks are unavailable =="
            echo "(drivers/kernelsu/tools/manual_hook_check.mk enforces this); applying the manual"
            echo "replacements instead, matching CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=n and"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=n set in create-config-fragment."
            apply_resukisu_patch "$RESUKISU_PATCH_DIR/002_resukisu_manual_hook_6.12.patch" "manual hooks (setuid, sys_read/init_rc, 6.8+)"
            RESUKISU_CHECK_FILES="$RESUKISU_CHECK_FILES kernel/sys.c fs/read_write.c"
          fi

          for f in $RESUKISU_CHECK_FILES; do
            if grep -qE '^(<<<<<<< |=======$|>>>>>>> )' "$f"; then
              echo "::error::conflict markers found in $f after patching"
              exit 1
            fi
          done

          echo "== ReSukiSU manual hook integration diff stat =="
          git diff --stat
        fi

        cd "$COMMON_DIR"
        git add . 2>/dev/null
        git commit -m "Integrate $MANAGER and remove dirty tag" || true

    - name: Patch ReSukiSU Kbuild for Kleaf/Bazel sandbox compatibility
      if: inputs.manager == 'ResukiSU' || inputs.manager == 'MidoriSU-ResukiSU-Deinlined'
      working-directory: kernel/common
      shell: bash
      run: |
        set -e
        python3 - <<'PYEOF'
        import pathlib, subprocess, sys

        def sh(cmd):
            r = subprocess.run(cmd, shell=True, cwd="KernelSU",
                                capture_output=True, text=True)
            return r.stdout.strip(), r.returncode

        commit_count, _ = sh("git rev-list --count HEAD")
        commit_count = commit_count or "0"

        tag_name, rc = sh("git describe --abbrev=0 --tags 2>/dev/null")
        tag_name = tag_name if rc == 0 and tag_name else "v4.1.0"

        commit_sha, rc = sh("git rev-parse --short=8 HEAD 2>/dev/null")
        commit_sha = commit_sha if rc == 0 and commit_sha else "unknown"

        branch_name, rc = sh("git branch --show-current 2>/dev/null")
        branch_name = branch_name if rc == 0 and branch_name else "unknown"

        _, dirty_rc = sh("git diff-index --quiet HEAD")

        kbuild_path = pathlib.Path("drivers/kernelsu/Kbuild")
        text = kbuild_path.read_text()

        replacements = [
            ("LOCAL_GIT_EXISTS := $(shell test -e $(KSU_SRC)/../.git && echo 1 || echo 0)",
             "LOCAL_GIT_EXISTS := 1"),
            ("KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)",
             "KSU_LOCAL_VERSION := %s" % commit_count),
            ('KSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")',
             'KSU_TAG_NAME    := %s' % tag_name),
            ('KSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")',
             'KSU_COMMIT_SHA  := %s' % commit_sha),
            ("ifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)",
             "ifneq (%s,0)" % dirty_rc),
            ('KSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo "unknown")',
             'KSU_BRANCH_NAME := %s' % branch_name),
        ]

        missing = []
        for old, new in replacements:
            if old not in text:
                missing.append(old)
            else:
                text = text.replace(old, new, 1)

        kbuild_path.write_text(text)

        print("commit_count=%s tag=%s sha=%s branch=%s dirty_rc=%s"
              % (commit_count, tag_name, commit_sha, branch_name, dirty_rc))

        if missing:
            print("::warning::Some expected Kbuild lines were not found - "
                  "ReSukiSU's Kbuild may have changed upstream. "
                  "Re-run the debug dump and update this patch step.")
            for m in missing:
                print("  MISSING:", m)
            sys.exit(0)
        print("Kbuild patched OK - no live .git lookup needed anymore.")
        PYEOF
