name: Init manager
description: Initialize selected kernel manager.

inputs:
  manager:
    required: true
    description: Manager submodule name.
  manager_ref:
    required: false
    default: ""
    description: Optional manager git ref, commit, or tag.
  susfs:
    required: true
    description: Whether SUSFS4KSU patches are enabled.
  kernel_version:
    required: true
    description: Kernel version used for SUSFS manager compatibility selection.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        
        git config --global user.email "bot@github.com"
        git config --global user.name "Workflow Bot"

        MANAGER="${{ inputs.manager }}"
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        MANAGER_DIR="${GITHUB_WORKSPACE}/manager/${MANAGER}"
        COMMON_DIR="${KERNEL_COMMON_DIR:-${GITHUB_WORKSPACE}/kernel/common}"

        SELECTED_MANAGER_REF=""
        MANAGER_REF_SOURCE="submodule-default"

        echo "== init manager =="
        echo "manager=$MANAGER"
        echo "kernel_version=$KERNEL_VERSION"
        echo "manager_dir=$MANAGER_DIR"
        echo "common_dir=$COMMON_DIR"

        git submodule update --init --remote --depth 1 --single-branch "manager/${MANAGER}"

        if [ "$MANAGER" = "KernelSU-Next" ] && [ "${{ inputs.susfs }}" = "on" ]; then
          echo "== KernelSU-Next + SUSFS: switching to pershoot/KernelSU-Next dev-susfs branch =="
          rm -rf "manager/${MANAGER}"
          git clone --branch "dev-susfs" --depth 1 "https://github.com/pershoot/KernelSU-Next.git" "manager/${MANAGER}"
          echo "cloned pershoot/KernelSU-Next @ dev-susfs"
        fi

        if [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== KSUN-Susfs-Hookless: using MirahSyakilla/KSUN fork (pinned via .gitmodules) =="
        fi

        if [ "$MANAGER" = "KernelSU-Midori-Manual" ] || [ "$MANAGER" = "KernelSU-Midori-BranchLink" ] || [ "$MANAGER" = "KernelSU-Midori-Tamper" ]; then
          echo "== $MANAGER: plain backslashxx/KernelSU (submodule default), hook mode is a config-only choice =="
        fi

        if [ "$MANAGER" = "KernelSU-Backslashxx" ] && [ "${{ inputs.susfs }}" = "on" ]; then
          echo "== KernelSU-Backslashxx + SUSFS: staying on backslashxx/KernelSU (submodule default) =="
        fi

        if [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ]; then
          echo "== KernelSU-Backslashxx-Tinyfs: switching to backslashxx/KernelSU tinyfs branch =="
          rm -rf "manager/${MANAGER}"
          git clone --branch "tinyfs" --depth 1 "https://github.com/backslashxx/KernelSU.git" "manager/${MANAGER}"
          echo "cloned backslashxx/KernelSU @ tinyfs"
        fi

        if [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== unshallow KernelSU-Next-family submodule =="
          if [ "$(git -C "manager/${MANAGER}" rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git -C "manager/${MANAGER}" fetch --unshallow origin
            git -C "manager/${MANAGER}" fetch --tags origin || true
            echo "submodule unshallowed, commit count now: $(git -C "manager/${MANAGER}" rev-list --count HEAD)"
          else
            echo "submodule already not shallow, skipping"
          fi
        fi

        if [ -n "${{ inputs.manager_ref }}" ]; then
          SELECTED_MANAGER_REF="${{ inputs.manager_ref }}"
          MANAGER_REF_SOURCE="explicit"
        elif [ "${{ inputs.susfs }}" = "on" ]; then
          echo "== SUSFS manager compatibility table =="
          printf '%s\n' \
            'manager   kernel  ref' \
            'KernelSU  5.10    aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KernelSU  6.1     aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KernelSU  6.6     aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KernelSU  6.12    aab67974f1210cad94880ce1fdc14cf63f6e30e0' \
            'KowSU     *       (no static pin; live submodule HEAD, probed against kow.patch)' \
            'KernelSU-Backslashxx / Midori-Manual / Midori-BranchLink / Midori-Tamper' \
            '                  *  (no static pin; live submodule HEAD, probed against xx.patch)' \
            'KernelSU-Next 5.10 (pinned via .gitmodules branch)' \
            'KernelSU-Next 6.1  (pinned via .gitmodules branch)' \
            'KernelSU-Next 6.6  (pinned via .gitmodules branch)' \
            'KernelSU-Next 6.12 (pinned via .gitmodules branch)'

          case "${MANAGER}:${KERNEL_VERSION}" in
            KernelSU:5.10|KernelSU:6.1|KernelSU:6.6|KernelSU:6.12)
              SELECTED_MANAGER_REF="aab67974f1210cad94880ce1fdc14cf63f6e30e0"
              MANAGER_REF_SOURCE="susfs-default"
              ;;
            KowSU:5.10|KowSU:6.1|KowSU:6.6|KowSU:6.12)
              echo "== ${MANAGER}: probing kow.patch against live submodule HEAD before pinning =="
              LIVE_HEAD="$(git -C "$MANAGER_DIR" rev-parse HEAD)"
              KOW_PROBE_PATCH="${RUNNER_TEMP:-/tmp}/kow-probe.patch"
              KOW_PROBE_LOG="${RUNNER_TEMP:-/tmp}/kow-probe.log"

              if ! curl -fsSL "https://github.com/midori01/KernelSU/commit/kow.patch" -o "$KOW_PROBE_PATCH"; then
                echo "::error::failed to fetch midori01/KernelSU kow.patch for the compatibility probe."
                exit 1
              fi

              if git -C "$MANAGER_DIR" apply --check "$KOW_PROBE_PATCH" >"$KOW_PROBE_LOG" 2>&1; then
                echo "  kow.patch applies cleanly to live HEAD $LIVE_HEAD, pinning to it"
                SELECTED_MANAGER_REF="$LIVE_HEAD"
                MANAGER_REF_SOURCE="susfs-live-verified (kow.patch applies cleanly to live submodule HEAD)"
              else
                echo "::error::kow.patch does not apply to KOWX712/KernelSU's current HEAD ($LIVE_HEAD) for manager=${MANAGER}."
                sed -n '1,60p' "$KOW_PROBE_LOG"
                exit 1
              fi
              ;;
            KSUN-Susfs-Hookless:5.10|KSUN-Susfs-Hookless:6.1|KSUN-Susfs-Hookless:6.6|KSUN-Susfs-Hookless:6.12)
              SELECTED_MANAGER_REF=""
              MANAGER_REF_SOURCE="susfs-default (KSUN susfs+nomount-hookless branch)"
              ;;
            KernelSU-Backslashxx:5.10|KernelSU-Backslashxx:6.1|KernelSU-Backslashxx:6.6|KernelSU-Backslashxx:6.12|KernelSU-Midori-Manual:5.10|KernelSU-Midori-Manual:6.1|KernelSU-Midori-Manual:6.6|KernelSU-Midori-Manual:6.12|KernelSU-Midori-BranchLink:5.10|KernelSU-Midori-BranchLink:6.1|KernelSU-Midori-BranchLink:6.6|KernelSU-Midori-BranchLink:6.12|KernelSU-Midori-Tamper:5.10|KernelSU-Midori-Tamper:6.1|KernelSU-Midori-Tamper:6.6|KernelSU-Midori-Tamper:6.12)
              echo "== ${MANAGER}: probing xx.patch against live submodule HEAD before pinning =="
              LIVE_HEAD="$(git -C "$MANAGER_DIR" rev-parse HEAD)"
              XX_PROBE_PATCH="${RUNNER_TEMP:-/tmp}/xx-probe.patch"
              XX_PROBE_LOG="${RUNNER_TEMP:-/tmp}/xx-probe.log"

              if ! curl -fsSL "https://github.com/midori01/KernelSU/commit/xx.patch" -o "$XX_PROBE_PATCH"; then
                echo "::error::failed to fetch midori01/KernelSU xx.patch for the compatibility probe."
                exit 1
              fi

              if git -C "$MANAGER_DIR" apply --check "$XX_PROBE_PATCH" >"$XX_PROBE_LOG" 2>&1; then
                echo "  xx.patch applies cleanly to live HEAD $LIVE_HEAD, pinning to it"
                SELECTED_MANAGER_REF="$LIVE_HEAD"
                MANAGER_REF_SOURCE="susfs-live-verified (xx.patch applies cleanly to live submodule HEAD)"
              else
                echo "::error::xx.patch does not apply to backslashxx/KernelSU's current HEAD ($LIVE_HEAD) for manager=${MANAGER}."
                sed -n '1,60p' "$XX_PROBE_LOG"
                exit 1
              fi
              ;;
            ResukiSU:*|Wild_KSU:*|Rissu:*|KernelSU-Next:*)
              SELECTED_MANAGER_REF=""
              MANAGER_REF_SOURCE="submodule-default (no known SUSFS-pinned commit)"
              ;;
            *)
              echo "::error::No SUSFS-compatible default manager ref for manager=${MANAGER}, kernel_version=${KERNEL_VERSION}. Set manager_ref explicitly."
              exit 1
              ;;
          esac
        fi

        cd "$MANAGER_DIR"

        if [ -n "$SELECTED_MANAGER_REF" ]; then
          echo "== pin manager ref =="
          echo "manager_ref=$SELECTED_MANAGER_REF"

          git fetch --depth=1 origin "$SELECTED_MANAGER_REF" ||
            git fetch origin "$SELECTED_MANAGER_REF"

          git checkout FETCH_HEAD
        fi

        MANAGER_HEAD="$(git rev-parse HEAD)"
        MANAGER_DESCRIBE="$(git describe --tags --always || git rev-parse --short HEAD)"

        echo "manager ref source: $MANAGER_REF_SOURCE"
        echo "selected manager ref: ${SELECTED_MANAGER_REF:-submodule-default}"
        echo "manager HEAD: $MANAGER_HEAD"
        echo "manager describe: $MANAGER_DESCRIBE"

        PRE_SETUP_MANAGER_HEAD="$MANAGER_HEAD"

        if [ -z "$SELECTED_MANAGER_REF" ] && { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ] || [ "$MANAGER" = "ResukiSU" ] || [ "$MANAGER" = "Wild_KSU" ] || [ "$MANAGER" = "Rissu" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "KernelSU-Midori-Manual" ] || [ "$MANAGER" = "KernelSU-Midori-BranchLink" ] || [ "$MANAGER" = "KernelSU-Midori-Tamper" ] || [ "$MANAGER" = "KernelSU-Next" ]; }; then
          SELECTED_MANAGER_REF="$MANAGER_HEAD"
          MANAGER_REF_SOURCE="submodule-head"
          echo "using submodule HEAD as setup ref: $SELECTED_MANAGER_REF"
        fi

        if [ -f "$MANAGER_DIR/kernel/setup.sh" ]; then
          SETUP_SCRIPT="$MANAGER_DIR/kernel/setup.sh"
        elif [ -f "$MANAGER_DIR/setup.sh" ]; then
          SETUP_SCRIPT="$MANAGER_DIR/setup.sh"
        else
          echo "::error::No setup.sh found for manager=${MANAGER}"
          exit 1
        fi

        git config --global pull.rebase false
        echo "== run manager setup =="
        echo "setup_script=$SETUP_SCRIPT"
        echo "setup_ref=${SELECTED_MANAGER_REF:-none}"

        if [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== link expected KernelSU-Next repo folder to submodule =="
          ln -sfn "$MANAGER_DIR" "$COMMON_DIR/KernelSU-Next"
          echo "linked $COMMON_DIR/KernelSU-Next -> $MANAGER_DIR"
        fi

        cd "$COMMON_DIR"

        if [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KSUN-Susfs-Hookless" ]; then
          echo "== link expected KernelSU-Next repo folder to submodule =="
          ln -sfn "$MANAGER_DIR" "$COMMON_DIR/KernelSU-Next"
          echo "linked $COMMON_DIR/KernelSU-Next -> $MANAGER_DIR"
        fi

        if [ "$MANAGER" = "KernelSU-Next" ] && [ "${{ inputs.susfs }}" = "on" ]; then
          echo "== calling setup.sh with dev-susfs explicitly to prevent it from switching to latest tag =="
          bash "$SETUP_SCRIPT" "dev-susfs"
        elif [ -n "$SELECTED_MANAGER_REF" ] && { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "KernelSU-Midori-Manual" ] || [ "$MANAGER" = "KernelSU-Midori-BranchLink" ] || [ "$MANAGER" = "KernelSU-Midori-Tamper" ]; }; then
          echo "== calling setup.sh with explicit ref to prevent it from switching to latest tag =="
          bash "$SETUP_SCRIPT" "$SELECTED_MANAGER_REF"
        else
          bash "$SETUP_SCRIPT"
        fi

        if [ "$MANAGER" = "KSUN-Susfs-Hookless" ] || [ "$MANAGER" = "KernelSU-Next" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "KernelSU-Midori-Manual" ] || [ "$MANAGER" = "KernelSU-Midori-BranchLink" ] || [ "$MANAGER" = "KernelSU-Midori-Tamper" ]; then
          echo "== restore pinned submodule commit after setup.sh =="
          git -C "$MANAGER_DIR" checkout -f "$PRE_SETUP_MANAGER_HEAD"
          RESTORED_HEAD="$(git -C "$MANAGER_DIR" rev-parse HEAD)"
          if [ "$RESTORED_HEAD" != "$PRE_SETUP_MANAGER_HEAD" ]; then
            echo "::error::failed to restore submodule to pinned commit after setup.sh"
            echo "::error::expected=$PRE_SETUP_MANAGER_HEAD actual=$RESTORED_HEAD"
            exit 1
          fi
          echo "restored manager HEAD: $RESTORED_HEAD"
        fi

        if [ "$MANAGER" = "KernelSU-Midori-Manual" ] || [ "$MANAGER" = "KernelSU-Midori-BranchLink" ] || [ "$MANAGER" = "KernelSU-Midori-Tamper" ]; then
          for APK_SIGN_FILE in "$MANAGER_DIR/kernel/manager/apk_sign.c" "$COMMON_DIR/drivers/kernelsu/manager/apk_sign.c" "$COMMON_DIR/drivers/staging/kernelsu/kernel/manager/apk_sign.c"; do
            if [ -f "$APK_SIGN_FILE" ] && ! grep -q "MidoriSU Manager (com.midori.supermanager)" "$APK_SIGN_FILE"; then
              echo "== $MANAGER: patching $APK_SIGN_FILE to accept MidoriSU Manager signature =="
              sed -i '/\/\/ KOWX712\/KernelSU/,/return true;/{
              /return true;/a\
              \
              \t// MidoriSU Manager (com.midori.supermanager)\
              \tif (check_v2_signature(path, 0x368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42"))\
              \t\treturn true;
              }' "$APK_SIGN_FILE"
              grep -A3 "MidoriSU Manager" "$APK_SIGN_FILE"
            fi
          done
        fi
        
        if { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ]; } &&
          [ -f drivers/staging/Kconfig ] &&
          grep -q 'source "drivers/staging/kernelsu/kernel/Kconfig"' drivers/staging/Kconfig; then
          if [ -f drivers/kernelsu/Kconfig ]; then
            echo "== normalize KernelSU Kconfig layout =="
            echo "removing stale staging KernelSU include; manager setup installed drivers/kernelsu/Kconfig"
            sed -i '\|source "drivers/staging/kernelsu/kernel/Kconfig"|d' drivers/staging/Kconfig
          fi
        fi

        echo "== KernelSU Kconfig validation =="
        grep -R -n 'kernelsu.*/kernel/Kconfig\|KernelSU.*/kernel/Kconfig' drivers Kconfig 2>/dev/null || true
        find . -path '*/kernel/Kconfig' | grep -i 'kernelsu\|ksu' || true

        if grep -R -q 'drivers/staging/kernelsu/kernel/Kconfig' drivers/staging/Kconfig 2>/dev/null; then
          test -f drivers/staging/kernelsu/kernel/Kconfig || {
            echo "::error::drivers/staging/Kconfig references missing drivers/staging/kernelsu/kernel/Kconfig"
            exit 1
          }
        fi

        echo "== verify integrated KernelSU =="
        KSU_MARKERS="$(
          find -L "$COMMON_DIR" \
            -type f \
            \( -path "*/kernel/include/ksu.h" -o -path "*/kernel/ksu.h" \) \
            -print || true
        )"

        if [ -z "$KSU_MARKERS" ]; then
          echo "::error::KernelSU marker kernel/include/ksu.h was not found after setup"
          exit 1
        fi

        KSU_MARKER="$(printf '%s\n' "$KSU_MARKERS" | sort | head -n 1)"
        KSU_ROOT="${KSU_MARKER%/kernel/include/ksu.h}"

        echo "integrated KSU_ROOT=$KSU_ROOT"

        if git -C "$KSU_ROOT" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          INTEGRATED_KSU_HEAD="$(git -C "$KSU_ROOT" rev-parse HEAD)"
          INTEGRATED_KSU_DESCRIBE="$(git -C "$KSU_ROOT" describe --tags --always || git -C "$KSU_ROOT" rev-parse --short HEAD)"

          echo "integrated KSU HEAD: $INTEGRATED_KSU_HEAD"
          echo "integrated KSU describe: $INTEGRATED_KSU_DESCRIBE"
          git -C "$KSU_ROOT" remote -v || true

          if [ -n "$SELECTED_MANAGER_REF" ] && { [ "$MANAGER" = "KernelSU" ] || [ "$MANAGER" = "KowSU" ] || [ "$MANAGER" = "KernelSU-Backslashxx" ] || [ "$MANAGER" = "KernelSU-Backslashxx-Tinyfs" ] || [ "$MANAGER" = "KernelSU-Midori-Manual" ] || [ "$MANAGER" = "KernelSU-Midori-BranchLink" ] || [ "$MANAGER" = "KernelSU-Midori-Tamper" ]; }; then
            if [ "$INTEGRATED_KSU_HEAD" != "$SELECTED_MANAGER_REF" ]; then
              echo "::error::Integrated KernelSU HEAD does not match selected manager ref"
              echo "::error::expected=$SELECTED_MANAGER_REF"
              echo "::error::actual=$INTEGRATED_KSU_HEAD"
              exit 1
            fi
          fi
        else
          echo "::warning::Integrated KSU root is not a git repository; cannot verify exact HEAD"
        fi

        if [ "$MANAGER" = "KernelSU-Midori-Manual" ]; then
          echo "== KernelSU-Midori-Manual: applying scope-min-manual-hooks-v2.3.patch to kernel tree =="

          MANUAL_HOOKS_PATCH="${RUNNER_TEMP:-/tmp}/scope-min-manual-hooks-v2.3-${KERNEL_VERSION}.patch"

          if [ "$KERNEL_VERSION" = "5.10" ]; then
            # midori01/gki_ksu_workflow doesn't publish android12-5.10 at all
            LOCAL_MANUAL_PATCH="${GITHUB_WORKSPACE}/.github/patches/manual-hooks/android12-5.10/scope-min-manual-hooks-v2.3.patch"
            if [ ! -f "$LOCAL_MANUAL_PATCH" ]; then
              echo "::error::missing $LOCAL_MANUAL_PATCH"
              echo "::error::android12-5.10 has no upstream source for this patch (not published by"
              echo "::error::midori01/gki_ksu_workflow); it must be committed to this repo directly."
              exit 1
            fi
            cp "$LOCAL_MANUAL_PATCH" "$MANUAL_HOOKS_PATCH"
            echo "using locally-committed patch: $LOCAL_MANUAL_PATCH"
          else
            case "$KERNEL_VERSION" in
              6.1)  MIDORI_KMI="android14-6.1" ;;
              6.6)  MIDORI_KMI="android15-6.6" ;;
              6.12) MIDORI_KMI="android16-6.12" ;;
              *)
                echo "::error::manager=KernelSU-Midori-Manual has no manual-hooks patch for kernel_version=$KERNEL_VERSION"
                exit 1
                ;;
            esac

            MANUAL_HOOKS_PATCH_URL="https://raw.githubusercontent.com/midori01/gki_ksu_workflow/main/.github/patches/${MIDORI_KMI}/scope-min-manual-hooks-v2.3.patch"
            echo "fetching $MANUAL_HOOKS_PATCH_URL"
            if ! curl -fsSL "$MANUAL_HOOKS_PATCH_URL" -o "$MANUAL_HOOKS_PATCH"; then
              echo "::error::failed to fetch $MANUAL_HOOKS_PATCH_URL"
              exit 1
            fi
          fi

          cd "$COMMON_DIR"
          if ! git apply --check "$MANUAL_HOOKS_PATCH"; then
            echo "::error::scope-min-manual-hooks-v2.3.patch (kernel_version=$KERNEL_VERSION) does not apply to this kernel tree"
            echo "::error::the target kernel branch may have moved past the commit this patch targets"
            exit 1
          fi
          git apply "$MANUAL_HOOKS_PATCH"

          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)$' fs kernel 2>/dev/null; then
            echo "::error::conflict markers found after scope-min-manual-hooks-v2.3.patch"
            exit 1
          fi
          echo "manual hooks patch applied (kernel_version=$KERNEL_VERSION)"
        fi

        cd "$COMMON_DIR"
        git add . 2>/dev/null
        git commit -m "Integrate ${{ inputs.manager }} and remove dirty tag" || true
