name: "Apply network patches"
description: >
  Applies all kernel-version-dependent network/TCP patches in one step:
  the CONFIG_IP_SET_MAX limit fix (5.10 only), deriving android_version /
  version / sublevel from kernel_version, and applying the BBRv3 TCP
  congestion control patch set (version-specific, plus the 5.10 sysctl
  proc_dou8vec_minmax prerequisite patches when needed).

inputs:
  kernel_version:
    description: "Kernel version being built (5.10 / 6.1 / 6.6 / 6.12)"
    required: true
  kmi_bypass:
    description: "If 'off', whitelist BBRv3's required KMI symbol (tcp_cong_avoid_ai) in the frozen ABI symbol list"
    required: false
    default: "off"

runs:
  using: "composite"
  steps:
    - name: Fix CONFIG_IP_SET_MAX limit
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        echo "== raising ipset max sets limit (kernel_version=${{ inputs.kernel_version }}) =="
        TARGET="net/netfilter/ipset/ip_set_core.c"
        if ! grep -qF "CONFIG_IP_SET_MAX" "$TARGET"; then
          echo "::warning::CONFIG_IP_SET_MAX placeholder not found in $TARGET for kernel_version=${{ inputs.kernel_version }} - source layout may differ on this branch, nothing changed"
        else
          sed -i 's/CONFIG_IP_SET_MAX/65534/g' "$TARGET"
          echo "raised ipset max sets limit to 65534 in $TARGET"
        fi

    - name: Derive kernel version vars
      id: derive-version
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.kernel_version }}" in
          5.10) ANDROID_VERSION="android12" ;;
          6.1)  ANDROID_VERSION="android14" ;;
          6.6)  ANDROID_VERSION="android15" ;;
          6.12) ANDROID_VERSION="android16" ;;
          *)
            echo "::error::unsupported kernel_version: ${{ inputs.kernel_version }}"
            exit 1
            ;;
        esac
        VERSION="${ANDROID_VERSION}-${{ inputs.kernel_version }}"
        {
          echo "android_version=$ANDROID_VERSION"
          echo "version=$VERSION"
        } >> "$GITHUB_OUTPUT"

    - name: Derive kernel sublevel
      id: kernel-sublevel
      shell: bash
      run: |
        set -euo pipefail
        MAKEFILE="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}/Makefile"
        SUBLEVEL="$(grep -m1 '^SUBLEVEL' "$MAKEFILE" | sed 's/^SUBLEVEL[[:space:]]*=[[:space:]]*//')"
        echo "sublevel=$SUBLEVEL" >> "$GITHUB_OUTPUT"
        echo "derived sublevel: $SUBLEVEL"

    - name: Apply BBRv3 Patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        VERSION="${{ steps.derive-version.outputs.version }}"
        PATCH_DIR="${{ github.workspace }}/.github/patches/common/bbrv3"

        if [[ "$VERSION" == "android15-6.6" ]]; then
          patch -p1 < "$PATCH_DIR/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch"
        elif [[ "$VERSION" == "android14-6.1" ]]; then
          patch -p1 < "$PATCH_DIR/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch"
        elif [[ "$VERSION" == "android12-5.10" ]]; then
          patch -p1 < "$PATCH_DIR/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
        elif [[ "$VERSION" == "android16-6.12" ]]; then
          echo "::notice::no BBRv3 patch available yet for version=$VERSION - skipping (CONFIG_TCP_CONG_BBR3 will stay enabled in the config fragment but the actual BBRv3 algorithm won't be present in vmlinux for this version)"
          echo "bbrv3_patch_applied=false" >> "$GITHUB_ENV"
        else
          echo "::error::no BBRv3 patch available for version=$VERSION"
          exit 1
        fi

        if [[ "$VERSION" == "android12-5.10" ]]; then
          if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
            patch -p1 < "$PATCH_DIR/sysctl_add_proc_dou8vec_minmax.patch"
            patch -p1 < "$PATCH_DIR/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch"
          fi
        fi

        if [[ "$VERSION" != "android16-6.12" ]]; then
          echo "bbrv3_patch_applied=true" >> "$GITHUB_ENV"
        fi

        echo "BBRv3 patches applied for version=$VERSION"

    - name: Fix CIFS netfs.ko reference (android16-6.12)
      if: inputs.kernel_version == '6.12'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        if [ -f modules.bzl ] && grep -qF '"fs/netfs/netfs.ko",' modules.bzl; then
          sed -i '/"fs\/netfs\/netfs\.ko",/d' modules.bzl
          echo "removed fs/netfs/netfs.ko entry from modules.bzl"
        else
          echo "::notice::fs/netfs/netfs.ko entry not found in modules.bzl - nothing to remove (may already be fixed upstream)"
        fi

    - name: Whitelist BBRv3 required KMI symbols
      if: inputs.kmi_bypass == 'off'
      shell: bash
      run: |
        set -euo pipefail
        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        SYMBOL_LIST="$COMMON_DIR/android/abi_gki_aarch64"
        if [ ! -f "$SYMBOL_LIST" ]; then
          echo "::error::KMI symbol list not found: $SYMBOL_LIST"
          exit 1
        fi
        if ! grep -qxF "  tcp_cong_avoid_ai" "$SYMBOL_LIST"; then
          echo "  tcp_cong_avoid_ai" >> "$SYMBOL_LIST"
          echo "added tcp_cong_avoid_ai to KMI symbol list"
        else
          echo "tcp_cong_avoid_ai already in KMI symbol list"
        fi
