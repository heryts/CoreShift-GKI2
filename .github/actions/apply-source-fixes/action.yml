name: Apply source fixes
description: >
  Apply maintained/custom source fixes for selected kernel branches, the midori01 source prep (6.12 only), and
  post-config fixups for unbuilt drivers on kernel-6.12.
inputs:
  kernel_version:
    required: true
    description: Kernel version to build.
  source_mode:
    required: false
    default: ""
    description: Selected source mode. Only used when mode=source (midori01 runs the midori01 prep here).
  mode:
    required: false
    default: "source"
    description: >
      Which fixups to apply: "source" (maintained/custom source patch fixes) or
      "unbuilt-drivers".
runs:
  using: composite
  steps:
    - name: Apply midori01 source prep (drop protected exports, strip -dirty)
      if: inputs.mode == 'source' && inputs.source_mode == 'midori01'
      shell: bash
      run: |
        set -euo pipefail

        if [ "${{ inputs.kernel_version }}" != "6.12" ]; then
          echo "midori01 source prep only applies to kernel_version=6.12, skipping"
          exit 0
        fi

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        cd "$COMMON_DIR"

        echo "== midori01 source =="
        echo "HEAD: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
        echo "version: $(sed -n 's/^VERSION *= *//p' Makefile | head -n1).$(sed -n 's/^PATCHLEVEL *= *//p' Makefile | head -n1).$(sed -n 's/^SUBLEVEL *= *//p' Makefile | head -n1)"

        # midori01 does `rm common/android/abi_gki_protected_exports_*`. With plain make that is
        # enough; Kleaf also references the file from a BUILD/.bzl file (protected_exports_list),
        # so the reference has to go too or Bazel fails on the missing input.
        echo
        echo "== drop GKI protected exports list =="
        found=0
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          echo "  removing $f"
          rm -f "$f"
          found=1
        done < <(find . -path ./.git -prune -o -type f -name 'abi_gki_protected_exports*' -print)
        [ "$found" = 1 ] || echo "  no abi_gki_protected_exports* files in this tree"

        python3 - <<'PY'
        import os, re, sys

        # A line that is only: [key (: or =)] "path/abi_gki_protected_exports_xxx" [,]
        pat = re.compile(
            r'^\s*(?:"?protected_exports_list"?\s*[:=]\s*)?"[^"\n]*abi_gki_protected_exports[^"\n]*"\s*,?\s*(?:#.*)?$'
        )
        changed = 0
        leftovers = []
        for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if d != ".git"]
            for name in files:
                if not (name in ("BUILD", "BUILD.bazel", "MODULE.bazel") or name.endswith(".bzl")):
                    continue
                path = os.path.join(root, name)
                try:
                    lines = open(path, encoding="utf-8").read().split("\n")
                except (UnicodeDecodeError, OSError):
                    continue
                kept = [l for l in lines if not pat.match(l)]
                if len(kept) != len(lines):
                    open(path, "w", encoding="utf-8").write("\n".join(kept))
                    print("  stripped %d protected-exports reference(s) from %s" % (len(lines) - len(kept), path))
                    changed += 1
                for i, l in enumerate(kept, 1):
                    if "abi_gki_protected_exports" in l:
                        leftovers.append("%s:%d: %s" % (path, i, l.strip()))
        if leftovers:
            # A glob() over the removed file is harmless; a hard label is not, but Bazel will
            # name it clearly. Warn instead of failing so a harmless leftover can't block a build.
            print("::warning::protected-exports references remain in Bazel files (fine if they are glob()s; if Bazel fails on a missing input, look here):")
            for l in leftovers:
                print("  " + l)
        if not changed:
            print("  no Bazel references to strip")
        PY

        echo
        echo "== strip ' -dirty' from setlocalversion (same as midori01) =="
        if [ -f scripts/setlocalversion ]; then
          sed -i 's/ -dirty//g' scripts/setlocalversion
        fi

        echo
        echo "== working tree after midori01 prep =="
        git status --short 2>/dev/null | head -n 20 || true

    - name: Apply maintained/custom source fixes
      if: inputs.mode == 'source'
      shell: bash
      run: |
        set -euo pipefail

        if [ "${{ inputs.source_mode }}" = "google-lts" ] || [ "${{ inputs.source_mode }}" = "midori01" ]; then
          echo "source fixes: skipped for ${{ inputs.source_mode }}"
          exit 0
        fi

        case "${{ inputs.kernel_version }}" in
          6.12)
            patch_dir="$GITHUB_WORKSPACE/.github/patches/source-fixes/gki-android16-6.12"
            ;;
          *)
            echo "source fixes: none for kernel_version=${{ inputs.kernel_version }}"
            exit 0
            ;;
        esac

        if [ ! -d "$patch_dir" ]; then
          echo "source fixes: patch directory missing: $patch_dir"
          exit 0
        fi

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"

        cd "$COMMON_DIR"

        echo "== apply source fixes =="
        find "$patch_dir" -maxdepth 1 -type f -name '*.patch' -print | sort |
          while IFS= read -r patch_file; do
            echo "patch=$patch_file"
            git apply --check "$patch_file"
            git apply "$patch_file"
          done

    - name: Apply fixes for unbuilt drivers (android16-6.12)
      if: inputs.mode == 'unbuilt-drivers'
      shell: bash
      run: |
        set -euo pipefail

        ROOT_DIR="$GITHUB_WORKSPACE"
        COMMON_DIR="${KERNEL_COMMON_DIR:-$ROOT_DIR/kernel/common}"
        PRIVATE_FRAGMENT="$COMMON_DIR/private.fragment"

        is_config_requested() {
          local symbol="$1"
          [ -f "$PRIVATE_FRAGMENT" ] && grep -qE "^CONFIG_${symbol}=(y|m)\$" "$PRIVATE_FRAGMENT"
        }

        RUST_BINDER_ENABLED="false"
        for sym in ANDROID_BINDER_IPC_RUST ANDROID_BINDER_IPC_RUST_DUMMY; do
          if is_config_requested "$sym"; then
            RUST_BINDER_ENABLED="true"
          fi
        done

        ASHMEM_ENABLED="false"
        for sym in ASHMEM ANDROID_ASHMEM; do
          if is_config_requested "$sym"; then
            ASHMEM_ENABLED="true"
          fi
        done

        echo "RUST_BINDER_ENABLED=$RUST_BINDER_ENABLED"
        echo "ASHMEM_ENABLED=$ASHMEM_ENABLED"

        echo
        echo "== [1/2] Skip unbuilt rust_binder module =="
        MODULES_BZL="$COMMON_DIR/modules.bzl"
        FIXUP_SCRIPT="$ROOT_DIR/.github/patches/source-fixes/gki-android16-6.12/remove-rust-binder-module.py"

        if [ ! -f "$MODULES_BZL" ]; then
          echo "  no common/modules.bzl in this tree, nothing to do, skipping"
        elif ! grep -q "rust_binder.ko" "$MODULES_BZL"; then
          echo "  rust_binder.ko not referenced in modules.bzl, nothing to do, skipping"
        elif [ "$RUST_BINDER_ENABLED" = "true" ]; then
          echo "  Rust Binder is enabled for this build, leaving modules.bzl untouched"
        else
          echo "  rust_binder.ko is listed in modules.bzl but no Rust Binder Kconfig is enabled"
          echo "  removing it from common/modules.bzl so the Kleaf dist target doesn't fail looking for it"
          if [ ! -f "$FIXUP_SCRIPT" ]; then
            echo "::error::fixup script missing: $FIXUP_SCRIPT"
            echo "::error::copy remove-rust-binder-module.py into $(dirname "$FIXUP_SCRIPT")"
            exit 1
          fi
          python3 "$FIXUP_SCRIPT" "$MODULES_BZL"
          if grep -q "rust_binder.ko" "$MODULES_BZL"; then
            echo "::error::rust_binder.ko still present in modules.bzl after fixup script ran"
            exit 1
          fi
          echo "  removed rust_binder.ko from common/modules.bzl"
        fi

        echo
        echo "== [2/2] Trim unbuilt-driver entries from KMI symbol lists =="
        SYMBOLS_DIR="$COMMON_DIR/gki/aarch64/symbols"

        remove_symbol() {
          local symbol="$1"
          local removed=0
          local f
          for f in "$SYMBOLS_DIR"/*; do
            [ -f "$f" ] || continue
            if grep -qxF "  $symbol" "$f"; then
              sed -i "/^  ${symbol}\$/d" "$f"
              echo "  removed $symbol from $(basename "$f")"
              removed=1
            fi
          done
          if [ "$removed" = 0 ]; then
            echo "  $symbol not listed in any symbol list, nothing to remove"
          fi
        }

        if [ ! -d "$SYMBOLS_DIR" ]; then
          echo "  no common/gki/aarch64/symbols directory in this tree, nothing to do, skipping"
        else
          echo "  -- Rust Binder tracepoint symbols --"
          if [ "$RUST_BINDER_ENABLED" = "true" ]; then
            echo "  Rust Binder is enabled for this build, leaving its KMI symbols alone"
          else
            for sym in \
              RUST_BINDER_LAYOUT \
              __traceiter_android_vh_rust_binder_looper_entry \
              __traceiter_android_vh_rust_binder_restore_priority \
              __traceiter_android_vh_rust_binder_set_priority \
              __tracepoint_android_vh_rust_binder_looper_entry \
              __tracepoint_android_vh_rust_binder_restore_priority \
              __tracepoint_android_vh_rust_binder_set_priority \
            ; do
              remove_symbol "$sym"
            done
          fi

          echo "  -- ashmem symbols --"
          if [ "$ASHMEM_ENABLED" = "true" ]; then
            echo "  ashmem is enabled for this build, leaving its KMI symbols alone"
          else
            for sym in ashmem_area_name ashmem_area_size ashmem_area_vmfile is_ashmem_file; do
              remove_symbol "$sym"
            done
          fi
        fi
