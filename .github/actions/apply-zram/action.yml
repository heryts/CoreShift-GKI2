name: CloudFox zram (LZ4KD/LZ4KDR + LZ4/ZSTD version bump) + SukiSU LZ4K/LZ4KD/LZ4K_OPLUS
description: >
  kernel_version=5.10   -> CloudFox-Kernel's LZ4KD/LZ4KDR + LZ4 1.10.0/NEON (zzh).
  kernel_version=6.1/6.6 -> SukiSU LZ4K/LZ4KD/LZ4K_OPLUS + LZ4 1.10.0/NEON (zzh).
  kernel_version=6.12   -> lz4 1.10.0 / zstd 1.5.7.
  Any other kernel_version -> skipped, no-op.
inputs:
  kernel_version:
    required: true
    description: Kernel version to build.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        ROOT_DIR="$GITHUB_WORKSPACE"
        COMMON_DIR="${KERNEL_COMMON_DIR:-$ROOT_DIR/kernel/common}"

        VER="${{ inputs.kernel_version }}"
        PATCH_DIR="$ROOT_DIR/.github/patches/zram/$VER"

        apply_git_patch() {
          local patch_file="$1"
          local label
          label="$(basename "$patch_file")"

          if [ ! -f "$patch_file" ]; then
            echo "::error::patch file missing: $patch_file"
            exit 1
          fi

          if git -C "$COMMON_DIR" apply --check "$patch_file" 2>/dev/null; then
            git -C "$COMMON_DIR" apply "$patch_file"
            echo "  applied $label"
          elif git -C "$COMMON_DIR" apply --reverse --check "$patch_file" 2>/dev/null; then
            echo "  $label already applied, skipping"
          else
            echo "::error::$label does not apply cleanly to this source tree (and is not already applied)"
            git -C "$COMMON_DIR" apply --check "$patch_file" || true
            exit 1
          fi
        }

        apply_gnu_patch() {
          local patch_file="$1"
          local label
          label="$(basename "$patch_file")"

          if [ ! -f "$patch_file" ]; then
            echo "::error::patch file missing: $patch_file"
            exit 1
          fi

          if patch --batch --forward -p1 -d "$COMMON_DIR" < "$patch_file"; then
            echo "  applied (or already applied) $label"
          else
            echo "::error::$label failed to apply cleanly to $COMMON_DIR"
            exit 1
          fi
        }

        if [ "${{ inputs.kernel_version }}" = "5.10" ]; then

        if [ ! -d "$PATCH_DIR" ]; then
          echo "::error::patch directory missing: $PATCH_DIR"
          exit 1
        fi

        echo "== lz4kd: applying patch (LZ4KD/LZ4KDR) =="
        apply_git_patch "$PATCH_DIR/0001-add-lz4kd-lz4kdr.patch"

        echo "== lz4kd: applying modify patch (ZRAM_MULTI_COMP) =="
        apply_git_patch "$PATCH_DIR/0002-modify-zram-multicomp.patch"

        echo "== lz4kd: patching crypto/Kconfig =="
        if grep -q '^config CRYPTO_LZ4KDR$' "$COMMON_DIR/crypto/Kconfig"; then
          echo "  already present, skipping"
        else
          python3 - "$COMMON_DIR/crypto/Kconfig" <<'PYEOF'
        import sys

        path = sys.argv[1]
        snippet = """config CRYPTO_LZ4KDR
        \ttristate "LZ4KDR compression algorithm"
        \tselect CRYPTO_ALGAPI
        \tselect LZ4KDR_COMPRESS
        \tselect LZ4KDR_DECOMPRESS
        \thelp
        \t  LZ4KDR is a speed-tuned derivative of Huawei's LZ4KD, a
        \t  zram-oriented LZ4 variant wire-compatible with the original
        \t  LZ4KD encoding. This driver registers the legacy
        \t  CRYPTO_ALG_TYPE_COMPRESS interface used by zram's zcomp.
        \t  See include/linux/lz4kdr.h for the attribution note.

        config CRYPTO_LZ4KD
        \ttristate "LZ4KD compression algorithm"
        \tselect CRYPTO_ALGAPI
        \tselect LZ4KD_COMPRESS
        \tselect LZ4KD_DECOMPRESS
        \thelp
        \t  LZ4KD is Huawei's zram-oriented LZ4 variant with delta
        \t  compression support, imported verbatim from the Huawei P50
        \t  (ABR-AL60) HarmonyOS 4.0.0 kernel open source release.
        \t  This driver registers the legacy CRYPTO_ALG_TYPE_COMPRESS
        \t  interface used by zram's zcomp.
        \t  See include/linux/lz4kd.h for the algorithm documentation.

        """
        with open(path) as fh:
            content = fh.read()
        marker = "config CRYPTO_ZSTD\n"
        idx = content.index(marker)
        content = content[:idx] + snippet + content[idx:]
        with open(path, "w") as fh:
            fh.write(content)
        PYEOF
          echo "  inserted CRYPTO_LZ4KDR / CRYPTO_LZ4KD before config CRYPTO_ZSTD"
        fi

        echo "== lz4kd: patching lib/Kconfig =="
        if grep -q '^config LZ4KDR_COMPRESS$' "$COMMON_DIR/lib/Kconfig"; then
          echo "  already present, skipping"
        else
          python3 - "$COMMON_DIR/lib/Kconfig" <<'PYEOF'
        import sys

        path = sys.argv[1]
        snippet = """config LZ4KDR_COMPRESS
        \ttristate

        config LZ4KDR_DECOMPRESS
        \ttristate

        config LZ4KD_COMPRESS
        \ttristate

        config LZ4KD_DECOMPRESS
        \ttristate

        """
        with open(path) as fh:
            content = fh.read()
        marker = "config LZ4_DECOMPRESS\n"
        idx = content.index(marker)
        content = content[:idx] + snippet + content[idx:]
        with open(path, "w") as fh:
            fh.write(content)
        PYEOF
          echo "  inserted LZ4KDR_COMPRESS/DECOMPRESS, LZ4KD_COMPRESS/DECOMPRESS before config LZ4_DECOMPRESS"
        fi

        echo "== lz4kd: patching crypto/Makefile =="
        if grep -qF 'CONFIG_CRYPTO_LZ4KDR' "$COMMON_DIR/crypto/Makefile"; then
          echo "  already present, skipping"
        else
          sed -i '/^obj-\$(CONFIG_CRYPTO_LZ4HC) += lz4hc\.o$/a obj-$(CONFIG_CRYPTO_LZ4KDR) += lz4kdr.o\nobj-$(CONFIG_CRYPTO_LZ4KD) += lz4kd.o' \
            "$COMMON_DIR/crypto/Makefile"
          echo "  inserted obj-\$(CONFIG_CRYPTO_LZ4KDR)/LZ4KD lines after lz4hc.o"
        fi

        echo "== lz4kd: patching lib/Makefile =="
        if grep -qF 'CONFIG_LZ4KDR_COMPRESS' "$COMMON_DIR/lib/Makefile"; then
          echo "  already present, skipping"
        else
          sed -i '/^obj-\$(CONFIG_LZ4_DECOMPRESS) += lz4\/$/a obj-$(CONFIG_LZ4KDR_COMPRESS) += lz4kdr/\nobj-$(CONFIG_LZ4KDR_DECOMPRESS) += lz4kdr/\nobj-$(CONFIG_LZ4KD_COMPRESS) += lz4kd/\nobj-$(CONFIG_LZ4KD_DECOMPRESS) += lz4kd/' \
            "$COMMON_DIR/lib/Makefile"
          echo "  inserted obj-\$(CONFIG_LZ4KDR_*)/LZ4KD_* lines after lz4/ (decompress)"
        fi

        echo "== zram (5.10): applying LZ4K/LZ4KD/LZ4K_OPLUS + LZ4 1.10.0/NEON + deflate backend (merged) =="
        apply_git_patch "$PATCH_DIR/0004-lz4k-lz4kd-lz4k_oplus-neon-deflate.patch"

        echo "== zram (5.10): sanity-checking LZ4K/LZ4K_OPLUS patches =="
        for f in \
          crypto/lz4k.c \
          lib/lz4k_oplus/lz4k_compress.c \
        ; do
          if [ ! -f "$COMMON_DIR/$f" ]; then
            echo "::error::expected file missing after patch: $COMMON_DIR/$f"
            exit 1
          fi
        done
        if ! grep -q '^config CRYPTO_LZ4K$' "$COMMON_DIR/crypto/Kconfig"; then
          echo "::error::CONFIG_CRYPTO_LZ4K symbol not found in crypto/Kconfig after patch apply"
          exit 1
        fi
        if [ "$(grep -c '^config CRYPTO_LZ4KD$' "$COMMON_DIR/crypto/Kconfig")" != "1" ]; then
          echo "::error::CONFIG_CRYPTO_LZ4KD is defined more than once in crypto/Kconfig (duplicate symbol) - integration patch is stale for this source tree"
          exit 1
        fi

        echo "== lz4kd: patching lib/cmdline.c (EXPORT_SYMBOL next_arg) =="
        CMDLINE_FILE="$COMMON_DIR/lib/cmdline.c"
        if [ ! -f "$CMDLINE_FILE" ]; then
          echo "::error::lib/cmdline.c missing: $CMDLINE_FILE"
          exit 1
        fi
        if grep -q 'EXPORT_SYMBOL(next_arg)' "$CMDLINE_FILE"; then
          echo "  already present, skipping"
        elif ! grep -q '^char \*next_arg(char \*args, char \*\*param, char \*\*val)$' "$CMDLINE_FILE"; then
          echo "::error::next_arg() definition not found in lib/cmdline.c - can't safely append its EXPORT_SYMBOL"
          exit 1
        else
          printf '\nEXPORT_SYMBOL(next_arg);\n' >> "$CMDLINE_FILE"
          echo "  appended EXPORT_SYMBOL(next_arg) to end of file"
        fi

        echo "== lz4kd: patching common/android/gki_aarch64_modules =="
        MODULES_LIST="$COMMON_DIR/android/gki_aarch64_modules"
        if [ ! -f "$MODULES_LIST" ]; then
          echo "::error::gki_aarch64_modules missing: $MODULES_LIST"
          exit 1
        fi

        echo "== lz4kd: removing any stale built-in-driver entries from a previous run =="
        for m in \
          mm/zsmalloc.ko \
          crypto/lzo.ko \
          crypto/lzo-rle.ko \
          drivers/block/zram/zram.ko \
        ; do
          if grep -qxF "$m" "$MODULES_LIST"; then
            sed -i "\|^${m//\//\\/}\$|d" "$MODULES_LIST"
            echo "  removed stale entry $m"
          fi
        done

        echo "== lz4kd: patching android/abi_gki_aarch64_generic (KMI symbol list) =="
        SYMLIST="$COMMON_DIR/android/abi_gki_aarch64_generic"
        if [ ! -f "$SYMLIST" ]; then
          echo "::error::abi_gki_aarch64_generic missing: $SYMLIST"
          exit 1
        fi
        for s in next_arg proc_dou8vec_minmax; do
          if grep -qxF "  $s" "$SYMLIST"; then
            echo "  $s already listed, skipping"
          else
            sed -i "/^\[abi_symbol_list\]$/a\\  $s" "$SYMLIST"
            echo "  added $s"
          fi
        done

        echo "== module-skip-builtin: applying CONFIG_MODULE_SKIP_BUILTIN patch =="
        MSB_PATCH="$PATCH_DIR/0003-module-skip-loading-drivers-into-vmlinux.patch"
        if [ ! -f "$MSB_PATCH" ]; then
          echo "::error::patch file missing: $MSB_PATCH"
          echo "::error::copy 0003-module-skip-loading-drivers-into-vmlinux.patch into $(dirname "$MSB_PATCH")"
          exit 1
        fi
        apply_git_patch "$MSB_PATCH"

        echo "== module-skip-builtin: sanity-checking touched files =="
        for f in init/Kconfig kernel/module-internal.h kernel/module.c scripts/link-vmlinux.sh; do
          if [ ! -f "$COMMON_DIR/$f" ]; then
            echo "::error::expected file missing after patch: $COMMON_DIR/$f"
            exit 1
          fi
        done
        if ! grep -q '^config MODULE_SKIP_BUILTIN$' "$COMMON_DIR/init/Kconfig"; then
          echo "::error::CONFIG_MODULE_SKIP_BUILTIN symbol not found in init/Kconfig after patch apply"
          exit 1
        fi

        echo "== zram (5.10): sanity-checking NEON patch =="
        if ! grep -q 'LZ4_arm64_decompress_safe' "$COMMON_DIR/crypto/lz4.c"; then
          echo "::error::crypto/lz4.c missing LZ4_arm64_decompress_safe after patch apply"
          exit 1
        fi
        if [ ! -f "$COMMON_DIR/lib/lz4/lz4.c" ] || [ ! -f "$COMMON_DIR/lib/lz4/lz4hc.c" ]; then
          echo "::error::lib/lz4/lz4.c or lz4hc.c missing after LZ4 1.10.0 patch apply"
          exit 1
        fi

        echo "== zram (5.10): sanity-checking deflate backend =="
        if ! grep -q 'CONFIG_CRYPTO_DEFLATE' "$COMMON_DIR/drivers/block/zram/zcomp.c"; then
          echo "::error::deflate backend not found in zcomp.c after patch apply"
          exit 1
        fi

        echo "== lz4kd (5.10): done =="

        elif [ "${{ inputs.kernel_version }}" = "6.12" ]; then

        if [ ! -d "$PATCH_DIR" ]; then
          echo "::error::patch directory missing: $PATCH_DIR"
          exit 1
        fi

        echo "== zram: applying LZ4 1.10.0 =="
        apply_gnu_patch "$PATCH_DIR/lz4-1.10.0.patch"

        echo "== zram: applying ZSTD 1.5.7 =="
        apply_gnu_patch "$PATCH_DIR/zstd-1.5.7.patch"

        echo "== zram: sanity-checking touched files =="
        for f in \
          lib/lz4/lz4armv8/lz4armv8.S \
          lib/lz4/lz4armv8/lz4accel.c \
          lib/zstd/compress/zstd_compress.c \
        ; do
          if [ ! -f "$COMMON_DIR/$f" ]; then
            echo "::error::expected file missing after patch: $COMMON_DIR/$f"
            exit 1
          fi
        done

        if ! grep -q 'LZ4_arm64_decompress_safe' "$COMMON_DIR/crypto/lz4.c"; then
          echo "::error::crypto/lz4.c missing LZ4_arm64_decompress_safe after patch apply"
          exit 1
        fi

        if ! grep -q 'module_param(compression_level' "$COMMON_DIR/crypto/zstd.c"; then
          echo "::error::crypto/zstd.c missing compression_level module_param after patch apply"
          exit 1
        fi

        echo "== zram: restoring legacy zstd dictionary/advanced API for backend_zstd.c =="
        ZSTD_BACKEND="$COMMON_DIR/drivers/block/zram/backend_zstd.c"
        ZSTD_H="$COMMON_DIR/include/linux/zstd.h"
        ZSTD_COMPRESS_MOD="$COMMON_DIR/lib/zstd/zstd_compress_module.c"
        ZSTD_DECOMPRESS_MOD="$COMMON_DIR/lib/zstd/zstd_decompress_module.c"

        if [ ! -f "$ZSTD_BACKEND" ]; then
          echo "  no drivers/block/zram/backend_zstd.c in this tree, nothing to restore, skipping"
        elif grep -q 'zstd_create_cdict_byreference' "$ZSTD_H" 2>/dev/null; then
          echo "  legacy dictionary API already present, skipping"
        else
          for f in "$ZSTD_H" "$ZSTD_COMPRESS_MOD" "$ZSTD_DECOMPRESS_MOD"; do
            if [ ! -f "$f" ]; then
              echo "::error::expected file missing, can't restore legacy zstd API: $f"
              exit 1
            fi
          done

          python3 - "$ZSTD_H" "$ZSTD_COMPRESS_MOD" "$ZSTD_DECOMPRESS_MOD" <<'PYEOF'
        import sys

        zstd_h, compress_mod, decompress_mod = sys.argv[1:4]

        def insert_after(path, marker, snippet):
            with open(path) as fh:
                content = fh.read()
            if marker not in content:
                raise SystemExit(f"::error::marker not found in {path}: {marker!r}")
            idx = content.index(marker) + len(marker)
            content = content[:idx] + snippet + content[idx:]
            with open(path, "w") as fh:
                fh.write(content)

        def insert_before(path, marker, snippet):
            with open(path) as fh:
                content = fh.read()
            if marker not in content:
                raise SystemExit(f"::error::marker not found in {path}: {marker!r}")
            idx = content.index(marker)
            content = content[:idx] + snippet + content[idx:]
            with open(path, "w") as fh:
                fh.write(content)

        # ---- include/linux/zstd.h ----

        insert_before(zstd_h, "/* ======   Parameter Selection   ====== */", """/**
         * zstd_default_clevel() - default compression level
         *
         * Return: Default compression level.
         */
        int zstd_default_clevel(void);

        /**
         * struct zstd_custom_mem - custom memory allocation
         */
        typedef ZSTD_customMem zstd_custom_mem;

        /**
         * struct zstd_dict_load_method - Dictionary load method.
         * See zstd_lib.h.
         */
        typedef ZSTD_dictLoadMethod_e zstd_dict_load_method;

        /**
         * struct zstd_dict_content_type - Dictionary context type.
         * See zstd_lib.h.
         */
        typedef ZSTD_dictContentType_e zstd_dict_content_type;

        """)

        insert_after(zstd_h, "zstd_parameters zstd_get_params(int level,\n\tunsigned long long estimated_src_size);\n", """
        /**
         * zstd_get_cparams() - returns zstd_compression_parameters for selected level
         * @level:              The compression level
         * @estimated_src_size: The estimated source size to compress or 0
         *                      if unknown.
         * @dict_size:          Dictionary size.
         *
         * Return:              The selected zstd_compression_parameters.
         */
        zstd_compression_parameters zstd_get_cparams(int level,
        \tunsigned long long estimated_src_size, size_t dict_size);
        """)

        insert_after(zstd_h, "zstd_cctx *zstd_init_cctx(void *workspace, size_t workspace_size);\n", """
        /**
         * zstd_create_cctx_advanced() - Create compression context
         * @custom_mem:   Custom allocator.
         *
         * Return:        NULL on error, pointer to compression context otherwise.
         */
        zstd_cctx *zstd_create_cctx_advanced(zstd_custom_mem custom_mem);

        /**
         * zstd_free_cctx() - Free compression context
         * @cdict:        Pointer to compression context.
         *
         * Return:        Always 0.
         */
        size_t zstd_free_cctx(zstd_cctx* cctx);

        /**
         * struct zstd_cdict - Compression dictionary.
         * See zstd_lib.h.
         */
        typedef ZSTD_CDict zstd_cdict;

        /**
         * zstd_create_cdict_byreference() - Create compression dictionary
         * @dict:              Pointer to dictionary buffer.
         * @dict_size:         Size of the dictionary buffer.
         * @cparams:           Compression parameters.
         * @custom_mem:        Memory allocator.
         *
         * Note, this uses @dict by reference (ZSTD_dlm_byRef), so it should be
         * free before zstd_cdict is destroyed.
         *
         * Return:             NULL on error, pointer to compression dictionary
         *                     otherwise.
         */
        zstd_cdict *zstd_create_cdict_byreference(const void *dict, size_t dict_size,
        \t\t\t\t\t  zstd_compression_parameters cparams,
        \t\t\t\t\t  zstd_custom_mem custom_mem);

        /**
         * zstd_free_cdict() - Free compression dictionary
         * @cdict:        Pointer to compression dictionary.
         *
         * Return:        Always 0.
         */
        size_t zstd_free_cdict(zstd_cdict* cdict);

        /**
         * zstd_compress_using_cdict() - compress src into dst using a dictionary
         * @cctx:         The context. Must have been initialized with zstd_init_cctx().
         * @dst:          The buffer to compress src into.
         * @dst_capacity: The size of the destination buffer.
         * @src:          The data to compress.
         * @src_size:     The size of the data to compress.
         * @cdict:        The dictionary to be used.
         *
         * Return:        The compressed size or an error, which can be checked using
         *                zstd_is_error().
         */
        size_t zstd_compress_using_cdict(zstd_cctx *cctx, void *dst,
        \tsize_t dst_capacity, const void *src, size_t src_size,
        \tconst zstd_cdict *cdict);
        """)

        insert_after(zstd_h, "zstd_dctx *zstd_init_dctx(void *workspace, size_t workspace_size);\n", """
        /**
         * zstd_create_dctx_advanced() - Create decompression context
         * @custom_mem:   Custom allocator.
         *
         * Return:        NULL on error, pointer to decompression context otherwise.
         */
        zstd_dctx *zstd_create_dctx_advanced(zstd_custom_mem custom_mem);

        /**
         * zstd_free_dctx() -- Free decompression context
         * @dctx:         Pointer to decompression context.
         * Return:        Always 0.
         */
        size_t zstd_free_dctx(zstd_dctx *dctx);

        /**
         * struct zstd_ddict - Decompression dictionary.
         * See zstd_lib.h.
         */
        typedef ZSTD_DDict zstd_ddict;

        /**
         * zstd_create_ddict_byreference() - Create decompression dictionary
         * @dict:              Pointer to dictionary buffer.
         * @dict_size:         Size of the dictionary buffer.
         * @custom_mem:        Memory allocator.
         *
         * Note, this uses @dict by reference (ZSTD_dlm_byRef), so it should be
         * free before zstd_ddict is destroyed.
         *
         * Return:             NULL on error, pointer to decompression dictionary
         *                     otherwise.
         */
        zstd_ddict *zstd_create_ddict_byreference(const void *dict, size_t dict_size,
        \t\t\t\t\t  zstd_custom_mem custom_mem);
        /**
         * zstd_free_ddict() - Free decompression dictionary
         * @dict:         Pointer to the dictionary.
         *
         * Return:        Always 0.
         */
        size_t zstd_free_ddict(zstd_ddict *ddict);

        /**
         * zstd_decompress_using_ddict() - decompress src into dst using a dictionary
         * @dctx:         The decompression context.
         * @dst:          The buffer to decompress src into.
         * @dst_capacity: The size of the destination buffer.
         * @src:          The zstd compressed data to decompress.
         * @src_size:     The exact size of the data to decompress.
         * @ddict:        The dictionary to be used.
         *
         * Return:        The decompressed size or an error, which can be checked using
         *                zstd_is_error().
         */
        size_t zstd_decompress_using_ddict(zstd_dctx *dctx,
        \tvoid *dst, size_t dst_capacity, const void *src, size_t src_size,
        \tconst zstd_ddict *ddict);
        """)

        # ---- lib/zstd/zstd_compress_module.c ----

        insert_after(compress_mod, "EXPORT_SYMBOL(zstd_max_clevel);\n", """
        int zstd_default_clevel(void)
        {
        \treturn ZSTD_defaultCLevel();
        }
        EXPORT_SYMBOL(zstd_default_clevel);
        """)

        insert_after(compress_mod, "EXPORT_SYMBOL(zstd_get_params);\n", """
        zstd_compression_parameters zstd_get_cparams(int level,
        \tunsigned long long estimated_src_size, size_t dict_size)
        {
        \treturn ZSTD_getCParams(level, estimated_src_size, dict_size);
        }
        EXPORT_SYMBOL(zstd_get_cparams);
        """)

        insert_after(compress_mod, "EXPORT_SYMBOL(zstd_init_cctx);\n", """
        zstd_cctx *zstd_create_cctx_advanced(zstd_custom_mem custom_mem)
        {
        \treturn ZSTD_createCCtx_advanced(custom_mem);
        }
        EXPORT_SYMBOL(zstd_create_cctx_advanced);

        size_t zstd_free_cctx(zstd_cctx *cctx)
        {
        \treturn ZSTD_freeCCtx(cctx);
        }
        EXPORT_SYMBOL(zstd_free_cctx);

        zstd_cdict *zstd_create_cdict_byreference(const void *dict, size_t dict_size,
        \t\t\t\t\t  zstd_compression_parameters cparams,
        \t\t\t\t\t  zstd_custom_mem custom_mem)
        {
        \treturn ZSTD_createCDict_advanced(dict, dict_size, ZSTD_dlm_byRef,
        \t\t\t\t\t ZSTD_dct_auto, cparams, custom_mem);
        }
        EXPORT_SYMBOL(zstd_create_cdict_byreference);

        size_t zstd_free_cdict(zstd_cdict *cdict)
        {
        \treturn ZSTD_freeCDict(cdict);
        }
        EXPORT_SYMBOL(zstd_free_cdict);
        """)

        insert_after(compress_mod, "EXPORT_SYMBOL(zstd_compress_cctx);\n", """
        size_t zstd_compress_using_cdict(zstd_cctx *cctx, void *dst,
        \tsize_t dst_capacity, const void *src, size_t src_size,
        \tconst ZSTD_CDict *cdict)
        {
        \treturn ZSTD_compress_usingCDict(cctx, dst, dst_capacity,
        \t\t\t\t\tsrc, src_size, cdict);
        }
        EXPORT_SYMBOL(zstd_compress_using_cdict);
        """)

        # ---- lib/zstd/zstd_decompress_module.c ----

        insert_after(decompress_mod, "EXPORT_SYMBOL(zstd_dctx_workspace_bound);\n", """
        zstd_dctx *zstd_create_dctx_advanced(zstd_custom_mem custom_mem)
        {
        \treturn ZSTD_createDCtx_advanced(custom_mem);
        }
        EXPORT_SYMBOL(zstd_create_dctx_advanced);

        size_t zstd_free_dctx(zstd_dctx *dctx)
        {
        \treturn ZSTD_freeDCtx(dctx);
        }
        EXPORT_SYMBOL(zstd_free_dctx);

