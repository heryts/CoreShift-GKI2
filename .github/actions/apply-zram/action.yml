- name: CloudFox LZ4KDR + Addon ZRAM(5.10)
  if: inputs.use_zram && inputs.kernel_version == '5.10'
  working-directory: ${{ env.KERNEL_ROOT }}/common
  run: |
    set -euo pipefail

    COREFOX_PATCHES="${COREFOX_PATCHES:-$GITHUB_WORKSPACE/coreshift_zram_patches}"
    MERGE_ASSETS="${MERGE_ASSETS:-$GITHUB_WORKSPACE/.github/zram-merge-assets}"

    echo "== [1/7] timpa crypto/lz4kd.c + lib/lz4kd/* dengan versi CoreShift =="
    cp -f "$MERGE_ASSETS/lz4kd-coreshift/crypto/lz4kd.c" crypto/lz4kd.c
    cp -f "$MERGE_ASSETS/lz4kd-coreshift/include/linux/lz4kd.h" include/linux/lz4kd.h
    mkdir -p lib/lz4kd
    cp -f "$MERGE_ASSETS/lz4kd-coreshift/lib/lz4kd/"* lib/lz4kd/

    echo "== [2/7] copy-in lz4kdr (baru) =="
    cp -f "$MERGE_ASSETS/lz4kdr-coreshift/crypto/lz4kdr.c" crypto/lz4kdr.c
    cp -f "$MERGE_ASSETS/lz4kdr-coreshift/include/linux/lz4kdr.h" include/linux/lz4kdr.h
    mkdir -p lib/lz4kdr
    cp -f "$MERGE_ASSETS/lz4kdr-coreshift/lib/lz4kdr/"* lib/lz4kdr/

    echo "== [3/7] tambah entry Kconfig/Makefile KHUSUS lz4kdr (lz4kd sudah ada dari SukiSU) =="
    if ! grep -q '^config CRYPTO_LZ4KDR$' crypto/Kconfig; then
      python3 - crypto/Kconfig <<'PYEOF'
    import sys
    path = sys.argv[1]
    snippet = """config CRYPTO_LZ4KDR
    \ttristate "LZ4KDR compression algorithm"
    \tselect CRYPTO_ALGAPI
    \tselect LZ4KDR_COMPRESS
    \tselect LZ4KDR_DECOMPRESS
    \thelp
    \t  LZ4KDR is a speed-tuned derivative of Huawei's LZ4KD, a
    \t  zram-oriented LZ4 variant wire-compatible with the original
    \t  LZ4KD encoding. This driver registers the legacy
    \t  CRYPTO_ALG_TYPE_COMPRESS interface used by zram's zcomp.
    \t  See include/linux/lz4kdr.h for the attribution note.

    """
    with open(path) as fh:
        content = fh.read()
    marker = "config CRYPTO_ZSTD\n"
    idx = content.index(marker)
    content = content[:idx] + snippet + content[idx:]
    with open(path, "w") as fh:
        fh.write(content)
    PYEOF
      echo "  inserted CRYPTO_LZ4KDR before config CRYPTO_ZSTD"
    else
      echo "  CRYPTO_LZ4KDR already present, skipping"
    fi

    if ! grep -q '^config LZ4KDR_COMPRESS$' lib/Kconfig; then
      python3 - lib/Kconfig <<'PYEOF'
    import sys
    path = sys.argv[1]
    snippet = """config LZ4KDR_COMPRESS
    \ttristate

    config LZ4KDR_DECOMPRESS
    \ttristate

    """
    with open(path) as fh:
        content = fh.read()
    marker = "config ZSTD_COMPRESS\n"
    idx = content.index(marker)
    content = content[:idx] + snippet + content[idx:]
    with open(path, "w") as fh:
        fh.write(content)
    PYEOF
      echo "  inserted LZ4KDR_COMPRESS/DECOMPRESS before config ZSTD_COMPRESS"
    else
      echo "  LZ4KDR_COMPRESS already present, skipping"
    fi

    if ! grep -qF 'CONFIG_CRYPTO_LZ4KDR' crypto/Makefile; then
      sed -i '/^obj-\$(CONFIG_CRYPTO_LZ4KD) += lz4kd\.o$/a obj-$(CONFIG_CRYPTO_LZ4KDR) += lz4kdr.o' crypto/Makefile
      echo "  inserted obj-\$(CONFIG_CRYPTO_LZ4KDR) after lz4kd.o"
    fi

    if ! grep -qF 'CONFIG_LZ4KDR_COMPRESS' lib/Makefile; then
      sed -i '/^obj-\$(CONFIG_LZ4KD_DECOMPRESS) += lz4kd\/$/a obj-$(CONFIG_LZ4KDR_COMPRESS) += lz4kdr/\nobj-$(CONFIG_LZ4KDR_DECOMPRESS) += lz4kdr/' lib/Makefile
      echo "  inserted obj-\$(CONFIG_LZ4KDR_COMPRESS)/DECOMPRESS after lz4kd/"
    fi

    echo "== [4/7] timpa choice block + backends[] dengan versi gabungan =="
    python3 - drivers/block/zram/Kconfig "$MERGE_ASSETS/zram-kconfig-choice-merged.txt" <<'PYEOF'
    import re, sys
    kconfig_path, snippet_path = sys.argv[1], sys.argv[2]
    with open(kconfig_path) as f:
        content = f.read()
    with open(snippet_path) as f:
        merged = f.read()
    content = content.replace(
        "depends on CRYPTO_LZO || CRYPTO_ZSTD || CRYPTO_LZ4 || CRYPTO_LZ4HC || CRYPTO_842 || CRYPTO_LZ4K || CRYPTO_LZ4K_OPLUS || CRYPTO_LZ4KD || CRYPTO_DEFLATE",
        "depends on CRYPTO_LZO || CRYPTO_ZSTD || CRYPTO_LZ4 || CRYPTO_LZ4HC || CRYPTO_842 || CRYPTO_LZ4K || CRYPTO_LZ4K_OPLUS || CRYPTO_LZ4KD || CRYPTO_LZ4KDR || CRYPTO_DEFLATE",
    )
    pattern = re.compile(r"choice\n\tprompt \"Default zram compressor\".*?default \"deflate\" if ZRAM_DEF_COMP_DEFLATE\n", re.DOTALL)
    if not pattern.search(content):
        print("::error::pola choice block SukiSU tidak ketemu - cek manual, jangan lanjut build")
        sys.exit(1)
    content = pattern.sub(merged, content)
    with open(kconfig_path, "w") as f:
        f.write(content)
    PYEOF
    echo "  drivers/block/zram/Kconfig choice block diganti"

    python3 - drivers/block/zram/zcomp.c "$MERGE_ASSETS/zcomp-backends-merged.txt" <<'PYEOF'
    import re, sys
    zcomp_path, snippet_path = sys.argv[1], sys.argv[2]
    with open(zcomp_path) as f:
        content = f.read()
    with open(snippet_path) as f:
        merged = f.read()
    pattern = re.compile(r"static const char \* const backends\[\] = \{.*?\n\};\n", re.DOTALL)
    if not pattern.search(content):
        print("::error::pola backends[] tidak ketemu di zcomp.c - cek manual, jangan lanjut build")
        sys.exit(1)
    content = pattern.sub(merged, content)
    with open(zcomp_path, "w") as f:
        f.write(content)
    PYEOF
    echo "  drivers/block/zram/zcomp.c backends[] diganti"

    echo "== [5/7] apply sisa 0002 (arsitektur multi-comp, sudah dikupas 3 hunk konflik) =="
    if ! patch -p1 -F 10 < "$MERGE_ASSETS/0002-modify-zram-multicomp.stripped.patch"; then
      echo "::error::0002-modify-zram-multicomp.stripped.patch gagal apply - kemungkinan source tree sudah drift dari versi yang saya cek. JANGAN lanjut, lapor balik hunk mana yang gagal."
      exit 1
    fi

    echo "== [6/7] apply 0003 (MODULE_SKIP_BUILTIN) =="
    if ! patch -p1 -F 10 < "$MERGE_ASSETS/0003-module-skip-loading-drivers-into-vmlinux.patch"; then
      echo "::error::0003 gagal apply"
      exit 1
    fi

    echo "== [7/7] sanity check =="
    for sym in CRYPTO_LZ4KDR CRYPTO_LZ4KD CRYPTO_LZ4K CRYPTO_LZ4K_OPLUS ZRAM_MULTI_COMP MODULE_SKIP_BUILTIN; do
      if ! grep -q "config $sym\$" crypto/Kconfig drivers/block/zram/Kconfig init/Kconfig 2>/dev/null; then
        echo "::warning::config $sym tidak ketemu di manapun setelah merge - cek manual"
      fi
    done
    if grep -c '"lz4kd",' drivers/block/zram/zcomp.c | grep -qv '^1$'; then
      echo "::error::\"lz4kd\" muncul bukan 1x di backends[] zcomp.c - ada duplikat, merge gagal"
      exit 1
    fi
    echo "merge selesai, silakan lanjut ke step '配置 ZRAM 选项' (defconfig) seperti biasa"
